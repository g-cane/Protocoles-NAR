u003cth colspan=\"2\" class=\"grp\">\u003cem>Staphylococcus aureus\u003c/em>, \u003cem>Candida\u003c/em> spp.\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Hémoculture négative\u003c/td>\u003ctd>3 – 5 jours\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hémoculture positive sans complication à distance\u003c/td>\u003ctd>7 – 14 jours\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hémoculture positive et complication à distance\u003c/td>\u003ctd>4 à 6 semaines\u003c/td>\u003c/tr>\n\u003ctr>\u003cth colspan=\"2\" class=\"grp\">Entérobactéries, entérocoques, staphylocoques à coagulase négative\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Hémoculture négative\u003c/td>\u003ctd>Pas d’antibiothérapie*\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hémoculture positive sans complication à distance\u003c/td>\u003ctd>7 jours\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hémoculture positive et complication à distance\u003c/td>\u003ctd>4 à 6 semaines\u003c/td>\u003c/tr>\n\u003ctr>\u003cth colspan=\"2\" class=\"grp\">\u003cem>Pseudomonas aeruginosa\u003c/em>, \u003cem>Acinetobacter baumannii\u003c/em>\u003c/th>\u003c/tr>\n\u003ctr>\u003ctd>Hémoculture négative\u003c/td>\u003ctd>3 – 5 jours*\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hémoculture positive sans complication à distance\u003c/td>\u003ctd>7 jours\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Hémoculture positive et complication à distance\u003c/td>\u003ctd>4 à 6 semaines\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\n\u003cp>* Hémofiltration, emboles septiques, toxicomanie, chambre implantable, dispositif électronique intracardiaque, antécédent d’endocardite infectieuse, anomalie structurelle cardiaque.\u003c/p>\n","x":"Cathéter retiré dans un contexte fébrile et microbiologie positive : Situation Antibiothérapie et durée Staphylococcus aureus , Candida spp. Hémoculture négative 3 – 5 jours Hémoculture positive sans complication à distance 7 – 14 jours Hémoculture positive et complication à distance 4 à 6 semaines Entérobactéries, entérocoques, staphylocoques à coagulase négative Hémoculture négative Pas d’antibiothérapie* Hémoculture positive sans complication à distance 7 jours Hémoculture positive et complication à distance 4 à 6 semaines Pseudomonas aeruginosa , Acinetobacter baumannii Hémoculture négative 3 – 5 jours* Hémoculture positive sans complication à distance 7 jours Hémoculture positive et complication à distance 4 à 6 semaines * Hémofiltration, emboles septiques, toxicomanie, chambre implantable, dispositif électronique intracardiaque, antécédent d’endocardite infectieuse, anomalie structurelle cardiaque."},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1086/599376\" target=\"_blank\" rel=\"noopener noreferrer\">IDSA 2009 : Clinical Practice Guidelines for the Diagnosis and Management of Intravascular Catheter-Related Infection (Clin Infect Dis)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. IDSA 2009 : Clinical Practice Guidelines for the Diagnosis and Management of Intravascular Catheter-Related Infection (Clin Infect Dis)"}]},{"id":"rea-clostridium","s":"rea","t":"Colite à Clostridium difficile","c":"Clostridium difficile","g":"Infectiologie","i":"biohazard","p":[33],"r":"Quand prélever, diagnostic, mesures d’isolement et levée.","m":"Clostridium difficile, Clostridioides, diarrhée, toxine, colite pseudomembraneuse, isolement contact, sporicide","k":[{"t":"Quand prélever ?","i":"stethoscope","h":"\u003cul>\n\u003cli>Diarrhée (plus de 3 selles molles par jour)\u003c/li>\n\u003cli>Tableau abdominal aigu associé possible en cas de colite pseudomembraneuse ou de complication\u003c/li>\n\u003c/ul>\n","x":"Diarrhée (plus de 3 selles molles par jour) Tableau abdominal aigu associé possible en cas de colite pseudomembraneuse ou de complication"},{"t":"Diagnostic","i":"stethoscope","h":"\u003cul>\n\u003cli>Présence de \u003cstrong>toxine\u003c/strong> dans les selles\u003c/li>\n\u003cli>TDM abdomino-pelvienne et endoscopie à discuter selon les cas\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> \u003cstrong>Signes de gravité\u003c/strong> : fièvre, frissons, instabilité hémodynamique, abdomen chirurgical, hyperlactatémie, albuminémie &lt; 30 g/l\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Présence de toxine dans les selles TDM abdomino-pelvienne et endoscopie à discuter selon les cas Attention Signes de gravité : fièvre, frissons, instabilité hémodynamique, abdomen chirurgical, hyperlactatémie, albuminémie \u003c 30 g/l"},{"t":"Traitement","i":"pill","h":"\u003cp>Se référer à l’\u003ca class=\"ext\" href=\"https://www.epopi.fr\" target=\"_blank\" rel=\"noopener noreferrer\">ePOPI\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>.\u003c/p>\n","x":"Se référer à l’ ePOPI ."},{"t":"Mesures associées","i":"shield-check","h":"\u003cul>\n\u003cli>Isolement contact « Clostridium » = surblouse à manches longues + gants\u003c/li>\n\u003cli>Hygiène des mains \u003cstrong>au savon\u003c/strong>\u003c/li>\n\u003cli>Désinfection des surfaces avec un produit sporicide ou avec de l’eau de Javel\u003c/li>\n\u003c/ul>\n","x":"Isolement contact « Clostridium » = surblouse à manches longues + gants Hygiène des mains au savon Désinfection des surfaces avec un produit sporicide ou avec de l’eau de Javel"},{"t":"Levée des mesures d’isolement","i":"file-text","h":"\u003cul>\n\u003cli>\u003cstrong>72 h\u003c/strong> après la fin des symptômes\u003c/li>\n\u003cli>Pas de nouveau prélèvement nécessaire\u003c/li>\n\u003c/ul>\n","x":"72 h après la fin des symptômes Pas de nouveau prélèvement nécessaire"},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://pubmed.ncbi.nlm.nih.gov/?term=ESCMID+2021+update+treatment+guidance+Clostridioides+difficile+infection+adults+van+Prehn\" target=\"_blank\" rel=\"noopener noreferrer\">ESCMID 2021 : treatment guidance document for \u003cem>Clostridioides difficile\u003c/em> infection in adults (recherche PubMed)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. ESCMID 2021 : treatment guidance document for Clostridioides difficile infection in adults (recherche PubMed)"}]},{"id":"rea-candidose","s":"rea","t":"Candidose systémique","c":"Candidose systémique","g":"Infectiologie","i":"flask-conical","p":[34,35,36],"r":"Facteurs de risque, Candida score, Peritonitis score, algorithme, traitement, antifongiques.","m":"candidose, candidémie, Candida score, peritonitis score, mannane, bêta-D-glucane, caspofungine, micafungine, fluconazole, voriconazole, amphotéricine B, échinocandine, antifongique","k":[{"t":"Facteurs de risque","i":"search","h":"\u003cdiv class=\"cols\">\n\n\u003cul>\n\u003cli>Antibiothérapie préalable\u003c/li>\n\u003cli>Accès vasculaires\u003c/li>\n\u003cli>Ventilation invasive\u003c/li>\n\u003cli>Réanimation &gt; 7 jours\u003c/li>\n\u003cli>Nutrition parentérale exclusive\u003c/li>\n\u003cli>Colonisation fongique\u003c/li>\n\u003cli>Chirurgie abdominale récente\u003c/li>\n\u003cli>Insuffisance rénale\u003c/li>\n\u003cli>Score APACHE II &gt; 20\u003c/li>\n\u003cli>Hémodialyse\u003c/li>\n\u003cli>Hémopathie maligne\u003c/li>\n\u003cli>Cancer solide\u003c/li>\n\u003cli>Neutropénie\u003c/li>\n\u003cli>Corticothérapie prolongée\u003c/li>\n\u003cli>Immunosuppresseurs\u003c/li>\n\u003cli>Chimiothérapie\u003c/li>\n\u003c/ul>\n\u003c/div>\n","x":"Antibiothérapie préalable Accès vasculaires Ventilation invasive Réanimation > 7 jours Nutrition parentérale exclusive Colonisation fongique Chirurgie abdominale récente Insuffisance rénale Score APACHE II > 20 Hémodialyse Hémopathie maligne Cancer solide Neutropénie Corticothérapie prolongée Immunosuppresseurs Chimiothérapie"},{"t":"Scores","i":"list-ordered","h":"\u003ch3>Candida score\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Item\u003c/th>\n\u003cth align=\"center\">Point(s)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Nutrition parentérale exclusive\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Colonisation à \u003cem>Candida\u003c/em> spp.\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sepsis sévère\u003c/td>\n\u003ctd align=\"center\">2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Chirurgie à l’admission\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>Peritonitis score\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Item\u003c/th>\n\u003cth align=\"center\">Point(s)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>État de choc\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Perforation sus-mésocolique\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sexe féminin\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Antibiothérapie ≥ 48 h\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> Seuils utilisés dans l’algorithme : \u003cstrong>Candida score ≥ 2,5\u003c/strong> ou \u003cstrong>Peritonitis score ≥ 3\u003c/strong>\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Candida score Item Point(s) Nutrition parentérale exclusive 1 Colonisation à Candida spp. 1 Sepsis sévère 2 Chirurgie à l’admission 1 Peritonitis score Item Point(s) État de choc 1 Perforation sus-mésocolique 1 Sexe féminin 1 Antibiothérapie ≥ 48 h 1 Important Seuils utilisés dans l’algorithme : Candida score ≥ 2,5 ou Peritonitis score ≥ 3"},{"t":"Définitions","i":"info","h":"\u003cul>\n\u003cli>\u003cstrong>Colonisation\u003c/strong> : présence de \u003cem>Candida\u003c/em> spp. dans ≥ 50 % des sites prélevés concomitamment, sans retentissement clinique (très fréquente)\u003c/li>\n\u003cli>\u003cstrong>Candidose invasive\u003c/strong> : présence de \u003cem>Candida\u003c/em> spp. dans un site normalement stérile\u003c/li>\n\u003cli>\u003cstrong>Candidémie\u003c/strong> : une ou plusieurs hémocultures positives à \u003cem>Candida\u003c/em> spp.\u003c/li>\n\u003cli>\u003cstrong>Candidose disséminée\u003c/strong> : présence de \u003cem>Candida\u003c/em> spp. dans ≥ 2 sites non contigus\u003c/li>\n\u003c/ul>\n","x":"Colonisation : présence de Candida spp. dans ≥ 50 % des sites prélevés concomitamment, sans retentissement clinique (très fréquente) Candidose invasive : présence de Candida spp. dans un site normalement stérile Candidémie : une ou plusieurs hémocultures positives à Candida spp. Candidose disséminée : présence de Candida spp. dans ≥ 2 sites non contigus"},{"t":"Démarche diagnostique","i":"workflow","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/candidose-algo.webp\" data-legende=\"Figure 1 : Algorithme de prise en charge des candidoses systémiques\">\u003cimg src=\"figures/candidose-algo.webp\" alt=\"Figure 1 : Algorithme de prise en charge des candidoses systémiques\" width=\"1344\" height=\"679\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Figure 1 : Algorithme de prise en charge des candidoses systémiques\u003c/figcaption>\u003c/figure>\n\u003cp>Sepsis malgré une antibiothérapie ≥ 48 h :\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Hémoculture positive à \u003cem>Candida\u003c/em> spp.\u003c/strong> → traitement antifongique\u003c/li>\n\u003cli>Sinon, \u003cstrong>facteurs de risque de candidose invasive\u003c/strong> ? Non → pas de traitement antifongique\u003c/li>\n\u003cli>Si oui : \u003cstrong>Candida score ≥ 2,5 ou Peritonitis score ≥ 3\u003c/strong> ? Non → pas de traitement antifongique\u003c/li>\n\u003cli>Si oui : dosage Ag mannanes + Ac anti-mannanes + 1,3-β-D-glucane → positif : traitement antifongique ; négatif : pas de traitement antifongique\u003c/li>\n\u003c/ul>\n","x":"Agrandir Sepsis malgré une antibiothérapie ≥ 48 h : Hémoculture positive à Candida spp. → traitement antifongique Sinon, facteurs de risque de candidose invasive ? Non → pas de traitement antifongique Si oui : Candida score ≥ 2,5 ou Peritonitis score ≥ 3 ? Non → pas de traitement antifongique Si oui : dosage Ag mannanes + Ac anti-mannanes + 1,3-β-D-glucane → positif : traitement antifongique ; négatif : pas de traitement antifongique"},{"t":"Examens complémentaires","i":"test-tubes","h":"\u003ch3>Diagnostic positif\u003c/h3>\n\u003cul>\n\u003cli>Hémocultures\u003c/li>\n\u003cli>Sérologies :\u003cul>\n\u003cli>détection simultanée des Ac anti-mannanes et de l’Ag mannane de \u003cem>Candida\u003c/em> (chez le non-neutropénique) : Se 83 %, Sp 86 %, mais diminution de la spécificité pour \u003cem>C. parapsilosis\u003c/em>, \u003cem>C. krusei\u003c/em> et \u003cem>C. kefyr\u003c/em>\u003c/li>\n\u003cli>1,3-β-D-glucane &gt; 80 pg/ml (neutropénique ou non) : Se 77 %, Sp 85 %\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> Nombreux faux positifs du β-D-glucane : traitements par pipéracilline-tazobactam, immunoglobulines, facteurs de coagulation, albumine, chimiothérapies, hémodialyse, infections à BGN, streptocoque, aspergillose.\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003ch3>Bilan d’extension si candidose invasive\u003c/h3>\n\u003cul>\n\u003cli>Hémocultures répétées\u003c/li>\n\u003cli>Fond d’œil (atteinte oculaire chez 30 % des patients)\u003c/li>\n\u003cli>ETT (recherche d’endocardite)\u003c/li>\n\u003cli>LBA : sans valeur diagnostique pour une pneumopathie nosocomiale en réanimation, sauf chez le patient neutropénique\u003c/li>\n\u003c/ul>\n","x":"Diagnostic positif Hémocultures Sérologies : détection simultanée des Ac anti-mannanes et de l’Ag mannane de Candida (chez le non-neutropénique) : Se 83 %, Sp 86 %, mais diminution de la spécificité pour C. parapsilosis , C. krusei et C. kefyr 1,3-β-D-glucane > 80 pg/ml (neutropénique ou non) : Se 77 %, Sp 85 % Attention Nombreux faux positifs du β-D-glucane : traitements par pipéracilline-tazobactam, immunoglobulines, facteurs de coagulation, albumine, chimiothérapies, hémodialyse, infections à BGN, streptocoque, aspergillose. Bilan d’extension si candidose invasive Hémocultures répétées Fond d’œil (atteinte oculaire chez 30 % des patients) ETT (recherche d’endocardite) LBA : sans valeur diagnostique pour une pneumopathie nosocomiale en réanimation, sauf chez le patient neutropénique"},{"t":"Traitement","i":"pill","h":"\u003ch3>Probabiliste\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Caspofungine\u003c/strong> (incidence croissante de souches résistantes au fluconazole), adaptation secondaire\u003c/li>\n\u003cli>Échinocandines contre-indiquées si atteinte urinaire, oculaire ou méningée (mauvaise diffusion)\u003c/li>\n\u003cli>Si cathéter(s) : \u003cstrong>retrait nécessaire\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003ch3>Adaptation secondaire\u003c/h3>\n\u003cul>\n\u003cli>\u003cem>C. albicans\u003c/em>, \u003cem>C. glabrata\u003c/em>, \u003cem>C. krusei\u003c/em> : caspofungine ou micafungine (si contre-indication aux échinocandines : amphotéricine B) ; ajout de 5-fluorocytosine si localisation endocardique, oculaire ou méningée\u003c/li>\n\u003cli>\u003cem>C. parapsilosis\u003c/em> : fluconazole\u003c/li>\n\u003c/ul>\n\u003ch3>Durée totale de traitement\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>2 semaines\u003c/strong> après négativation des hémocultures si candidémie isolée et cathéter central retiré\u003c/li>\n\u003cli>\u003cstrong>6 semaines\u003c/strong> si endocardite sur valve native\u003c/li>\n\u003cli>\u003cstrong>6 mois\u003c/strong> si atteinte hépatosplénique, ostéoarticulaire\u003c/li>\n\u003c/ul>\n","x":"Probabiliste Caspofungine (incidence croissante de souches résistantes au fluconazole), adaptation secondaire Échinocandines contre-indiquées si atteinte urinaire, oculaire ou méningée (mauvaise diffusion) Si cathéter(s) : retrait nécessaire Adaptation secondaire C. albicans , C. glabrata , C. krusei : caspofungine ou micafungine (si contre-indication aux échinocandines : amphotéricine B) ; ajout de 5-fluorocytosine si localisation endocardique, oculaire ou méningée C. parapsilosis : fluconazole Durée totale de traitement 2 semaines après négativation des hémocultures si candidémie isolée et cathéter central retiré 6 semaines si endocardite sur valve native 6 mois si atteinte hépatosplénique, ostéoarticulaire"},{"t":"Principaux antifongiques","i":"syringe","h":"\u003cdiv class=\"table-wrap\">\u003ctable class=\"dense\">\n\u003cthead>\u003ctr>\u003cth>Classe\u003c/th>\u003cth>Nom\u003c/th>\u003cth>Posologie\u003c/th>\u003cth>Administration\u003c/th>\u003cth>Mécanisme\u003c/th>\u003cth>Remarques\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003cth rowspan=\"3\">Échinocandines\u003c/th>\u003ctd>\u003cstrong>Caspofungine\u003c/strong>\u003cbr>Cancidas®\u003c/td>\u003ctd>J1 = 70 mg × 1/j\u003cbr>puis 50 mg × 1/j (70 mg si > 80 kg ; 35 mg si CHILD B)\u003c/td>\u003ctd>IVL 60 min\u003c/td>\u003ctd rowspan=\"3\">Fongicide\u003cbr>Inhibiteur du 1,3-β-D-glucane → inhibe la synthèse membranaire\u003c/td>\u003ctd>CHILD C = à éviter\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>Micafungine\u003c/strong>\u003cbr>Mycamine®\u003c/td>\u003ctd>100 mg × 1/j\u003c/td>\u003ctd>IVL 60 min\u003c/td>\u003ctd>CHILD B/C = à éviter\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>Anidulafungine\u003c/strong>\u003c/td>\u003ctd>J1 = 200 mg × 1/j puis 100 mg × 1/j\u003c/td>\u003ctd>IVL 60 min\u003c/td>\u003ctd>Pas d’interaction avec le métabolisme hépatique\u003c/td>\u003c/tr>\n\u003ctr>\u003cth rowspan=\"2\">Triazolés\u003c/th>\u003ctd>\u003cstrong>Fluconazole\u003c/strong>\u003cbr>Triflucan®\u003c/td>\u003ctd>J1 = 800 mg × 1/j puis 400 mg/j\u003cbr>CVVHF : 12 mg/kg à J1 puis 6 mg/kg/j\u003cbr>HDI : 6 mg/kg après la séance\u003c/td>\u003ctd>PO ou IVL 60 min\u003c/td>\u003ctd rowspan=\"2\">Fongistatique\u003cbr>Inhibiteur du cytochrome P450 → inhibe la synthèse membranaire\u003c/td>\u003ctd>Bonne diffusion dans le LCR\u003cbr>Résistances en augmentation\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>Voriconazole\u003c/strong>\u003cbr>Vfend®\u003c/td>\u003ctd>IV : J1 6 mg/kg × 2/j puis 3 mg/kg × 2/j\u003cbr>PO : J1 400 mg × 1/j puis 200 mg × 2/j\u003c/td>\u003ctd>PO ou IVL 60 min\u003c/td>\u003ctd>\u003cem>Candida\u003c/em> → fongistatique\u003cbr>\u003cem>Aspergillus\u003c/em> → fongicide\u003c/td>\u003c/tr>\n\u003ctr>\u003cth rowspan=\"2\">Polyènes\u003c/th>\u003ctd>\u003cstrong>Amphotéricine B liposomale\u003c/strong>\u003c/td>\u003ctd>3 mg/kg × 1/j\u003c/td>\u003ctd>IVL 60 min\u003c/td>\u003ctd rowspan=\"2\">Fongicide\u003cbr>Dégradation par fixation sur les stérols membranaires\u003c/td>\u003ctd rowspan=\"2\">Spectre le plus large\u003cbr>EI : insuffisance rénale aiguë, hypoK, hypoMg\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>\u003cstrong>Amphotéricine B à complexes lipidiques\u003c/strong>\u003c/td>\u003ctd>5 mg/kg × 1/j\u003c/td>\u003ctd>IVL 60 min\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>5-flucytosine\u003c/th>\u003ctd>\u003cstrong>Ancotil®\u003c/strong>\u003c/td>\u003ctd>25 – 35 mg/kg × 4/j\u003c/td>\u003ctd>PO uniquement\u003c/td>\u003ctd>Poison du fuseau mitotique\u003c/td>\u003ctd>Réservé aux infections complexes, en association\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Tableau retranscrit depuis la page 36 du livret (mise en page d’origine complexe) : vérifier sur la page originale en cas de doute.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Classe Nom Posologie Administration Mécanisme Remarques Échinocandines Caspofungine Cancidas® J1 = 70 mg × 1/j puis 50 mg × 1/j (70 mg si > 80 kg ; 35 mg si CHILD B) IVL 60 min Fongicide Inhibiteur du 1,3-β-D-glucane → inhibe la synthèse membranaire CHILD C = à éviter Micafungine Mycamine® 100 mg × 1/j IVL 60 min CHILD B/C = à éviter Anidulafungine J1 = 200 mg × 1/j puis 100 mg × 1/j IVL 60 min Pas d’interaction avec le métabolisme hépatique Triazolés Fluconazole Triflucan® J1 = 800 mg × 1/j puis 400 mg/j CVVHF : 12 mg/kg à J1 puis 6 mg/kg/j HDI : 6 mg/kg après la séance PO ou IVL 60 min Fongistatique Inhibiteur du cytochrome P450 → inhibe la synthèse membranaire Bonne diffusion dans le LCR Résistances en augmentation Voriconazole Vfend® IV : J1 6 mg/kg × 2/j puis 3 mg/kg × 2/j PO : J1 400 mg × 1/j puis 200 mg × 2/j PO ou IVL 60 min Candida → fongistatique Aspergillus → fongicide Polyènes Amphotéricine B liposomale 3 mg/kg × 1/j IVL 60 min Fongicide Dégradation par fixation sur les stérols membranaires Spectre le plus large EI : insuffisance rénale aiguë, hypoK, hypoMg Amphotéricine B à complexes lipidiques 5 mg/kg × 1/j IVL 60 min 5-flucytosine Ancotil® 25 – 35 mg/kg × 4/j PO uniquement Poison du fuseau mitotique Réservé aux infections complexes, en association Note Tableau retranscrit depuis la page 36 du livret (mise en page d’origine complexe) : vérifier sur la page originale en cas de doute."},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1111/1469-0691.12039\" target=\"_blank\" rel=\"noopener noreferrer\">ESCMID 2012 : guideline for the diagnosis and management of \u003cem>Candida\u003c/em> diseases — non-neutropenic adult patients (Clin Microbiol Infect)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. ESCMID 2012 : guideline for the diagnosis and management of Candida diseases — non-neutropenic adult patients (Clin Microbiol Infect)"}]},{"id":"rea-aspergillose","s":"rea","t":"Aspergillose pulmonaire invasive","c":"Aspergillose invasive","g":"Infectiologie","i":"sprout","p":[37],"r":"Facteurs de risque, clinique, paraclinique, traitement de première intention.","m":"aspergillose, Aspergillus, galactomannane, voriconazole, amphotéricine B, signe du halo, immunodéprimé","k":[{"t":"Facteurs de risque","i":"search","h":"\u003cul>\n\u003cli>Lésions bronchiques ou pulmonaires préexistantes\u003c/li>\n\u003cli>Déficits immunitaires (neutropénie profonde et prolongée, corticothérapie)\u003c/li>\n\u003cli>Infection par le VIH à un stade avancé\u003c/li>\n\u003cli>Déficit congénital de la phagocytose\u003c/li>\n\u003c/ul>\n","x":"Lésions bronchiques ou pulmonaires préexistantes Déficits immunitaires (neutropénie profonde et prolongée, corticothérapie) Infection par le VIH à un stade avancé Déficit congénital de la phagocytose"},{"t":"Clinique","i":"stethoscope","h":"\u003cul>\n\u003cli>Pneumopathie extensive, fébrile, résistante aux antibiotiques ± hémoptysie\u003c/li>\n\u003cli>À rechercher chez tout patient immunodéprimé si la symptomatologie persiste sous antibiothérapie\u003c/li>\n\u003c/ul>\n","x":"Pneumopathie extensive, fébrile, résistante aux antibiotiques ± hémoptysie À rechercher chez tout patient immunodéprimé si la symptomatologie persiste sous antibiothérapie"},{"t":"Paraclinique","i":"stethoscope","h":"\u003cul>\n\u003cli>\u003cstrong>TDM thoracique\u003c/strong> :\u003cul>\n\u003cli>nodule ou condensation\u003c/li>\n\u003cli>signe du halo autour du nodule (précoce et fugace)\u003c/li>\n\u003cli>excavation au sein du nodule (tardif)\u003c/li>\n\u003cli>épanchement pleural\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Hémocultures négatives\u003c/li>\n\u003cli>LBA, ECBC chez le neutropénique (chez l’immunocompétent : souvent signe de colonisation)\u003c/li>\n\u003cli>Ag soluble galactomannane dans le sérum (spécifique chez l’adulte, sensible chez le neutropénique ; faux positifs possibles si utilisation de pénicillines semi-synthétiques)\u003c/li>\n\u003cli>Ag galactomannane et PCR dans le LBA\u003c/li>\n\u003cli>Ac, PCR (arguments diagnostiques)\u003c/li>\n\u003c/ul>\n","x":"TDM thoracique : nodule ou condensation signe du halo autour du nodule (précoce et fugace) excavation au sein du nodule (tardif) épanchement pleural Hémocultures négatives LBA, ECBC chez le neutropénique (chez l’immunocompétent : souvent signe de colonisation) Ag soluble galactomannane dans le sérum (spécifique chez l’adulte, sensible chez le neutropénique ; faux positifs possibles si utilisation de pénicillines semi-synthétiques) Ag galactomannane et PCR dans le LBA Ac, PCR (arguments diagnostiques)"},{"t":"Traitement","i":"pill","h":"\u003ch3>Première intention\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Voriconazole IV\u003c/strong>, relais per os à J5 (variations inter- et intra-individuelles : dosage de la concentration résiduelle)\u003c/li>\n\u003cli>ou \u003cstrong>amphotéricine B liposomale\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>Posologies : voir le tableau des antifongiques dans \u003ca class=\"xref\" href=\"#rea-candidose\">Candidose systémique\u003c/a>.\u003c/p>\n\u003ch3>Si réfractaire à 7 jours de traitement\u003c/h3>\n\u003cp>Bithérapie caspofungine + voriconazole.\u003c/p>\n\u003ch3>Durée totale\u003c/h3>\n\u003cp>15 jours après l’apyrexie et la résolution des signes cliniques.\u003c/p>\n\u003ch3>Indications chirurgicales\u003c/h3>\n\u003cul>\n\u003cli>Lésions proches de gros vaisseaux\u003c/li>\n\u003cli>Exérèse de foyer résiduel\u003c/li>\n\u003cli>Foyer au niveau des sinus ou du cerveau\u003c/li>\n\u003c/ul>\n","x":"Première intention Voriconazole IV , relais per os à J5 (variations inter- et intra-individuelles : dosage de la concentration résiduelle) ou amphotéricine B liposomale Posologies : voir le tableau des antifongiques dans Candidose systémique . Si réfractaire à 7 jours de traitement Bithérapie caspofungine + voriconazole. Durée totale 15 jours après l’apyrexie et la résolution des signes cliniques. Indications chirurgicales Lésions proches de gros vaisseaux Exérèse de foyer résiduel Foyer au niveau des sinus ou du cerveau"},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1016/j.cmi.2018.01.002\" target=\"_blank\" rel=\"noopener noreferrer\">ESCMID – ECMM – ERS 2017 : diagnosis and management of \u003cem>Aspergillus\u003c/em> diseases (Clin Microbiol Infect 2018)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. ESCMID – ECMM – ERS 2017 : diagnosis and management of Aspergillus diseases (Clin Microbiol Infect 2018)"}]},{"id":"rea-nutrition","s":"rea","t":"Nutrition","c":"Nutrition","g":"Métabolisme et nutrition","i":"utensils","p":[38,39],"r":"Nutrition entérale précoce, objectifs caloriques, intolérance digestive, occlusion fonctionnelle, parentérale.","m":"nutrition entérale, parentérale, calories, kcal, érythromycine, prokinétique, régurgitations, occlusion fonctionnelle, Smofkabiven, Périkabiven, lactulose","k":[{"t":"Protocole de nutrition entérale","i":"syringe","h":"\u003cul>\n\u003cli>Début \u003cstrong>le plus précoce possible\u003c/strong>, obligatoirement dans les \u003cstrong>24 premières heures\u003c/strong> après l’intubation (ou l’admission en réanimation si le patient est intubé à l’admission), associé à un laxatif osmotique : \u003cstrong>lactulose 10 g matin et soir\u003c/strong>\u003c/li>\n\u003cli>Par une sonde naso- ou idéalement oro-gastrique, siliconée ou en polyuréthane, de diamètre 12 – 14 F, dont la position médio-gastrique a été contrôlée au moins une fois par une radio\u003c/li>\n\u003cli>Soluté hypercalorique (1,5 kcal/ml, multifibres) et hyperprotidique = \u003cstrong>Nutrison Energy HP®\u003c/strong>\u003c/li>\n\u003cli>Débuter d’emblée au débit requis, en débit continu chez le patient intubé – ventilé\u003c/li>\n\u003cli>Prescription en ml/h, en fonction du poids du patient\u003c/li>\n\u003cli>En cas d’arrêt imposé (endoscopie digestive, bloc, TDM…) : \u003cstrong>pas de rattrapage\u003c/strong>\u003c/li>\n\u003cli>Position proclive 30 – 45°\u003c/li>\n\u003c/ul>\n","x":"Début le plus précoce possible , obligatoirement dans les 24 premières heures après l’intubation (ou l’admission en réanimation si le patient est intubé à l’admission), associé à un laxatif osmotique : lactulose 10 g matin et soir Par une sonde naso- ou idéalement oro-gastrique, siliconée ou en polyuréthane, de diamètre 12 – 14 F, dont la position médio-gastrique a été contrôlée au moins une fois par une radio Soluté hypercalorique (1,5 kcal/ml, multifibres) et hyperprotidique = Nutrison Energy HP® Débuter d’emblée au débit requis, en débit continu chez le patient intubé – ventilé Prescription en ml/h, en fonction du poids du patient En cas d’arrêt imposé (endoscopie digestive, bloc, TDM…) : pas de rattrapage Position proclive 30 – 45°"},{"t":"Objectifs caloriques","i":"target","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Période\u003c/th>\n\u003cth align=\"center\">Objectif\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>J0 – J1\u003c/td>\n\u003ctd align=\"center\">20 kcal/kg/j\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>J1 – J2\u003c/td>\n\u003ctd align=\"center\">25 kcal/kg/j\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>≥ J8\u003c/td>\n\u003ctd align=\"center\">30 kcal/kg/j\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Obèse (IMC &gt; 30)\u003c/td>\n\u003ctd align=\"center\">25 kcal/kg/j sur le poids idéal\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n","x":"Période Objectif J0 – J1 20 kcal/kg/j J1 – J2 25 kcal/kg/j ≥ J8 30 kcal/kg/j Obèse (IMC > 30) 25 kcal/kg/j sur le poids idéal"},{"t":"Gestion de l’intolérance digestive","i":"file-text","h":"\u003cul>\n\u003cli>\u003cstrong>Pas de mesure du résidu gastrique\u003c/strong> (stases)\u003c/li>\n\u003cli>Intolérance affirmée par la survenue de \u003cstrong>régurgitations\u003c/strong> (présence de nutrition en fond de gorge en dehors des soins oro-naso-pharyngés) ou de \u003cstrong>vomissements\u003c/strong> en dehors des soins oropharyngés\u003c/li>\n\u003cli>Prescription d’un prokinétique : \u003cstrong>érythromycine 250 mg / 6 heures IVL (20 min)\u003c/strong> en 1ʳᵉ intention en cas d’intolérance, pendant au minimum 2 jours, au maximum 5 jours\u003c/li>\n\u003cli>Diminution du débit par paliers (5 kcal/kg/j, en moyenne 3 à 5 ml/h) \u003cstrong>uniquement\u003c/strong> en cas d’intolérance persistante malgré le prokinétique instauré depuis 48 heures\u003c/li>\n\u003cli>Si persistance de l’intolérance malgré les prokinétiques et un débit de 20 kcal/kg/j pendant plus de 48 heures : arrêt de l’alimentation entérale et SNG en siphonage 6 heures, avant reprise à 20 kcal/kg/j\u003c/li>\n\u003cli>Apports complémentaires d’eau par voie entérale limités autant que possible de J0 à J7 (en raison du risque d’intolérance)\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> Toujours rechercher une \u003cstrong>cause organique\u003c/strong> en cas d’intolérance absolue :\u003c/p>\n\u003cul>\n\u003cli>cliniquement : recherche quotidienne de bruits hydroaériques ; TR à la recherche d’un fécalome\u003c/li>\n\u003cli>TDM abdomino-pelvienne ± avis chirurgical\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/blockquote>\n","x":"Pas de mesure du résidu gastrique (stases) Intolérance affirmée par la survenue de régurgitations (présence de nutrition en fond de gorge en dehors des soins oro-naso-pharyngés) ou de vomissements en dehors des soins oropharyngés Prescription d’un prokinétique : érythromycine 250 mg / 6 heures IVL (20 min) en 1ʳᵉ intention en cas d’intolérance, pendant au minimum 2 jours, au maximum 5 jours Diminution du débit par paliers (5 kcal/kg/j, en moyenne 3 à 5 ml/h) uniquement en cas d’intolérance persistante malgré le prokinétique instauré depuis 48 heures Si persistance de l’intolérance malgré les prokinétiques et un débit de 20 kcal/kg/j pendant plus de 48 heures : arrêt de l’alimentation entérale et SNG en siphonage 6 heures, avant reprise à 20 kcal/kg/j Apports complémentaires d’eau par voie entérale limités autant que possible de J0 à J7 (en raison du risque d’intolérance) Attention Toujours rechercher une cause organique en cas d’intolérance absolue : cliniquement : recherche quotidienne de bruits hydroaériques ; TR à la recherche d’un fécalome TDM abdomino-pelvienne ± avis chirurgical"},{"t":"Traitement de l’occlusion fonctionnelle","i":"pill","h":"\u003cul>\n\u003cli>\u003cstrong>Normacol®\u003c/strong> entre J5 et J7 (prescription automatisée sur la feuille)\u003c/li>\n\u003cli>± Gastrografine® 100 ml par la SNG et ASP de face 12 heures après\u003c/li>\n\u003cli>± Lavement rectal de 3 L de NaCl 0,9 % tiède contenant 3 doses de Lansoyl®, à renouveler « tous les jours si besoin »\u003c/li>\n\u003cli>± Si échec : macrogol 3350 (Colopeg®), un sachet dans un litre d’eau par la SNG\u003c/li>\n\u003c/ul>\n","x":"Normacol® entre J5 et J7 (prescription automatisée sur la feuille) ± Gastrografine® 100 ml par la SNG et ASP de face 12 heures après ± Lavement rectal de 3 L de NaCl 0,9 % tiède contenant 3 doses de Lansoyl®, à renouveler « tous les jours si besoin » ± Si échec : macrogol 3350 (Colopeg®), un sachet dans un litre d’eau par la SNG"},{"t":"Nutrition parentérale","i":"utensils","h":"\u003cul>\n\u003cli>Nutrition parentérale \u003cstrong>de complément dès J4\u003c/strong> si les objectifs ne sont pas atteints, sauf apparition d’une contre-indication absolue à l’apport digestif (dans ce cas dès J1) : voir le calculateur de la feuille de prescription\u003cul>\n\u003cli>Voie veineuse centrale = \u003cstrong>Smofkabiven®\u003c/strong> sans électrolyte\u003c/li>\n\u003cli>Voie veineuse périphérique = \u003cstrong>Périkabiven®\u003c/strong> sans électrolyte\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Apports vitaminiques et oligoéléments adaptés obligatoires (seulement si parentérale exclusive)\u003c/li>\n\u003cli>Limiter autant que possible les solutés glucosés « complémentaires » intraveineux (en raison du risque de surcharge calorique et d’intolérance glucidique)\u003c/li>\n\u003c/ul>\n","x":"Nutrition parentérale de complément dès J4 si les objectifs ne sont pas atteints, sauf apparition d’une contre-indication absolue à l’apport digestif (dans ce cas dès J1) : voir le calculateur de la feuille de prescription Voie veineuse centrale = Smofkabiven® sans électrolyte Voie veineuse périphérique = Périkabiven® sans électrolyte Apports vitaminiques et oligoéléments adaptés obligatoires (seulement si parentérale exclusive) Limiter autant que possible les solutés glucosés « complémentaires » intraveineux (en raison du risque de surcharge calorique et d’intolérance glucidique)"},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1016/j.clnu.2018.08.037\" target=\"_blank\" rel=\"noopener noreferrer\">ESPEN 2019 : guideline on clinical nutrition in the intensive care unit (Clin Nutr)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. ESPEN 2019 : guideline on clinical nutrition in the intensive care unit (Clin Nutr)"}]},{"id":"rea-dysnatremies","s":"rea","t":"Dysnatrémies","c":"Dysnatrémies","g":"Métabolisme et nutrition","i":"scale","p":[40,41,42],"r":"Hyponatrémie aiguë (NaCl 3 %, fludrocortisone, urée), hypernatrémie et diabète insipide, critères de SIADH.","m":"hyponatrémie, hypernatrémie, natrémie, SIADH, CSW, cerebral salt wasting, diabète insipide, fludrocortisone, urée, tolvaptan, desmopressine, Minirin, NaCl 3%, osmolalité","k":[{"t":"Hyponatrémie : conduite à tenir","i":"file-text","h":"\u003cp>\u003cstrong>Hyponatrémie : Na⁺ &lt; 135 mmol/l.\u003c/strong> Devant toute hyponatrémie d’installation rapide (&lt; 48 h) :\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Calculer la tonicité plasmatique\u003c/strong> (calculateur dans la feuille de prescription)\u003c/li>\n\u003cli>\u003cstrong>Confirmer une hyponatrémie hypotonique\u003c/strong> (vraie hyponatrémie, &lt; 270 mOsm/l), responsable d’œdème cérébral pouvant mettre en jeu le pronostic vital\u003c/li>\n\u003cli>\u003cstrong>Apprécier le volume extra-cellulaire (VEC)\u003c/strong> (clinique / ETT / thermodilution) :\u003cul>\n\u003cli>VEC normal avec inflation hydrique (pertes d’eau insuffisantes par rapport aux entrées)\u003c/li>\n\u003cli>VEC diminué par pertes hydriques et sodées, mais déficit en sel &gt; déficit en eau\u003c/li>\n\u003cli>VEC augmenté par rétention d’eau et de sel, prédominant sur l’eau\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Réaliser un ionogramme urinaire\u003c/strong> sur échantillon :\u003cul>\n\u003cli>osmolarité urinaire ≤ 100 mOsm/kg d’eau ?\u003c/li>\n\u003cli>natriurèse ≤ 30 mmol/l ?\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ol>\n","x":"Hyponatrémie : Na⁺ \u003c 135 mmol/l. Devant toute hyponatrémie d’installation rapide (\u003c 48 h) : Calculer la tonicité plasmatique (calculateur dans la feuille de prescription) Confirmer une hyponatrémie hypotonique (vraie hyponatrémie, \u003c 270 mOsm/l), responsable d’œdème cérébral pouvant mettre en jeu le pronostic vital Apprécier le volume extra-cellulaire (VEC) (clinique / ETT / thermodilution) : VEC normal avec inflation hydrique (pertes d’eau insuffisantes par rapport aux entrées) VEC diminué par pertes hydriques et sodées, mais déficit en sel > déficit en eau VEC augmenté par rétention d’eau et de sel, prédominant sur l’eau Réaliser un ionogramme urinaire sur échantillon : osmolarité urinaire ≤ 100 mOsm/kg d’eau ? natriurèse ≤ 30 mmol/l ?"},{"t":"Hyponatrémie : traitement","i":"pill","h":"\u003col>\n\u003cli>Apport de Na⁺ sous forme de \u003cstrong>NaCl 3 %, bolus de 100 à 200 ml en 20 min\u003c/strong>, jusqu’à correction de la natrémie &gt; 136 mmol/l ; monitorage de la natrémie obligatoire toutes les 4 heures au minimum\u003c/li>\n\u003cli>Introduction de \u003cstrong>fludrocortisone 100 µg × 2/j\u003c/strong> per os dès que la natrémie est ≤ 136 mmol/l ; épuisement entre J5 et J7 (+ Diffu-K® d’emblée)\u003c/li>\n\u003cli>\u003cstrong>Correction de la volémie\u003c/strong> : laisser l’accès à la boisson si le patient en est capable ; solutés balancés en perfusion pour corriger les pertes urinaires sans les surentraîner (demi-volume par exemple) ; intérêt d’un monitorage de la volémie\u003c/li>\n\u003cli>\u003cstrong>Correction de la kaliémie\u003c/strong>, per os et IVSE si besoin (kaliémie ≤ 3,3 mmol/l : 1 g/heure), avec le même monitorage que pour le sodium — voir \u003ca class=\"xref\" href=\"#rea-hypokaliemie\">Hypokaliémie\u003c/a>\u003c/li>\n\u003cli>Si persistance : \u003cstrong>urée per os\u003c/strong> (préparation magistrale par la pharmacie) 30 g × 2/j, de préférence avec un jus de fruit afin de masquer le goût peu agréable\u003c/li>\n\u003cli>\u003cstrong>Restriction hydrique\u003c/strong> en cas de SIADH confirmé\u003c/li>\n\u003c/ol>\n\u003ch3>Tolvaptan\u003c/h3>\n\u003cp>Antagoniste sélectif des récepteurs V2 de la vasopressine (tolvaptan, Samsca®), en cas de \u003cstrong>SIADH confirmé\u003c/strong> : entre 7,5 et 15 mg, 2 à 3 fois par semaine, selon la natrémie et le bilan hydrosodé.\u003c/p>\n","x":"Apport de Na⁺ sous forme de NaCl 3 %, bolus de 100 à 200 ml en 20 min , jusqu’à correction de la natrémie > 136 mmol/l ; monitorage de la natrémie obligatoire toutes les 4 heures au minimum Introduction de fludrocortisone 100 µg × 2/j per os dès que la natrémie est ≤ 136 mmol/l ; épuisement entre J5 et J7 (+ Diffu-K® d’emblée) Correction de la volémie : laisser l’accès à la boisson si le patient en est capable ; solutés balancés en perfusion pour corriger les pertes urinaires sans les surentraîner (demi-volume par exemple) ; intérêt d’un monitorage de la volémie Correction de la kaliémie , per os et IVSE si besoin (kaliémie ≤ 3,3 mmol/l : 1 g/heure), avec le même monitorage que pour le sodium — voir Hypokaliémie Si persistance : urée per os (préparation magistrale par la pharmacie) 30 g × 2/j, de préférence avec un jus de fruit afin de masquer le goût peu agréable Restriction hydrique en cas de SIADH confirmé Tolvaptan Antagoniste sélectif des récepteurs V2 de la vasopressine (tolvaptan, Samsca®), en cas de SIADH confirmé : entre 7,5 et 15 mg, 2 à 3 fois par semaine, selon la natrémie et le bilan hydrosodé."},{"t":"Démarche diagnostique devant une hyponatrémie","i":"workflow","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/hyponatremie-algo.webp\" data-legende=\"Figure 1 : Démarche diagnostique devant une hyponatrémie\">\u003cimg src=\"figures/hyponatremie-algo.webp\" alt=\"Figure 1 : Démarche diagnostique devant une hyponatrémie\" width=\"1458\" height=\"1409\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Figure 1 : Démarche diagnostique devant une hyponatrémie\u003c/figcaption>\u003c/figure>\n","x":"Agrandir"},{"t":"Critères diagnostiques d’un SIADH","i":"file-text","h":"\u003cul>\n\u003cli>Posm &lt; 275 mOsm/kg\u003c/li>\n\u003cli>Uosm &gt; 100 mOsm/kg (en condition d’hyponatrémie)\u003c/li>\n\u003cli>Euvolémie clinique\u003c/li>\n\u003cli>UNa &gt; 30 mmol/l (en condition d’apports sodés et hydriques normaux)\u003c/li>\n\u003cli>Absence d’hypothyroïdie\u003c/li>\n\u003cli>Absence d’insuffisance surrénale\u003c/li>\n\u003cli>Fonction rénale normale et absence de traitement diurétique récent\u003c/li>\n\u003cli>Uricémie &lt; 240 µmol/l\u003c/li>\n\u003c/ul>\n","x":"Posm \u003c 275 mOsm/kg Uosm > 100 mOsm/kg (en condition d’hyponatrémie) Euvolémie clinique UNa > 30 mmol/l (en condition d’apports sodés et hydriques normaux) Absence d’hypothyroïdie Absence d’insuffisance surrénale Fonction rénale normale et absence de traitement diurétique récent Uricémie \u003c 240 µmol/l"},{"t":"Hypernatrémie : classification","i":"list-ordered","h":"\u003cp>\u003cstrong>Hypernatrémie : Na⁺ ≥ 145 mmol/l.\u003c/strong> Classées en fonction de l’état de la volémie et de l’hydratation extracellulaire :\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Volémie augmentée\u003c/strong> et rétention sodée (osmothérapie)\u003c/li>\n\u003cli>\u003cstrong>Volémie diminuée\u003c/strong> : peu fréquente chez les patients neurologiques ; polyurie osmotique (osmolarité urinaire basse) ou pertes extra-rénales (digestives ou cutanées)\u003c/li>\n\u003cli>\u003cstrong>Volémie normale\u003c/strong> : il s’agit surtout du \u003cstrong>diabète insipide neurogène\u003c/strong>, dont la conséquence est la diminution rapide de la volémie !\u003c/li>\n\u003c/ul>\n\u003ch3>Diabète insipide neurogène\u003c/h3>\n\u003cp>Association de :\u003c/p>\n\u003cul>\n\u003cli>hypernatrémie\u003c/li>\n\u003cli>polyurie &gt; 2 ml/kg/h\u003c/li>\n\u003cli>osmolalité urinaire &lt; 300 mOsm/kg, ou densité urinaire &lt; 1008 (ou &lt; 1005 si glycosurie)\u003c/li>\n\u003c/ul>\n","x":"Hypernatrémie : Na⁺ ≥ 145 mmol/l. Classées en fonction de l’état de la volémie et de l’hydratation extracellulaire : Volémie augmentée et rétention sodée (osmothérapie) Volémie diminuée : peu fréquente chez les patients neurologiques ; polyurie osmotique (osmolarité urinaire basse) ou pertes extra-rénales (digestives ou cutanées) Volémie normale : il s’agit surtout du diabète insipide neurogène , dont la conséquence est la diminution rapide de la volémie ! Diabète insipide neurogène Association de : hypernatrémie polyurie > 2 ml/kg/h osmolalité urinaire \u003c 300 mOsm/kg, ou densité urinaire \u003c 1008 (ou \u003c 1005 si glycosurie)"},{"t":"Hypernatrémie : traitement","i":"pill","h":"\u003col>\n\u003cli>\u003cstrong>D’abord rétablir la volémie : c’est l’urgence\u003c/strong> (importance du monitorage), en compensant strictement, en premier lieu, les pertes urinaires liées au diabète insipide ; intérêt du Ringer lactate, hypotonique\u003c/li>\n\u003cli>\u003cstrong>Correction de l’hypertonie plasmatique\u003c/strong> par G5 %, voire G2,5 % si variation rapide de la natrémie ; apport d’eau per os sinon. Ne pas dépasser \u003cstrong>0,5 mmol/l/h, soit 12 mmol/l/24 h\u003c/strong>. L’objectif est de ramener la natrémie aux environs de 150 mmol/l.\u003c/li>\n\u003cli>\u003cstrong>Desmopressine\u003c/strong> par voie veineuse, en titration, par bolus de 2 µg : l’objectif du traitement est de ramener la diurèse entre 1 et 1,5 ml/kg/h.\u003c/li>\n\u003c/ol>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Le livret écrit l’objectif de diurèse « entre 1 et 1,5 ml/kg » ; il s’agit d’un débit horaire.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"D’abord rétablir la volémie : c’est l’urgence (importance du monitorage), en compensant strictement, en premier lieu, les pertes urinaires liées au diabète insipide ; intérêt du Ringer lactate, hypotonique Correction de l’hypertonie plasmatique par G5 %, voire G2,5 % si variation rapide de la natrémie ; apport d’eau per os sinon. Ne pas dépasser 0,5 mmol/l/h, soit 12 mmol/l/24 h . L’objectif est de ramener la natrémie aux environs de 150 mmol/l. Desmopressine par voie veineuse, en titration, par bolus de 2 µg : l’objectif du traitement est de ramener la diurèse entre 1 et 1,5 ml/kg/h. Note Le livret écrit l’objectif de diurèse « entre 1 et 1,5 ml/kg » ; il s’agit d’un débit horaire."},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1530/EJE-13-1020\" target=\"_blank\" rel=\"noopener noreferrer\">Spasovski G. et al. Clinical practice guideline on diagnosis and treatment of hyponatraemia (Eur J Endocrinol 2014)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. Spasovski G. et al. Clinical practice guideline on diagnosis and treatment of hyponatraemia (Eur J Endocrinol 2014)"}]},{"id":"rea-hypokaliemie","s":"rea","t":"Hypokaliémie","c":"Hypokaliémie","g":"Métabolisme et nutrition","i":"test-tube","p":[49,50],"r":"Correction selon la profondeur et la voie d’abord, préparations de KCl, formes orales, solutés prêts à l’emploi.","m":"hypokaliémie, potassium, KCl, kaliémie, Diffu-K, Kaleorid, polyionique, PSE, voie centrale","k":[{"t":"Contexte","i":"info","h":"\u003cp>Indissociable du traitement de l’hyponatrémie, d’autant que les patients reçoivent un traitement minéralo- ou glucocorticoïde, voire une insulinothérapie intensive.\u003c/p>\n\u003cp>Protocoles issus du document de l’OMEDIT Bretagne (janvier 2016).\u003c/p>\n","x":"Indissociable du traitement de l’hyponatrémie, d’autant que les patients reçoivent un traitement minéralo- ou glucocorticoïde, voire une insulinothérapie intensive. Protocoles issus du document de l’OMEDIT Bretagne (janvier 2016)."},{"t":"Hypokaliémie légère à modérée (2,5 à 3,5 mmol/l)","i":"file-text","h":"\u003ch3>Voie orale : à privilégier\u003c/h3>\n\u003cp>\u003cstrong>3 à 7 g/jour\u003c/strong>, à adapter en fonction de la tolérance du patient (voir « Formes orales »).\u003c/p>\n\u003ch3>Si voie orale impossible\u003c/h3>\n\u003cp>\u003cstrong>Voie veineuse périphérique\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Avec des solutions prêtes à l’emploi de type polyionique\u003c/li>\n\u003cli>Avec des préparations de KCl injectable à 4 g/l maximum\u003c/li>\n\u003c/ol>\n\u003cp>Dans les 2 cas : perfusion lente sur 12 à 24 h en contrôlant la vitesse de perfusion. Le débit sera vérifié régulièrement.\u003c/p>\n\u003cp>\u003cstrong>Voie veineuse centrale\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Avec des solutions prêtes à l’emploi de type polyionique\u003c/li>\n\u003cli>Avec des préparations de KCl injectable à 4 g/l maximum\u003c/li>\n\u003c/ol>\n\u003cp>Dans les 2 cas : \u003cstrong>débit max du KCl = 1 g/h\u003c/strong> ; le débit sera vérifié régulièrement.\u003c/p>\n","x":"Voie orale : à privilégier 3 à 7 g/jour , à adapter en fonction de la tolérance du patient (voir « Formes orales »). Si voie orale impossible Voie veineuse périphérique Avec des solutions prêtes à l’emploi de type polyionique Avec des préparations de KCl injectable à 4 g/l maximum Dans les 2 cas : perfusion lente sur 12 à 24 h en contrôlant la vitesse de perfusion. Le débit sera vérifié régulièrement. Voie veineuse centrale Avec des solutions prêtes à l’emploi de type polyionique Avec des préparations de KCl injectable à 4 g/l maximum Dans les 2 cas : débit max du KCl = 1 g/h ; le débit sera vérifié régulièrement."},{"t":"Hypokaliémie sévère (\u003c 2,5 mmol/l)","i":"file-text","h":"\u003cp>Prise en charge dans le service de soins adapté, sur décision médicale, en fonction de la symptomatologie et des signes électrocardiographiques.\u003c/p>\n\u003ch3>Hors réanimation et soins intensifs\u003c/h3>\n\u003cul>\n\u003cli>Apport de potassium par voie veineuse périphérique ou voie veineuse centrale\u003c/li>\n\u003cli>Avec des préparations de KCl injectable à 4 g/l\u003c/li>\n\u003cli>\u003cstrong>Débit max du KCl = 1 g/h\u003c/strong> ; le débit sera vérifié régulièrement\u003c/li>\n\u003c/ul>\n\u003ch3>En réanimation et soins intensifs (sous surveillance scopique)\u003c/h3>\n\u003cul>\n\u003cli>Apport de potassium par \u003cstrong>voie veineuse centrale\u003c/strong>\u003c/li>\n\u003cli>Avec du KCl concentré non dilué, administré au pousse-seringue électrique\u003c/li>\n\u003cli>\u003cstrong>Débit du KCl = 1 g/h (max : 1,5 g/h)\u003c/strong> ; le débit sera vérifié régulièrement\u003c/li>\n\u003cli>Un apport de potassium par voie orale peut être associé à l’apport veineux : 3 à 7 g/jour, à adapter en fonction de la tolérance du patient\u003c/li>\n\u003c/ul>\n","x":"Prise en charge dans le service de soins adapté, sur décision médicale, en fonction de la symptomatologie et des signes électrocardiographiques. Hors réanimation et soins intensifs Apport de potassium par voie veineuse périphérique ou voie veineuse centrale Avec des préparations de KCl injectable à 4 g/l Débit max du KCl = 1 g/h ; le débit sera vérifié régulièrement En réanimation et soins intensifs (sous surveillance scopique) Apport de potassium par voie veineuse centrale Avec du KCl concentré non dilué, administré au pousse-seringue électrique Débit du KCl = 1 g/h (max : 1,5 g/h) ; le débit sera vérifié régulièrement Un apport de potassium par voie orale peut être associé à l’apport veineux : 3 à 7 g/jour, à adapter en fonction de la tolérance du patient"},{"t":"Préparation de KCl injectable à 4 g/l","i":"syringe","h":"\u003cp>Diluer les ampoules de KCl concentré dans du NaCl 0,9 % de préférence.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth align=\"center\">KCl\u003c/th>\n\u003cth align=\"center\">Volume final de solvant après dilution\u003c/th>\n\u003cth align=\"center\">Durée minimale de perfusion\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd align=\"center\">1 g\u003c/td>\n\u003ctd align=\"center\">250 ml\u003c/td>\n\u003ctd align=\"center\">1 h\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">2 g\u003c/td>\n\u003ctd align=\"center\">500 ml\u003c/td>\n\u003ctd align=\"center\">2 h\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">3 g\u003c/td>\n\u003ctd align=\"center\">1 l\u003c/td>\n\u003ctd align=\"center\">3 h\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">4 g\u003c/td>\n\u003ctd align=\"center\">1 l\u003c/td>\n\u003ctd align=\"center\">4 h\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n","x":"Diluer les ampoules de KCl concentré dans du NaCl 0,9 % de préférence. KCl Volume final de solvant après dilution Durée minimale de perfusion 1 g 250 ml 1 h 2 g 500 ml 2 h 3 g 1 l 3 h 4 g 1 l 4 h"},{"t":"Repères","i":"target","h":"\u003cul>\n\u003cli>1 g de KCl = 13,4 mmol de K⁺ = 524 mg de K⁺\u003c/li>\n\u003cli>100 mmol de KCl permettent d’augmenter la kaliémie de 0,3 mmol/l\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-caution\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-octagon-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Danger\u003c/span> Ne \u003cstrong>JAMAIS\u003c/strong> administrer une ampoule de KCl injectable concentré par voie \u003cstrong>ORALE\u003c/strong> (SNG incluse) : utiliser la forme sirop ou sachet-dose.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"1 g de KCl = 13,4 mmol de K⁺ = 524 mg de K⁺ 100 mmol de KCl permettent d’augmenter la kaliémie de 0,3 mmol/l Danger Ne JAMAIS administrer une ampoule de KCl injectable concentré par voie ORALE (SNG incluse) : utiliser la forme sirop ou sachet-dose."},{"t":"Formes orales","i":"pill","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Spécialité\u003c/th>\n\u003cth>Principe actif\u003c/th>\n\u003cth align=\"center\">Dosage*\u003c/th>\n\u003cth align=\"center\">Apport en K⁺\u003c/th>\n\u003cth align=\"center\">Par SNG ?\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Diffu-K®, gélules\u003c/td>\n\u003ctd>Chlorure de potassium\u003c/td>\n\u003ctd align=\"center\">0,6 g\u003c/td>\n\u003ctd align=\"center\">8 mmol\u003c/td>\n\u003ctd align=\"center\">Oui\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kaleorid LP®, comprimé\u003c/td>\n\u003ctd>Chlorure de potassium\u003c/td>\n\u003ctd align=\"center\">0,6 g\u003c/td>\n\u003ctd align=\"center\">8 mmol\u003c/td>\n\u003ctd align=\"center\">Non\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kaleorid LP®, comprimé\u003c/td>\n\u003ctd>Chlorure de potassium\u003c/td>\n\u003ctd align=\"center\">1 g\u003c/td>\n\u003ctd align=\"center\">13,4 mmol\u003c/td>\n\u003ctd align=\"center\">Non\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Potassium Richard®, sachet-dose ou sirop\u003c/td>\n\u003ctd>Chlorure de potassium et glycérophosphate de potassium\u003c/td>\n\u003ctd align=\"center\">0,44 g/15 ml\u003c/td>\n\u003ctd align=\"center\">11,25 mmol/15 ml\u003c/td>\n\u003ctd align=\"center\">Oui\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gluconate de potassium H2 Pharma, sirop\u003c/td>\n\u003ctd>Gluconate de potassium\u003c/td>\n\u003ctd align=\"center\">0,9 g/15 ml\u003c/td>\n\u003ctd align=\"center\">10 mmol/15 ml\u003c/td>\n\u003ctd align=\"center\">Oui\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nati-K®, comprimé\u003c/td>\n\u003ctd>Tartrate de potassium\u003c/td>\n\u003ctd align=\"center\">0,5 g\u003c/td>\n\u003ctd align=\"center\">4,26 mmol\u003c/td>\n\u003ctd align=\"center\">Non\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>* Le dosage renseigne la quantité de principe actif en grammes. Pour comparer les apports potassiques (K⁺) entre deux spécialités de principes actifs différents : privilégier un raisonnement en \u003cstrong>millimoles\u003c/strong>.\u003c/p>\n","x":"Spécialité Principe actif Dosage* Apport en K⁺ Par SNG ? Diffu-K®, gélules Chlorure de potassium 0,6 g 8 mmol Oui Kaleorid LP®, comprimé Chlorure de potassium 0,6 g 8 mmol Non Kaleorid LP®, comprimé Chlorure de potassium 1 g 13,4 mmol Non Potassium Richard®, sachet-dose ou sirop Chlorure de potassium et glycérophosphate de potassium 0,44 g/15 ml 11,25 mmol/15 ml Oui Gluconate de potassium H2 Pharma, sirop Gluconate de potassium 0,9 g/15 ml 10 mmol/15 ml Oui Nati-K®, comprimé Tartrate de potassium 0,5 g 4,26 mmol Non * Le dosage renseigne la quantité de principe actif en grammes. Pour comparer les apports potassiques (K⁺) entre deux spécialités de principes actifs différents : privilégier un raisonnement en millimoles ."},{"t":"Solutés injectables prêts à l’emploi","i":"pill","h":"\u003cp>Des « solutions prêtes à l’emploi » existent : pensez-y ! Les ampoules de chlorure de potassium concentré sont à utiliser \u003cstrong>en dernier recours\u003c/strong>.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>KCl\u003c/th>\n\u003cth align=\"center\">NaCl\u003c/th>\n\u003cth align=\"center\">Gluconate de calcium\u003c/th>\n\u003cth>Glucose monohydraté\u003c/th>\n\u003cth>Solutions prêtes à l’emploi (commercialisées en 2016)\u003c/th>\n\u003cth align=\"center\">Volume\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>0,5 g (6,7 mmol)\u003c/td>\n\u003ctd align=\"center\">1 g\u003c/td>\n\u003ctd align=\"center\">–\u003c/td>\n\u003ctd>250 ml de G5 % = 13,75 g\u003c/td>\n\u003ctd>Polyionique G5\u003c/td>\n\u003ctd align=\"center\">250 ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1 g (13,4 mmol)\u003c/td>\n\u003ctd align=\"center\">2 g\u003c/td>\n\u003ctd align=\"center\">–\u003c/td>\n\u003ctd>500 ml de G5 % = 27,5 g\u003c/td>\n\u003ctd>Polyionique 1A G5, Bionolyte G5, Polyionique G5, Glucidion G5\u003c/td>\n\u003ctd align=\"center\">500 ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1 g (13,4 mmol)\u003c/td>\n\u003ctd align=\"center\">2 g\u003c/td>\n\u003ctd align=\"center\">–\u003c/td>\n\u003ctd>500 ml de G10 % = 55 g\u003c/td>\n\u003ctd>Polyionique 2A G10, Bionolyte G10, Polyionique G10, Glucidion G10\u003c/td>\n\u003ctd align=\"center\">500 ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 g (26,8 mmol)\u003c/td>\n\u003ctd align=\"center\">4 g\u003c/td>\n\u003ctd align=\"center\">–\u003c/td>\n\u003ctd>1000 ml de G5 % = 55 g\u003c/td>\n\u003ctd>Polyionique 1A G5, Bionolyte G5, Polyionique G5, Glucidion G5\u003c/td>\n\u003ctd align=\"center\">1000 ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 g (26,8 mmol)\u003c/td>\n\u003ctd align=\"center\">4 g\u003c/td>\n\u003
