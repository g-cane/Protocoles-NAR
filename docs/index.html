\u003cth>Rivaroxaban\u003c/th>\u003cth>Apixaban\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003cth>Test pour mesurer la concentration (ng/mL)\u003c/th>\u003ctd>Temps de thrombine dilué ou temps d’écarine\u003c/td>\u003ctd colspan=\"2\">Anti-Xa rivaroxaban\u003cbr>Anti-Xa apixaban\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Seuils de risque hémorragique\u003c/th>\u003ctd colspan=\"3\">\u003cstrong>30 ng/mL\u003c/strong> pour la chirurgie urgente à haut risque hémorragique\u003cbr>\u003cstrong>50 ng/mL\u003c/strong> pour le recours aux antidotes dans l’hémorragie\u003cbr>\u003cstrong>50 – 100 ng/mL\u003c/strong> pour la thrombolyse dans l’AVC ischémique\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Temps de Quick\u003c/th>\u003ctd>→ ou ↗\u003c/td>\u003ctd>↗\u003c/td>\u003ctd>→ ou ↗\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>TCA\u003c/th>\u003ctd>↗\u003c/td>\u003ctd>→ ou ↗\u003c/td>\u003ctd>→ ou ↗\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>TQ + TCA\u003c/th>\u003ctd colspan=\"2\">TQ normal et TCA normal n’éliminent que des concentrations très élevées\u003c/td>\u003ctd>Non interprétable\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Autres mesures\u003c/th>\u003ctd>Temps de thrombine normal = pas de dabigatran\u003cbr>Sinon ininterprétable\u003c/td>\u003ctd colspan=\"2\">Anti-Xa HBPM &lt; 0,1 UI/mL = pas d’anti-Xa ; sinon interprétable\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\n\u003ch3>AOD et AVK en cas d’hémorragie intracrânienne\u003c/h3>\n\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/aod-hic-algo.webp\" data-legende=\"Figure 1 : Gestion des AVK et des AOD en cas d’hémorragie intracrânienne\">\u003cimg src=\"figures/aod-hic-algo.webp\" alt=\"Figure 1 : Gestion des AVK et des AOD en cas d’hémorragie intracrânienne\" width=\"1295\" height=\"963\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Figure 1 : Gestion des AVK et des AOD en cas d’hémorragie intracrânienne\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>\u003cstrong>AVK\u003c/strong> — INR ≤ 1,5 : pas de réversion. INR non disponible ou &gt; 1,5 : CCP à dose adaptée à l’INR (ou 25 UI/kg d’équivalent FIX si INR non disponible) immédiatement + vitamine K 10 mg ; contrôle de l’INR dans les 30 min ; si INR &gt; 1,5, complément de CCP.\u003c/li>\n\u003cli>\u003cstrong>AOD\u003c/strong> — [AOD] ≤ 50 ng/mL : pas de réversion. [AOD] non disponible ou &gt; 50 ng/mL :\u003cul>\n\u003cli>\u003cstrong>dabigatran\u003c/strong> : idarucizumab 5 g (2 flacons) en 10 min\u003c/li>\n\u003cli>\u003cstrong>anti-Xa directs\u003c/strong> : CCP 50 UI/kg ou FEIBA 30 – 50 UI/kg ou andexanet (posologie adaptée à l’AOD et à la dernière prise)\u003c/li>\n\u003cli>redoser la concentration d’AOD entre H12 et H24\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","x":"Les tests d’hémostase conventionnels (temps de Quick et temps de céphaline avec activateur) ont des sensibilités faibles et variables suivant l’AOD et le réactif utilisé. Il faut donc privilégier les tests spécifiques permettant d’exprimer la concentration d’AOD en ng/ml. Une concentration \u003c 50 ng/ml permet d’exclure la participation de l’AOD à une hémorragie active, et tous les gestes invasifs peuvent être réalisés si elle est \u003c 30 ng/ml . Pour les AOD anti-Xa, les tests spécifiques reposent sur la mesure de l’activité anti-Xa. Pour le dabigatran, les tests spécifiques reposent sur le temps de thrombine dilué ou le temps d’écarine. Un temps de thrombine normal permet notamment d’exclure une concentration significative de dabigatran. Tests d’hémostase et risque hémorragique sous AOD Dabigatran Rivaroxaban Apixaban Test pour mesurer la concentration (ng/mL) Temps de thrombine dilué ou temps d’écarine Anti-Xa rivaroxaban Anti-Xa apixaban Seuils de risque hémorragique 30 ng/mL pour la chirurgie urgente à haut risque hémorragique 50 ng/mL pour le recours aux antidotes dans l’hémorragie 50 – 100 ng/mL pour la thrombolyse dans l’AVC ischémique Temps de Quick → ou ↗ ↗ → ou ↗ TCA ↗ → ou ↗ → ou ↗ TQ + TCA TQ normal et TCA normal n’éliminent que des concentrations très élevées Non interprétable Autres mesures Temps de thrombine normal = pas de dabigatran Sinon ininterprétable Anti-Xa HBPM \u003c 0,1 UI/mL = pas d’anti-Xa ; sinon interprétable AOD et AVK en cas d’hémorragie intracrânienne Agrandir AVK — INR ≤ 1,5 : pas de réversion. INR non disponible ou > 1,5 : CCP à dose adaptée à l’INR (ou 25 UI/kg d’équivalent FIX si INR non disponible) immédiatement + vitamine K 10 mg ; contrôle de l’INR dans les 30 min ; si INR > 1,5, complément de CCP. AOD — [AOD] ≤ 50 ng/mL : pas de réversion. [AOD] non disponible ou > 50 ng/mL : dabigatran : idarucizumab 5 g (2 flacons) en 10 min anti-Xa directs : CCP 50 UI/kg ou FEIBA 30 – 50 UI/kg ou andexanet (posologie adaptée à l’AOD et à la dernière prise) redoser la concentration d’AOD entre H12 et H24"},{"t":"Gestion des antiagrégants plaquettaires","i":"droplets","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/aap-hemorragie-algo.webp\" data-legende=\"Figure 2 : Prise en charge des agents antiplaquettaires (AAP) en cas d’hémorragie\">\u003cimg src=\"figures/aap-hemorragie-algo.webp\" alt=\"Figure 2 : Prise en charge des agents antiplaquettaires (AAP) en cas d’hémorragie\" width=\"1484\" height=\"784\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Figure 2 : Prise en charge des agents antiplaquettaires (AAP) en cas d’hémorragie\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>AAP\u003c/th>\n\u003cth>Moyens de neutralisation proposés\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aspirine\u003c/td>\n\u003ctd>Transfusion plaquettaire à dose standard (0,5 à 0,7 × 10¹¹ pour 10 kg de poids)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Clopidogrel\u003c/td>\n\u003ctd>Transfusion plaquettaire : 2 × dose standard. \u003cem>Efficacité réduite si &lt; 6 h après la dernière prise d’AAP\u003c/em>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Prasugrel\u003c/td>\n\u003ctd>Transfusion plaquettaire : &gt; 2 × dose standard. \u003cem>Efficacité réduite si &lt; 6 h après la dernière prise d’AAP\u003c/em>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ticagrelor\u003c/td>\n\u003ctd>Dernière prise &lt; 24 h : pas de proposition — transfusion plaquettaire inefficace ; discuter le rFVIIa. Dernière prise &gt; 24 h : transfusion plaquettaire pour une neutralisation partielle\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Voir aussi, côté anesthésie : \u003ca class=\"xref\" href=\"#anesth-antithrombotiques\">Antiagrégants et anticoagulants\u003c/a>.\u003c/p>\n","x":"Agrandir AAP Moyens de neutralisation proposés Aspirine Transfusion plaquettaire à dose standard (0,5 à 0,7 × 10¹¹ pour 10 kg de poids) Clopidogrel Transfusion plaquettaire : 2 × dose standard. Efficacité réduite si \u003c 6 h après la dernière prise d’AAP Prasugrel Transfusion plaquettaire : > 2 × dose standard. Efficacité réduite si \u003c 6 h après la dernière prise d’AAP Ticagrelor Dernière prise \u003c 24 h : pas de proposition — transfusion plaquettaire inefficace ; discuter le rFVIIa. Dernière prise > 24 h : transfusion plaquettaire pour une neutralisation partielle Voir aussi, côté anesthésie : Antiagrégants et anticoagulants ."},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1161/STR.0000000000000407\" target=\"_blank\" rel=\"noopener noreferrer\">AHA/ASA 2022 : Guideline for the Management of Patients With Spontaneous Intracerebral Hemorrhage\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1016/j.acvd.2017.12.004\" target=\"_blank\" rel=\"noopener noreferrer\">GIHP – GFHT 2018 : gestion des agents antiplaquettaires en cas de procédure invasive non programmée ou d’hémorragie\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://sfmu.org/upload/consensus/RFE2024_Anticoagulation_contexte_urgence.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">RFE SFMU – SFAR – GIHP – SFTH 2024 : gestion de l’anticoagulation dans un contexte d’urgence (PDF)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. AHA/ASA 2022 : Guideline for the Management of Patients With Spontaneous Intracerebral Hemorrhage GIHP – GFHT 2018 : gestion des agents antiplaquettaires en cas de procédure invasive non programmée ou d’hémorragie RFE SFMU – SFAR – GIHP – SFTH 2024 : gestion de l’anticoagulation dans un contexte d’urgence (PDF)"}]},{"id":"rea-cangrelor","s":"rea","t":"Cangrelor en neuroréanimation","c":"Cangrelor","g":"Neuro-réanimation","i":"syringe","p":[67,68],"r":"Indication, préparation, instauration, monitorage Multiplate®, chirurgie urgente, relais oral.","m":"cangrelor, Kengrexal, P2Y12, stent, antiagrégant, Multiplate, HAPT, clopidogrel, prasugrel, ticagrelor, relais","k":[{"t":"Indication","i":"circle-check","h":"\u003cp>Cangrelor (Kengrexal®) en neuro-réanimation : traitement antiagrégant plaquettaire (AAP) après pose de dispositif intracrânien chez des patients à \u003cstrong>haut risque de thrombose de stent\u003c/strong>, chez qui un geste chirurgical nécessitant un arrêt des AAP est nécessaire (ou hautement probable), et/ou comme traitement anti-thrombotique d’un évènement survenu notamment pendant la procédure de radiologie interventionnelle.\u003c/p>\n","x":"Cangrelor (Kengrexal®) en neuro-réanimation : traitement antiagrégant plaquettaire (AAP) après pose de dispositif intracrânien chez des patients à haut risque de thrombose de stent , chez qui un geste chirurgical nécessitant un arrêt des AAP est nécessaire (ou hautement probable), et/ou comme traitement anti-thrombotique d’un évènement survenu notamment pendant la procédure de radiologie interventionnelle."},{"t":"Pharmacologie","i":"info","h":"\u003cul>\n\u003cli>Antagoniste direct, sélectif et réversible du récepteur plaquettaire P2Y12 (récepteur de l’ADP)\u003c/li>\n\u003cli>Effet rapide en quelques minutes (effet en 2 minutes si bolus préalable)\u003c/li>\n\u003cli>Demi-vie de \u003cstrong>3 à 6 minutes\u003c/strong>. La fonction plaquettaire redevient normale \u003cstrong>dans l’heure\u003c/strong> qui suit l’arrêt de la perfusion, quelle que soit la dose administrée\u003c/li>\n\u003c/ul>\n","x":"Antagoniste direct, sélectif et réversible du récepteur plaquettaire P2Y12 (récepteur de l’ADP) Effet rapide en quelques minutes (effet en 2 minutes si bolus préalable) Demi-vie de 3 à 6 minutes . La fonction plaquettaire redevient normale dans l’heure qui suit l’arrêt de la perfusion, quelle que soit la dose administrée"},{"t":"Préparation","i":"syringe","h":"\u003col>\n\u003cli>Reconstituer chaque flacon de 50 mg en y ajoutant 5 mL d’eau stérile PPI\u003c/li>\n\u003cli>Prélever les 5 mL de solution reconstituée dans chaque flacon et les diluer dans 250 mL de NaCl 0,9 % ou de glucose 5 %, dans lesquels on aura au préalable retiré un volume de 5 mL de solution\u003c/li>\n\u003c/ol>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> Ne pas utiliser sans diluer. Le produit doit être utilisé immédiatement après dilution.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Reconstituer chaque flacon de 50 mg en y ajoutant 5 mL d’eau stérile PPI Prélever les 5 mL de solution reconstituée dans chaque flacon et les diluer dans 250 mL de NaCl 0,9 % ou de glucose 5 %, dans lesquels on aura au préalable retiré un volume de 5 mL de solution Attention Ne pas utiliser sans diluer. Le produit doit être utilisé immédiatement après dilution."},{"t":"Instauration et monitorage","i":"activity","h":"\u003ch3>Sans AAP préalable\u003c/h3>\n\u003cp>Débuter la perfusion de cangrelor au débit de \u003cstrong>2 µg/kg/min\u003c/strong> (inhibition comparable à 4 µg/kg/min, Wendell 2010, \u003cem>Journal of Clinical Pharmacology\u003c/em>).\u003c/p>\n\u003ch3>Monitorage par Multiplate®\u003c/h3>\n\u003cul>\n\u003cli>Prélèvement : 1 tube bleu citraté, prescrire HAPT (bon bleu hématologie), \u003cstrong>2 h après le début de la perfusion\u003c/strong>. Renseigner la posologie.\u003c/li>\n\u003cli>Prérequis : plaquettes ≥ 80 G/L et hématocrite ≥ 30 %\u003c/li>\n\u003cli>\u003cstrong>Cible biologique : 190 – 390 AU.min\u003c/strong> (littérature — Tantry 2013 — et bornes d’efficacité définies au laboratoire)\u003c/li>\n\u003cli>Adaptation posologique : si le 1ᵉʳ contrôle est efficace, diminuer le débit à \u003cstrong>1 µg/kg/min\u003c/strong> en l’absence de thrombocytose, puis par paliers de 0,25 µg/kg/min. Possibilité de diminuer le débit jusqu’à \u003cstrong>0,5 µg/kg/min\u003c/strong> si efficacité biologique.\u003c/li>\n\u003cli>Contrôler l’agrégation plaquettaire par Multiplate® 1 à 2 h après toute modification du débit\u003c/li>\n\u003cli>À l’équilibre : contrôle Multiplate® toutes les 24 h, avec numération globulaire et plaquettaire\u003c/li>\n\u003c/ul>\n\u003ch3>En relais d’un autre anti-P2Y12\u003c/h3>\n\u003cp>Commencer le cangrelor \u003cstrong>48 h après la dernière prise\u003c/strong> d’anti-P2Y12, au débit de \u003cstrong>0,75 µg/kg/min\u003c/strong> (BRIDGE trial, Angiolillo 2012 ; Godier 2019).\u003c/p>\n\u003cp>L’initiation du cangrelor peut également être guidée par les tests biologiques : commencer le cangrelor quand la réactivité plaquettaire à l’ADP est proche du seuil d’absence d’efficacité (390 AU.min).\u003c/p>\n","x":"Sans AAP préalable Débuter la perfusion de cangrelor au débit de 2 µg/kg/min (inhibition comparable à 4 µg/kg/min, Wendell 2010, Journal of Clinical Pharmacology ). Monitorage par Multiplate® Prélèvement : 1 tube bleu citraté, prescrire HAPT (bon bleu hématologie), 2 h après le début de la perfusion . Renseigner la posologie. Prérequis : plaquettes ≥ 80 G/L et hématocrite ≥ 30 % Cible biologique : 190 – 390 AU.min (littérature — Tantry 2013 — et bornes d’efficacité définies au laboratoire) Adaptation posologique : si le 1ᵉʳ contrôle est efficace, diminuer le débit à 1 µg/kg/min en l’absence de thrombocytose, puis par paliers de 0,25 µg/kg/min. Possibilité de diminuer le débit jusqu’à 0,5 µg/kg/min si efficacité biologique. Contrôler l’agrégation plaquettaire par Multiplate® 1 à 2 h après toute modification du débit À l’équilibre : contrôle Multiplate® toutes les 24 h, avec numération globulaire et plaquettaire En relais d’un autre anti-P2Y12 Commencer le cangrelor 48 h après la dernière prise d’anti-P2Y12, au débit de 0,75 µg/kg/min (BRIDGE trial, Angiolillo 2012 ; Godier 2019). L’initiation du cangrelor peut également être guidée par les tests biologiques : commencer le cangrelor quand la réactivité plaquettaire à l’ADP est proche du seuil d’absence d’efficacité (390 AU.min)."},{"t":"Procédure chirurgicale urgente","i":"clipboard-list","h":"\u003cp>Arrêt de la perfusion \u003cstrong>1 h avant le geste\u003c/strong>, sans contrôle biologique (vérifier le taux de plaquettes et le bilan de coagulation).\u003c/p>\n","x":"Arrêt de la perfusion 1 h avant le geste , sans contrôle biologique (vérifier le taux de plaquettes et le bilan de coagulation)."},{"t":"Relais par antiagrégants oraux (Angiolillo 2017)","i":"syringe","h":"\u003cul>\n\u003cli>\u003cstrong>Clopidogrel ou prasugrel\u003c/strong> : immédiatement après l’arrêt de la perfusion, bolus de clopidogrel 600 mg ou de prasugrel 60 mg\u003c/li>\n\u003cli>\u003cstrong>Ticagrelor\u003c/strong> : 30 minutes avant la fin de la perfusion, ou immédiatement après la fin de la perfusion : bolus de 180 mg\u003c/li>\n\u003cli>Reprise de l’antiagrégation dans les 12 h suivantes aux doses usuelles\u003c/li>\n\u003c/ul>\n","x":"Clopidogrel ou prasugrel : immédiatement après l’arrêt de la perfusion, bolus de clopidogrel 600 mg ou de prasugrel 60 mg Ticagrelor : 30 minutes avant la fin de la perfusion, ou immédiatement après la fin de la perfusion : bolus de 180 mg Reprise de l’antiagrégation dans les 12 h suivantes aux doses usuelles"},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1001/jama.2011.2002\" target=\"_blank\" rel=\"noopener noreferrer\">Angiolillo DJ et al. Bridging antiplatelet therapy with cangrelor in patients undergoing cardiac surgery — BRIDGE (JAMA 2012)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. Angiolillo DJ et al. Bridging antiplatelet therapy with cangrelor in patients undergoing cardiac surgery — BRIDGE (JAMA 2012)"}]},{"id":"rea-atb","s":"rea","t":"Bon usage des anti-infectieux","c":"Bon usage des antibiotiques","g":"Infectiologie","i":"pill","p":[20,21,22,23],"r":"Prélèvements, adaptation à l’antibiogramme, aminosides, anti-SARM, posologies des β-lactamines.","m":"antibiotique, antibiogramme, aminoside, amikacine, gentamicine, vancomycine, linézolide, daptomycine, bêta-lactamine, céfépime, méropénème, pipéracilline, tazobactam, céfazoline, SARM, hyperclairance, insuffisance rénale","k":[{"t":"Principes généraux","i":"info","h":"\u003cul>\n\u003cli>Prélèvements \u003cstrong>avant\u003c/strong> toute introduction d’antibiothérapie, hors cas exceptionnel\u003c/li>\n\u003cli>Prélèvements si température corporelle &gt; 38,5 °C sans prélèvement récent (&lt; 48 – 72 h)\u003c/li>\n\u003cli>Toute introduction ou adaptation antibiotique doit être \u003cstrong>séniorisée\u003c/strong> (si besoin, appel d’un des référents en infectiologie de l’unité)\u003c/li>\n\u003c/ul>\n\u003ch3>Prélèvements standard\u003c/h3>\n\u003cul>\n\u003cli>LCR distal (IDE)\u003c/li>\n\u003cli>2 paires d’hémocultures (aérobie + anaérobie) sur voie centrale et en périphérique\u003c/li>\n\u003cli>Prélèvements respiratoires\u003c/li>\n\u003cli>\u003cstrong>Pas\u003c/strong> de prélèvements urinaires systématiques\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> \u003c/p>\n\u003cul>\n\u003cli>Prélèvements urinaires uniquement si argument clinique ou si les autres prélèvements sont négatifs\u003c/li>\n\u003cli>Diarrhée fébrile = recherche de \u003cem>Clostridium difficile\u003c/em> toxinogène\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/blockquote>\n","x":"Prélèvements avant toute introduction d’antibiothérapie, hors cas exceptionnel Prélèvements si température corporelle > 38,5 °C sans prélèvement récent (\u003c 48 – 72 h) Toute introduction ou adaptation antibiotique doit être séniorisée (si besoin, appel d’un des référents en infectiologie de l’unité) Prélèvements standard LCR distal (IDE) 2 paires d’hémocultures (aérobie + anaérobie) sur voie centrale et en périphérique Prélèvements respiratoires Pas de prélèvements urinaires systématiques Note Prélèvements urinaires uniquement si argument clinique ou si les autres prélèvements sont négatifs Diarrhée fébrile = recherche de Clostridium difficile toxinogène"},{"t":"Adaptation à l’antibiogramme","i":"pill","h":"\u003cp>Aide à l’adaptation des antibiotiques — à confronter avec l’antibiogramme (recherche de résistances acquises).\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth colspan=\"2\">Germe\u003c/th>\u003cth>Phénotype\u003c/th>\u003cth>Antibiotique\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003cth rowspan=\"4\">CGP\u003c/th>\u003cth rowspan=\"3\">Staphylocoque\u003c/th>\u003ctd>SAMS sauvage (oxa-S, amox-S)\u003c/td>\u003ctd>Amoxicilline\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>SAMS pénicillinase (oxa-S, amox-R)\u003c/td>\u003ctd>Céfazoline ou cloxacilline\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>SARM (oxa-R)\u003c/td>\u003ctd>Vancomycine, linézolide, daptomycine*\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Entérocoque\u003c/th>\u003ctd colspan=\"2\">Céphalosporines inefficaces\u003c/td>\u003c/tr>\n\u003ctr>\u003cth rowspan=\"4\">BGN\u003c/th>\u003cth>Groupe 1\u003cbr>\u003csmall>(pas de résistance aux β-lactamines)\u003c/small>\u003c/th>\u003ctd>\u003cem>Proteus mirabilis\u003c/em>, \u003cem>E. coli\u003c/em>, salmonelle, shigelle\u003c/td>\u003ctd>Amoxicilline, C3G\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Groupe 2\u003cbr>\u003csmall>(pénicillinase)\u003c/small>\u003c/th>\u003ctd>\u003cem>Klebsiella pneumoniae\u003c/em>, \u003cem>Citrobacter koseri\u003c/em>\u003c/td>\u003ctd>Augmentin, C3G\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Groupe 3\u003cbr>\u003csmall>(céphalosporinase)\u003c/small>\u003c/th>\u003ctd>\u003cem>Citrobacter freundii\u003c/em>, \u003cem>Enterobacter\u003c/em>, \u003cem>Klebsiella aerogenes\u003c/em>, \u003cem>Hafnia\u003c/em>, \u003cem>Serratia\u003c/em>\u003c/td>\u003ctd>Céfépime, pipéracilline, pipéracilline-tazobactam, voire maintien C3G\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>\u003cem>Pseudomonas aeruginosa\u003c/em>\u003c/th>\u003ctd colspan=\"2\">\u003cstrong>Résistances naturelles\u003c/strong> : amoxicilline, Augmentin, céfotaxime, ceftriaxone, ertapénème\u003cbr>\u003cstrong>Sensibilités\u003c/strong> : ceftazidime, céfépime, pipéracilline, pipéracilline-tazobactam, méropénème\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\n\u003ch3>* Choix de l’anti-SARM selon le site\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>PAVM\u003c/strong> : linézolide &gt; vancomycine. Daptomycine non indiquée (inhibée par le surfactant)\u003c/li>\n\u003cli>\u003cstrong>Bactériémie\u003c/strong> : vancomycine ou daptomycine &gt; linézolide\u003c/li>\n\u003cli>\u003cstrong>Méningo-ventriculite\u003c/strong> : vancomycine ou linézolide\u003c/li>\n\u003c/ul>\n","x":"Aide à l’adaptation des antibiotiques — à confronter avec l’antibiogramme (recherche de résistances acquises). Germe Phénotype Antibiotique CGP Staphylocoque SAMS sauvage (oxa-S, amox-S) Amoxicilline SAMS pénicillinase (oxa-S, amox-R) Céfazoline ou cloxacilline SARM (oxa-R) Vancomycine, linézolide, daptomycine* Entérocoque Céphalosporines inefficaces BGN Groupe 1 (pas de résistance aux β-lactamines) Proteus mirabilis , E. coli , salmonelle, shigelle Amoxicilline, C3G Groupe 2 (pénicillinase) Klebsiella pneumoniae , Citrobacter koseri Augmentin, C3G Groupe 3 (céphalosporinase) Citrobacter freundii , Enterobacter , Klebsiella aerogenes , Hafnia , Serratia Céfépime, pipéracilline, pipéracilline-tazobactam, voire maintien C3G Pseudomonas aeruginosa Résistances naturelles : amoxicilline, Augmentin, céfotaxime, ceftriaxone, ertapénème Sensibilités : ceftazidime, céfépime, pipéracilline, pipéracilline-tazobactam, méropénème * Choix de l’anti-SARM selon le site PAVM : linézolide > vancomycine. Daptomycine non indiquée (inhibée par le surfactant) Bactériémie : vancomycine ou daptomycine > linézolide Méningo-ventriculite : vancomycine ou linézolide"},{"t":"Optimisation de la prescription","i":"pill","h":"\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> Toute antibiothérapie doit être \u003cstrong>réévaluée à 48 – 72 h\u003c/strong>.\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003ch3>Aides à la prescription\u003c/h3>\n\u003cul>\n\u003cli>Insuffisance rénale / EER : \u003ca class=\"ext\" href=\"http://sitegpr.com/\" target=\"_blank\" rel=\"noopener noreferrer\">sitegpr.com\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a> (également disponible via VIDAL)\u003c/li>\n\u003cli>Obésité : \u003ca class=\"ext\" href=\"http://abxbmi.com/\" target=\"_blank\" rel=\"noopener noreferrer\">abxbmi.com\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Important Toute antibiothérapie doit être réévaluée à 48 – 72 h . Aides à la prescription Insuffisance rénale / EER : sitegpr.com (également disponible via VIDAL) Obésité : abxbmi.com"},{"t":"Aminosides","i":"syringe","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Molécule\u003c/th>\n\u003cth align=\"center\">Posologie\u003c/th>\n\u003cth align=\"center\">Pic (8 – 10 × CMI)\u003c/th>\n\u003cth align=\"center\">Vallée\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Amikacine\u003c/td>\n\u003ctd align=\"center\">30 mg/kg\u003c/td>\n\u003ctd align=\"center\">60 – 80 mg/l\u003c/td>\n\u003ctd align=\"center\">&lt; 2,5 mg/l\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gentamicine\u003c/td>\n\u003ctd align=\"center\">8 mg/kg\u003c/td>\n\u003ctd align=\"center\">30 – 40 mg/l\u003c/td>\n\u003ctd align=\"center\">&lt; 0,5 mg/l\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Le livret imprime les concentrations cibles en « mg/ml » ; les taux sériques d’aminosides s’expriment en mg/l.\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003cp>Chez le patient obèse, calcul sur le poids ajusté :\u003c/p>\n\u003cp class=\"formula\">Poids ajusté = Poids idéal théorique + 0,4 × (Poids réel − Poids idéal théorique)\u003c/p>\n\n\u003cul>\n\u003cli>Administration sur \u003cstrong>30 min\u003c/strong> en IVL\u003c/li>\n\u003cli>Dosage du \u003cstrong>pic\u003c/strong> (reflet de l’efficacité) : 30 minutes après la fin de l’injection\u003c/li>\n\u003cli>Dosage de la \u003cstrong>vallée\u003c/strong> (reflet de la toxicité) : avant la réinjection (en règle générale à H24)\u003c/li>\n\u003c/ul>\n","x":"Molécule Posologie Pic (8 – 10 × CMI) Vallée Amikacine 30 mg/kg 60 – 80 mg/l \u003c 2,5 mg/l Gentamicine 8 mg/kg 30 – 40 mg/l \u003c 0,5 mg/l Note Le livret imprime les concentrations cibles en « mg/ml » ; les taux sériques d’aminosides s’expriment en mg/l. Chez le patient obèse, calcul sur le poids ajusté : Poids ajusté = Poids idéal théorique + 0,4 × (Poids réel − Poids idéal théorique) Administration sur 30 min en IVL Dosage du pic (reflet de l’efficacité) : 30 minutes après la fin de l’injection Dosage de la vallée (reflet de la toxicité) : avant la réinjection (en règle générale à H24)"},{"t":"Anti-SARM","i":"syringe","h":"\u003ch3>Vancomycine (glycopeptide)\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth align=\"center\">Clairance &lt; 40 ml/min*\u003c/th>\n\u003cth align=\"center\">Fonction rénale normale / EER\u003c/th>\n\u003cth align=\"center\">Hyperclairance &gt; 150 ml/min\u003c/th>\n\u003cth align=\"center\">Doses méningées\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Bolus\u003c/strong>\u003c/td>\n\u003ctd align=\"center\">20 mg/kg\u003c/td>\n\u003ctd align=\"center\">20 mg/kg\u003c/td>\n\u003ctd align=\"center\">20 mg/kg\u003c/td>\n\u003ctd align=\"center\">30 mg/kg\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>IVSE\u003c/strong>\u003c/td>\n\u003ctd align=\"center\">30 mg/kg/j\u003c/td>\n\u003ctd align=\"center\">30 mg/kg/j\u003c/td>\n\u003ctd align=\"center\">35 mg/kg/j\u003c/td>\n\u003ctd align=\"center\">60 mg/kg/j\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Vallée\u003c/strong>\u003c/td>\n\u003ctd align=\"center\">20 – 30 µg/ml\u003c/td>\n\u003ctd align=\"center\">20 – 30 µg/ml\u003c/td>\n\u003ctd align=\"center\">20 – 30 µg/ml\u003c/td>\n\u003ctd align=\"center\">30 – 40 µg/ml\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Stabilité : 24 h à 25 °C. * Si insuffisance rénale, alternative à envisager (avis du référent).\u003c/p>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> Concentration maximale : sur \u003cstrong>VVC → 80 mg/ml\u003c/strong> ; sur \u003cstrong>VVP → 5 mg/ml\u003c/strong>.\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003cul>\n\u003cli>Dosage de la vancocinémie \u003cstrong>24 h\u003c/strong> après l’introduction ou un changement de posologie\u003c/li>\n\u003cli>En cas de surdosage, l’arrêt transitoire de l’administration doit être discuté\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-tip\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-lightbulb\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Astuce\u003c/span> \u003cstrong>Dilution de la vancomycine : 2 g / 48 ml\u003c/strong> → vitesse en ml/h = posologie / 24 h\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003ch3>Linézolide\u003c/h3>\n\u003cul>\n\u003cli>Posologie : \u003cstrong>600 mg × 2/j\u003c/strong> IVL sur 1 h (pas d’adaptation à la fonction rénale)\u003c/li>\n\u003cli>Doses méningées : \u003cstrong>600 mg × 3/j\u003c/strong> IVL sur 1 h\u003c/li>\n\u003cli>Attention si durée &gt; 28 jours (myélotoxicité) ; surveillance NFS × 2/semaine\u003c/li>\n\u003c/ul>\n\u003ch3>Daptomycine\u003c/h3>\n\u003cul>\n\u003cli>Posologie : \u003cstrong>10 mg/kg × 1/j\u003c/strong> IVL sur 10 min\u003c/li>\n\u003cli>Clairance &lt; 30 ml/min : dose identique 1 jour sur 2\u003c/li>\n\u003cli>Indications : bactériémie, infection de la peau et des tissus mous, endocardite infectieuse\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> Inefficace en cas de pneumopathie.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Vancomycine (glycopeptide) Clairance \u003c 40 ml/min* Fonction rénale normale / EER Hyperclairance > 150 ml/min Doses méningées Bolus 20 mg/kg 20 mg/kg 20 mg/kg 30 mg/kg IVSE 30 mg/kg/j 30 mg/kg/j 35 mg/kg/j 60 mg/kg/j Vallée 20 – 30 µg/ml 20 – 30 µg/ml 20 – 30 µg/ml 30 – 40 µg/ml Stabilité : 24 h à 25 °C. * Si insuffisance rénale, alternative à envisager (avis du référent). Attention Concentration maximale : sur VVC → 80 mg/ml ; sur VVP → 5 mg/ml . Dosage de la vancocinémie 24 h après l’introduction ou un changement de posologie En cas de surdosage, l’arrêt transitoire de l’administration doit être discuté Astuce Dilution de la vancomycine : 2 g / 48 ml → vitesse en ml/h = posologie / 24 h Linézolide Posologie : 600 mg × 2/j IVL sur 1 h (pas d’adaptation à la fonction rénale) Doses méningées : 600 mg × 3/j IVL sur 1 h Attention si durée > 28 jours (myélotoxicité) ; surveillance NFS × 2/semaine Daptomycine Posologie : 10 mg/kg × 1/j IVL sur 10 min Clairance \u003c 30 ml/min : dose identique 1 jour sur 2 Indications : bactériémie, infection de la peau et des tissus mous, endocardite infectieuse Attention Inefficace en cas de pneumopathie."},{"t":"β-lactamines","i":"syringe","h":"\u003cul>\n\u003cli>Les β-lactamines sont des antibiotiques \u003cstrong>temps-dépendants\u003c/strong> : l’administration continue ou en perfusion lente doit être privilégiée.\u003c/li>\n\u003cli>Après 24 h de pleine dose, la dose doit être adaptée à la fonction rénale.\u003c/li>\n\u003cli>En cas d’insuffisance rénale (seuil différent en fonction de la molécule), la posologie doit être diminuée selon les données du \u003ca class=\"ext\" href=\"http://sitegpr.com/\" target=\"_blank\" rel=\"noopener noreferrer\">site GPR\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a> (également disponible via VIDAL).\u003c/li>\n\u003cli>En cas d’hyperclairance rénale (&gt; 150 ml/min), la posologie doit être augmentée.\u003c/li>\n\u003cli>Attention au risque d’hypovitaminose K en cas de perfusion de céfazoline : surveillance du TP 1 fois par semaine.\u003c/li>\n\u003c/ul>\n\u003ch3>Posologies et modes d’administration du service\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable class=\"dense\">\n\u003cthead>\u003ctr>\u003cth>Molécule\u003c/th>\u003cth>Seuil d’adaptation (insuffisance rénale)\u003c/th>\u003cth>Fonction rénale normale / EER\u003c/th>\u003cth>Hyperclairance > 150 ml/min\u003c/th>\u003cth>Concentration maximale\u003c/th>\u003cth>Stabilité\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003cth colspan=\"6\" class=\"grp\">Pénicillines\u003c/th>\u003c/tr>\n\u003ctr>\u003cth>Amoxicilline\u003c/th>\u003ctd>30 ml/min\u003c/td>\u003ctd>2 g × 3/jour IVL 1 h\u003c/td>\u003ctd>2 g × 4-5/jour IVL 1 h\u003c/td>\u003ctd>20 mg/ml\u003c/td>\u003ctd>8 h, 25 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Amoxicilline – acide clavulanique\u003c/th>\u003ctd>30 ml/min\u003c/td>\u003ctd>2 g × 3/jour IVL 1 h\u003c/td>\u003ctd>2 g × 4-5/jour IVL 1 h\u003c/td>\u003ctd>20 mg/ml\u003c/td>\u003ctd>8 h, 25 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Cloxacilline\u003c/th>\u003ctd>30 ml/min\u003c/td>\u003ctd>Bolus de 2 g IVL sur 1 h puis 10-12 g/24 h\u003cbr>soit 2 g/48 ml à 10-12 ml/h\u003c/td>\u003ctd>Bolus de 2 g IVL sur 1 h puis 10-12 g/24 h\u003cbr>soit 2 g/48 ml à 10-12 ml/h\u003c/td>\u003ctd>50 mg/ml\u003c/td>\u003ctd>24 h, 25 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Pipéracilline – tazobactam\u003c/th>\u003ctd>40 ml/min\u003c/td>\u003ctd>Bolus de 4 g IVL 1 h\u003cbr>puis 16 g/24 h soit 8 g/48 ml à 4 ml/h\u003c/td>\u003ctd>Bolus de 4 g IVL 1 h\u003cbr>puis 20 g/24 h soit 8 g/48 ml à 5 ml/h\u003c/td>\u003ctd>160 mg/ml\u003c/td>\u003ctd>24 h, 25 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003cth colspan=\"6\" class=\"grp\">Céphalosporines\u003c/th>\u003c/tr>\n\u003ctr>\u003cth>Céfazoline*\u003c/th>\u003ctd>60 ml/min\u003c/td>\u003ctd>Bolus de 2 g IVL 1 h\u003cbr>puis 6 g/24 h soit 4 g/48 ml à 3 ml/h\u003c/td>\u003ctd>Bolus de 2 g IVL 1 h\u003cbr>puis 8 g/24 h soit 4 g/48 ml à 4 ml/h\u003c/td>\u003ctd>100 mg/ml\u003c/td>\u003ctd>24 h, 25 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Céfotaxime\u003c/th>\u003ctd>60 ml/min\u003c/td>\u003ctd>Bolus de 2 g IVL 1 h\u003cbr>puis 6 g/24 h soit 1 g/48 ml à 12 ml/h\u003c/td>\u003ctd>Bolus de 2 g IVL 1 h\u003cbr>puis 8 g/24 h soit 1 g/48 ml à 16 ml/h\u003c/td>\u003ctd>20 mg/ml\u003c/td>\u003ctd>24 h, 25 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Ceftriaxone\u003c/th>\u003ctd>Pas d’adaptation\u003c/td>\u003ctd>2 g × 1/j IVL 30 min\u003c/td>\u003ctd>2 g × 2/jour IVL 30 min\u003c/td>\u003ctd>20 mg/ml\u003c/td>\u003ctd>24 h, 25 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Ceftazidime\u003c/th>\u003ctd>60 ml/min\u003c/td>\u003ctd>Bolus de 2 g IVL 1 h\u003cbr>puis 6 g/24 h soit 2 g/48 ml à 6 ml/h\u003c/td>\u003ctd>Bolus de 2 g IVL 1 h\u003cbr>puis 6 g/24 h soit 2 g/48 ml à 6 ml/h\u003c/td>\u003ctd>80 mg/ml\u003c/td>\u003ctd>8 h, 25 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Céfépime\u003c/th>\u003ctd>50 ml/min\u003c/td>\u003ctd>Bolus de 2 g IVL 1 h\u003cbr>puis 6 g/24 h soit 2 g/48 ml à 6 ml/h\u003c/td>\u003ctd>Bolus de 2 g IVL 1 h\u003cbr>puis 6 g/24 h soit 2 g/48 ml à 6 ml/h\u003c/td>\u003ctd>100 mg/ml\u003c/td>\u003ctd>24 h, 25 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Ceftolozane – tazobactam\u003c/th>\u003ctd>50 ml/min\u003c/td>\u003ctd>Bolus de 2 g IVL 1 h\u003cbr>puis 3 g/24 h soit 1 g × 3/j IVL 3 h\u003c/td>\u003ctd>Bolus de 2 g IVL 1 h\u003cbr>puis 6 g/24 h soit 2 g/48 ml à 6 ml/h\u003c/td>\u003ctd>80 mg/ml\u003c/td>\u003ctd>8 h, 25 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Ceftaroline\u003c/th>\u003ctd>50 ml/min\u003c/td>\u003ctd>600 mg × 2/jour IVL 1 h\u003c/td>\u003ctd>600 mg × 3/jour IVL 1 h\u003c/td>\u003ctd>12 mg/ml\u003c/td>\u003ctd>1 h, 25 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003cth colspan=\"6\" class=\"grp\">Monobactam\u003c/th>\u003c/tr>\n\u003ctr>\u003cth>Aztréonam\u003c/th>\u003ctd>30 ml/min\u003c/td>\u003ctd>6 g/24 h soit 2 g/48 ml à 6 ml/h\u003c/td>\u003ctd>8 g/24 h soit 4 g/48 ml à 4 ml/h\u003c/td>\u003ctd>100 mg/ml\u003c/td>\u003ctd>24 h, 25 °C\u003c/td>\u003c/tr>\n\u003ctr>\u003cth colspan=\"6\" class=\"grp\">Carbapénèmes\u003c/th>\u003c/tr>\n\u003ctr>\u003cth>Méropénème\u003c/th>\u003ctd>50 ml/min\u003c/td>\u003ctd>Bolus de 2 g IVL 1 h\u003cbr>puis 2 g × 3/jour IVL 3 h\u003c/td>\u003ctd>Bolus de 2 g IVL 1 h\u003cbr>puis 2 g × 3/jour IVL 3 h\u003c/td>\u003ctd>80 mg/ml\u003c/td>\u003ctd>24 h, 25 °C\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\n\u003cp>* Céfazoline : surveillance du TP 1 fois par semaine (risque d’hypovitaminose K).\u003c/p>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Tableau retranscrit depuis la page 23 du livret : en cas de doute sur une valeur, ouvrir la page originale en bas de fiche.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Les β-lactamines sont des antibiotiques temps-dépendants : l’administration continue ou en perfusion lente doit être privilégiée. Après 24 h de pleine dose, la dose doit être adaptée à la fonction rénale. En cas d’insuffisance rénale (seuil différent en fonction de la molécule), la posologie doit être diminuée selon les données du site GPR (également disponible via VIDAL). En cas d’hyperclairance rénale (> 150 ml/min), la posologie doit être augmentée. Attention au risque d’hypovitaminose K en cas de perfusion de céfazoline : surveillance du TP 1 fois par semaine. Posologies et modes d’administration du service Molécule Seuil d’adaptation (insuffisance rénale) Fonction rénale normale / EER Hyperclairance > 150 ml/min Concentration maximale Stabilité Pénicillines Amoxicilline 30 ml/min 2 g × 3/jour IVL 1 h 2 g × 4-5/jour IVL 1 h 20 mg/ml 8 h, 25 °C Amoxicilline – acide clavulanique 30 ml/min 2 g × 3/jour IVL 1 h 2 g × 4-5/jour IVL 1 h 20 mg/ml 8 h, 25 °C Cloxacilline 30 ml/min Bolus de 2 g IVL sur 1 h puis 10-12 g/24 h soit 2 g/48 ml à 10-12 ml/h Bolus de 2 g IVL sur 1 h puis 10-12 g/24 h soit 2 g/48 ml à 10-12 ml/h 50 mg/ml 24 h, 25 °C Pipéracilline – tazobactam 40 ml/min Bolus de 4 g IVL 1 h puis 16 g/24 h soit 8 g/48 ml à 4 ml/h Bolus de 4 g IVL 1 h puis 20 g/24 h soit 8 g/48 ml à 5 ml/h 160 mg/ml 24 h, 25 °C Céphalosporines Céfazoline* 60 ml/min Bolus de 2 g IVL 1 h puis 6 g/24 h soit 4 g/48 ml à 3 ml/h Bolus de 2 g IVL 1 h puis 8 g/24 h soit 4 g/48 ml à 4 ml/h 100 mg/ml 24 h, 25 °C Céfotaxime 60 ml/min Bolus de 2 g IVL 1 h puis 6 g/24 h soit 1 g/48 ml à 12 ml/h Bolus de 2 g IVL 1 h puis 8 g/24 h soit 1 g/48 ml à 16 ml/h 20 mg/ml 24 h, 25 °C Ceftriaxone Pas d’adaptation 2 g × 1/j IVL 30 min 2 g × 2/jour IVL 30 min 20 mg/ml 24 h, 25 °C Ceftazidime 60 ml/min Bolus de 2 g IVL 1 h puis 6 g/24 h soit 2 g/48 ml à 6 ml/h Bolus de 2 g IVL 1 h puis 6 g/24 h soit 2 g/48 ml à 6 ml/h 80 mg/ml 8 h, 25 °C Céfépime 50 ml/min Bolus de 2 g IVL 1 h puis 6 g/24 h soit 2 g/48 ml à 6 ml/h Bolus de 2 g IVL 1 h puis 6 g/24 h soit 2 g/48 ml à 6 ml/h 100 mg/ml 24 h, 25 °C Ceftolozane – tazobactam 50 ml/min Bolus de 2 g IVL 1 h puis 3 g/24 h soit 1 g × 3/j IVL 3 h Bolus de 2 g IVL 1 h puis 6 g/24 h soit 2 g/48 ml à 6 ml/h 80 mg/ml 8 h, 25 °C Ceftaroline 50 ml/min 600 mg × 2/jour IVL 1 h 600 mg × 3/jour IVL 1 h 12 mg/ml 1 h, 25 °C Monobactam Aztréonam 30 ml/min 6 g/24 h soit 2 g/48 ml à 6 ml/h 8 g/24 h soit 4 g/48 ml à 4 ml/h 100 mg/ml 24 h, 25 °C Carbapénèmes Méropénème 50 ml/min Bolus de 2 g IVL 1 h puis 2 g × 3/jour IVL 3 h Bolus de 2 g IVL 1 h puis 2 g × 3/jour IVL 3 h 80 mg/ml 24 h, 25 °C * Céfazoline : surveillance du TP 1 fois par semaine (risque d’hypovitaminose K). Note Tableau retranscrit depuis la page 23 du livret : en cas de doute sur une valeur, ouvrir la page originale en bas de fiche."}]},{"id":"rea-pneumopathie","s":"rea","t":"Pneumopathies liées aux soins","c":"Pneumopathies","g":"Infectiologie","i":"wind","p":[24],"r":"Épidémiologie précoce / tardive, antibiothérapie probabiliste, durée de traitement.","m":"PAVM, pneumopathie, pneumonie, ECBC, LBA, céfotaxime, amoxicilline acide clavulanique, pipéracilline tazobactam, céfépime, linézolide, carbapénème, BLSE","k":[{"t":"Introduction","i":"info","h":"\u003cul>\n\u003cli>Fréquent (OR &gt; 12 en neuroréanimation versus réanimation standard)\u003c/li>\n\u003cli>Prélèvements \u003cstrong>avant\u003c/strong> toute antibiothérapie : ECBC (envisager un LBA si immunodéprimé / échec thérapeutique / PAVM multiples) ; hémocultures ± PCR multiplex / COVID, voire germes atypiques selon le contexte\u003c/li>\n\u003c/ul>\n","x":"Fréquent (OR > 12 en neuroréanimation versus réanimation standard) Prélèvements avant toute antibiothérapie : ECBC (envisager un LBA si immunodéprimé / échec thérapeutique / PAVM multiples) ; hémocultures ± PCR multiplex / COVID, voire germes atypiques selon le contexte"},{"t":"Épidémiologie","i":"search","h":"\u003cul>\n\u003cli>\u003cstrong>Pneumopathie précoce (≤ 5 j) sans FDR*\u003c/strong> : germes communautaires (SAMS ; \u003cem>H. influenzae\u003c/em> ; \u003cem>S. pneumoniae\u003c/em> ; entérobactéries sensibles)\u003c/li>\n\u003cli>\u003cstrong>Pneumopathie tardive (&gt; 5 j) et/ou FDR*\u003c/strong> : couverture de \u003cem>P. aeruginosa\u003c/em> ; entérobactéries résistantes\u003c/li>\n\u003c/ul>\n\u003cp>* FDR : antibiothérapie &lt; 90 jours ; dialyse\u003c/p>\n","x":"Pneumopathie précoce (≤ 5 j) sans FDR* : germes communautaires (SAMS ; H. influenzae ; S. pneumoniae ; entérobactéries sensibles) Pneumopathie tardive (> 5 j) et/ou FDR* : couverture de P. aeruginosa ; entérobactéries résistantes * FDR : antibiothérapie \u003c 90 jours ; dialyse"},{"t":"Traitement probabiliste","i":"pill","h":"\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> Surmortalité si traitement différé, d’autant plus si choc septique, SDRA ou immunodépression (Leone et al., SFAR – SRLF 2017 / HAS 2019).\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003ch3>Pneumopathie précoce (≤ 5 jours)\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Céfotaxime\u003c/strong> ou \u003cstrong>amoxicilline – acide clavulanique\u003c/strong> (si suspicion d’inhalation, ≤ J2 et pas d’antibioprophylaxie)\u003c/li>\n\u003cli>± Gentamicine si choc\u003c/li>\n\u003c/ul>\n\u003ch3>Pneumopathie tardive et/ou FDR\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Pipéracilline – tazobactam\u003c/strong> ou \u003cstrong>céfépime\u003c/strong> (attention au risque d’encéphalopathie)\u003c/li>\n\u003cli>± Amikacine si choc\u003c/li>\n\u003c/ul>\n\u003ch3>Cas particuliers\u003c/h3>\n\u003cul>\n\u003cli>Ajout de \u003cstrong>linézolide\u003c/strong> (anti-SARM) si : colonisation récente à SARM, ou dialysé chronique, ou lésion cutanée chronique\u003c/li>\n\u003cli>\u003cstrong>Carbapénème\u003c/strong> seulement si portage de BLSE \u003cstrong>et\u003c/strong> signes de gravité (choc ; immunodépression)\u003c/li>\n\u003c/ul>\n","x":"Attention Surmortalité si traitement différé, d’autant plus si choc septique, SDRA ou immunodépression (Leone et al., SFAR – SRLF 2017 / HAS 2019). Pneumopathie précoce (≤ 5 jours) Céfotaxime ou amoxicilline – acide clavulanique (si suspicion d’inhalation, ≤ J2 et pas d’antibioprophylaxie) ± Gentamicine si choc Pneumopathie tardive et/ou FDR Pipéracilline – tazobactam ou céfépime (attention au risque d’encéphalopathie) ± Amikacine si choc Cas particuliers Ajout de linézolide (anti-SARM) si : colonisation récente à SARM, ou dialysé chronique, ou lésion cutanée chronique Carbapénème seulement si portage de BLSE et signes de gravité (choc ; immunodépression)"},{"t":"Adaptation secondaire","i":"pill","h":"\u003cp>Adaptation secondaire aux prélèvements bactériologiques → voir le tableau du chapitre \u003ca class=\"xref\" href=\"#rea-atb\">Bon usage des anti-infectieux\u003c/a>.\u003c/p>\n","x":"Adaptation secondaire aux prélèvements bactériologiques → voir le tableau du chapitre Bon usage des anti-infectieux ."},{"t":"Durée d’antibiothérapie","i":"clock","h":"\u003cul>\n\u003cli>\u003cstrong>Pneumopathie confirmée\u003c/strong> (= foyer radiologique) : \u003cstrong>7 jours\u003c/strong>, hors cas particulier (abcès, pleuro-pneumopathie, immunodéprimé)\u003c/li>\n\u003cli>\u003cstrong>Trachéo-bronchite\u003c/strong> (= absence de foyer) : une cure plus courte (\u003cstrong>5 jours\u003c/strong>) peut être envisagée\u003c/li>\n\u003c/ul>\n","x":"Pneumopathie confirmée (= foyer radiologique) : 7 jours , hors cas particulier (abcès, pleuro-pneumopathie, immunodéprimé) Trachéo-bronchite (= absence de foyer) : une cure plus courte ( 5 jours ) peut être envisagée"},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://sfar.org/wp-content/uploads/2017/09/2-2_PNEUMONIES-ASSOCIEES-AUX-SOINS-DE-REANIMATION.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">RFE SFAR – SRLF 2017 : pneumonies associées aux soins de réanimation (PDF)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. RFE SFAR – SRLF 2017 : pneumonies associées aux soins de réanimation (PDF)"}]},{"id":"rea-meningite","s":"rea","t":"Méningites et méningo-ventriculites nosocomiales","c":"Méningites nosocomiales","g":"Infectiologie","i":"bug","p":[25,26,27],"r":"Diagnostic (LCR score, lactatorachie, cell-index), antibiothérapie probabiliste, durées, doses méningées.","m":"méningite, ventriculite, DVE, LCR, lactatorachie, cell-index, ceftazidime, méropénème, linézolide, vancomycine, doses méningées","k":[{"t":"Quand y penser","i":"info","h":"\u003cp>À évoquer devant \u003cstrong>tout sepsis\u003c/strong> chez un patient à risque :\u003c/p>\n\u003cul>\n\u003cli>Post-opératoire de neurochirurgie\u003c/li>\n\u003cli>DVE (d’autant plus si fuite de LCR), DVC, DVP\u003c/li>\n\u003cli>Traumatisé crânien (embarrure ; brèche ostéo-méningée)\u003c/li>\n\u003c/ul>\n","x":"À évoquer devant tout sepsis chez un patient à risque : Post-opératoire de neurochirurgie DVE (d’autant plus si fuite de LCR), DVC, DVP Traumatisé crânien (embarrure ; brèche ostéo-méningée)"},{"t":"Diagnostic","i":"stethoscope","h":"\u003cul>\n\u003cli>Difficile : clinique aspécifique, présence de sang dans le LCR en lien avec l’HSA ou la chirurgie\u003c/li>\n\u003cli>La \u003cstrong>lactatorachie\u003c/strong> a une bonne VPP et une bonne VPN, avec une valeur seuil de 4 à 5 mmol/l dans la littérature\u003c/li>\n\u003cli>Le \u003cstrong>LCR score\u003c/strong> a une VPN élevée\u003c/li>\n\u003cli>La cinétique du \u003cstrong>cell-index (CI)\u003c/strong> est une aide au diagnostic : l’augmentation du CI est en faveur du diagnostic\u003c/li>\n\u003c/ul>\n\u003ch3>LCR score (1 point par item)\u003c/h3>\n\u003cul>\n\u003cli>Leucocytes ≥ 500/mm³\u003c/li>\n\u003cli>Neutrophiles ≥ 80 %\u003c/li>\n\u003cli>Glucose LCR / sérum ≤ 0,40\u003c/li>\n\u003cli>Lactatorachie ≥ 4 mmol/l\u003c/li>\n\u003c/ul>\n\u003ch3>Cell-index\u003c/h3>\n\u003cp class=\"formula\">Cell-index = \u003cspan class=\"frac\">\u003cspan>Leucocytes\u003csub>LCR\u003c/sub> / GR\u003csub>LCR\u003c/sub>\u003c/span>\u003cspan>Leucocytes\u003csub>sang\u003c/sub> / GR\u003csub>sang\u003c/sub>\u003c/span>\u003c/span>\u003c/p>\n\n\u003cp>Rapport sans unité : leucocytes et globules rouges (GR) exprimés dans la même unité dans le LCR d’une part, dans le sang d’autre part.\u003c/p>\n","x":"Difficile : clinique aspécifique, présence de sang dans le LCR en lien avec l’HSA ou la chirurgie La lactatorachie a une bonne VPP et une bonne VPN, avec une valeur seuil de 4 à 5 mmol/l dans la littérature Le LCR score a une VPN élevée La cinétique du cell-index (CI) est une aide au diagnostic : l’augmentation du CI est en faveur du diagnostic LCR score (1 point par item) Leucocytes ≥ 500/mm³ Neutrophiles ≥ 80 % Glucose LCR / sérum ≤ 0,40 Lactatorachie ≥ 4 mmol/l Cell-index Cell-index = Leucocytes LCR / GR LCR Leucocytes sang / GR sang Rapport sans unité : leucocytes et globules rouges (GR) exprimés dans la même unité dans le LCR d’une part, dans le sang d’autre part."},{"t":"Algorithme de prise en charge","i":"workflow","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/meningite-algo.webp\" data-legende=\"Figure 1 : Algorithme de prise en charge des méningo-ventriculites\">\u003cimg src=\"figures/meningite-algo.webp\" alt=\"Figure 1 : Algorithme de prise en charge des méningo-ventriculites\" width=\"2329\" height=\"1215\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Figure 1 : Algorithme de prise en charge des méningo-ventriculites\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>Contexte clinique évocateur → prélèvement de LCR distal si DVE (IDE) : bactériologie avec cell-index + biochimie avec lactates (LCR frais)\u003c/li>\n\u003cli>\u003cstrong>LCR score ≤ 1 et lactatorachie &lt; 4 et autre point d’appel\u003c/strong> → pas d’antibiothérapie spécifique\u003c/li>\n\u003cli>\u003cstrong>LCR score ≥ 2 et/ou lactatorachie ≥ 4 et/ou cell-index en augmentation\u003c/strong> → si examen direct positif : prélèvement proximal pour éliminer une colonisation de la burette ; discussion collégiale de l’introduction d’une antibiothérapie probabiliste, avis du référent\u003c/li>\n\u003cli>Culture du LCR négative à J3 → arrêt de l’anti-BGN, poursuite de l’anti-CG+\u003c/li>\n\u003cli>Culture du LCR négative à J5 → méningite aseptique : arrêt des antibiotiques ; méningite non documentée : poursuite de l’anti-CG+\u003c/li>\n\u003cli>Culture du LCR positive → avis du référent, antibiothérapie ≥ 14 j\u003c/li>\n\u003c/ul>\n","x":"Agrandir Contexte clinique évocateur → prélèvement de LCR distal si DVE (IDE) : bactériologie avec cell-index + biochimie avec lactates (LCR frais) LCR score ≤ 1 et lactatorachie \u003c 4 et autre point d’appel → pas d’antibiothérapie spécifique LCR score ≥ 2 et/ou lactatorachie ≥ 4 et/ou cell-index en augmentation → si examen direct positif : prélèvement proximal pour éliminer une colonisation de la burette ; discussion collégiale de l’introduction d’une antibiothérapie probabiliste, avis du référent Culture du LCR négative à J3 → arrêt de l’anti-BGN, poursuite de l’anti-CG+ Culture du LCR négative à J5 → méningite aseptique : arrêt des antibiotiques ; méningite non documentée : poursuite de l’anti-CG+ Culture du LCR positive → avis du référent, antibiothérapie ≥ 14 j"},{"t":"Antibiothérapie probabiliste","i":"pill","h":"\u003cp>Association de :\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Anti-BGN anti-pyocyanique\u003c/strong> : \u003cstrong>ceftazidime\u003c/strong> 2 g en dose de charge puis 100 mg/kg/j IVSE (1ʳᵉ intention) ou méropénème (2ᵉ intention)\u003c/li>\n\u003cli>\u003cstrong>Anti-CGP\u003c/strong> : \u003cstrong>linézolide\u003c/strong> 600 mg × 3/j IVL (1ʳᵉ intention) ou vancomycine\u003c/li>\n\u003c/ul>\n\u003ch3>Adaptation\u003c/h3>\n\u003cul>\n\u003cli>Selon l’antibiogramme ; posologies : voir « Doses méningées »\u003c/li>\n\u003cli>\u003cstrong>Staphylocoque\u003c/strong> : traitement en bithérapie si nécessité de maintien du matériel (dont DVE) ou mauvaise évolution ; antibiogramme indispensable (résistances à la rifampicine non rares)\u003c/li>\n\u003c/ul>\n","x":"Association de : Anti-BGN anti-pyocyanique : ceftazidime 2 g en dose de charge puis 100 mg/kg/j IVSE (1ʳᵉ intention) ou méropénème (2ᵉ intention) Anti-CGP : linézolide 600 mg × 3/j IVL (1ʳᵉ intention) ou vancomycine Adaptation Selon l’antibiogramme ; posologies : voir « Doses méningées » Staphylocoque : traitement en bithérapie si nécessité de maintien du matériel (dont DVE) ou mauvaise évolution ; antibiogramme indispensable (résistances à la rifampicine non rares)"},{"t":"Mesures associées","i":"shield-check","h":"\u003cul>\n\u003cli>TDM injectée avec temps tardif à \u003cstrong>J5\u003c/strong> pour recherche d’abcès ou de ventriculite\u003c/li>\n\u003cli>Si DVE : \u003cstrong>changement dans les 48 h\u003c/strong> du début de l’antibiothérapie, ou ablation si possible\u003c/li>\n\u003c/ul>\n","x":"TDM injectée avec temps tardif à J5 pour recherche d’abcès ou de ventriculite Si DVE : changement dans les 48 h du début de l’antibiothérapie, ou ablation si possible"},{"t":"Durée d’antibiothérapie","i":"clock","h":"\u003ch3>Arrêt précoce si LCR stérile\u003c/h3>\n\u003cp>En l’absence d’un prélèvement réalisé sous antibiothérapie :\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>J3\u003c/strong> : arrêt de l’anti-BGN\u003c/li>\n\u003cli>\u003cstrong>J5\u003c/strong> : arrêt de l’anti-CGP\u003c/li>\n\u003c/ul>\n\u003ch3>Méningite nosocomiale\u003c/h3>\n\u003cul>\n\u003cli>Staphylocoque → \u003cstrong>14 jours\u003c/strong> après changement / ablation de la DVE\u003c/li>\n\u003cli>BGN → \u003cstrong>21 jours\u003c/strong> après changement / ablation de la DVE\u003c/li>\n\u003c/ul>\n\u003ch3>Abcès ou empyème\u003c/h3>\n\u003cp>6 à 12 semaines — voir \u003ca class=\"xref\" href=\"#rea-abces\">Abcès cérébraux et empyèmes\u003c/a>.\u003c/p>\n","x":"Arrêt précoce si LCR stérile En l’absence d’un prélèvement réalisé sous antibiothérapie : J3 : arrêt de l’anti-BGN J5 : arrêt de l’anti-CGP Méningite nosocomiale Staphylocoque → 14 jours après changement / ablation de la DVE BGN → 21 jours après changement / ablation de la DVE Abcès ou empyème 6 à 12 semaines — voir Abcès cérébraux et empyèmes ."},{"t":"Doses méningées","i":"syringe","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Molécule\u003c/th>\n\u003cth>Posologie\u003c/th>\n\u003cth align=\"center\">Concentration maximale\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Méropénème\u003c/td>\n\u003ctd>2 g puis 2 g × 3/j IVL sur 3 h\u003c/td>\n\u003ctd align=\"center\">80 mg/ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Céfépime\u003c/td>\n\u003ctd>2 g puis 6 g/24 h IVSE — dosage systématique à 48 h ± EEG\u003c/td>\n\u003ctd align=\"center\">100 mg/ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Vancomycine\u003c/td>\n\u003ctd>Dose de charge 30 mg/kg IVL sur 2 h puis 60 mg/kg/j IVSE — concentration plasmatique cible : 30 – 40 µg/ml\u003c/td>\n\u003ctd align=\"center\">80 mg/ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Linézolide\u003c/td>\n\u003ctd>600 mg × 3/j IVL (ou IVSE)\u003c/td>\n\u003ctd align=\"center\">Déjà dilué\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Céfotaxime\u003c/td>\n\u003ctd>2 g puis 200 mg/kg/j IVSE — 2 à 3 g puis 300 mg/kg/j si \u003cem>S. pneumoniae\u003c/em>\u003c/td>\n\u003ctd align=\"center\">20 mg/ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ceftriaxone\u003c/td>\n\u003ctd>2 g × 3/j IVL sur 10 min — 100 mg/kg/j si \u003cem>S. pneumoniae\u003c/em>\u003c/td>\n\u003ctd align=\"center\">20 mg/ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ceftazidime\u003c/td>\n\u003ctd>2 g puis 100 mg/kg/j IVSE\u003c/td>\n\u003ctd align=\"center\">80 mg/ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Amoxicilline\u003c/td>\n\u003ctd>2 g puis 200 mg/kg/j\u003c/td>\n\u003ctd align=\"center\">20 mg/ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Cloxacilline\u003c/td>\n\u003ctd>2 g puis 200 mg/kg/j IVSE ou IVL en 4 à 6 prises\u003c/td>\n\u003ctd align=\"center\">50 mg/ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Céfazoline\u003c/td>\n\u003ctd>2 g puis 8 à 12 g/j IVSE chez l’adulte\u003c/td>\n\u003ctd align=\"center\">100 mg/ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Métronidazole\u003c/td>\n\u003ctd>500 mg × 3/j IVL\u003c/td>\n\u003ctd align=\"center\">Déjà dilué\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fosfomycine\u003c/td>\n\u003ctd>4 g × 3/j IVL\u003c/td>\n\u003ctd align=\"center\">20 mg/ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Rifampicine\u003c/td>\n\u003ctd>600 mg × 2/j IVL ou PO\u003c/td>\n\u003ctd align=\"center\">600 mg/10 ml G5 %\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Gentamicine\u003c/td>\n\u003ctd>5 mg/kg/j\u003c/td>\n\u003ctd align=\"center\">10 mg/ml\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Aciclovir\u003c/td>\n\u003ctd>10 mg/kg × 3/j\u003c/td>\n\u003ctd align=\"center\">5 mg/ml\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n","x":"Molécule Posologie Concentration maximale Méropénème 2 g puis 2 g × 3/j IVL sur 3 h 80 mg/ml Céfépime 2 g puis 6 g/24 h IVSE — dosage systématique à 48 h ± EEG 100 mg/ml Vancomycine Dose de charge 30 mg/kg IVL sur 2 h puis 60 mg/kg/j IVSE — concentration plasmatique cible : 30 – 40 µg/ml 80 mg/ml Linézolide 600 mg × 3/j IVL (ou IVSE) Déjà dilué Céfotaxime 2 g puis 200 mg/kg/j IVSE — 2 à 3 g puis 300 mg/kg/j si S. pneumoniae 20 mg/ml Ceftriaxone 2 g × 3/j IVL sur 10 min — 100 mg/kg/j si S. pneumoniae 20 mg/ml Ceftazidime 2 g puis 100 mg/kg/j IVSE 80 mg/ml Amoxicilline 2 g puis 200 mg/kg/j 20 mg/ml Cloxacilline 2 g puis 200 mg/kg/j IVSE ou IVL en 4 à 6 prises 50 mg/ml Céfazoline 2 g puis 8 à 12 g/j IVSE chez l’adulte 100 mg/ml Métronidazole 500 mg × 3/j IVL Déjà dilué Fosfomycine 4 g × 3/j IVL 20 mg/ml Rifampicine 600 mg × 2/j IVL ou PO 600 mg/10 ml G5 % Gentamicine 5 mg/kg/j 10 mg/ml Aciclovir 10 mg/kg × 3/j 5 mg/ml"},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1093/cid/ciw861\" target=\"_blank\" rel=\"noopener noreferrer\">IDSA 2017 : Clinical Practice Guidelines for Healthcare-Associated Ventriculitis and Meningitis (Clin Infect Dis)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. IDSA 2017 : Clinical Practice Guidelines for Healthcare-Associated Ventriculitis and Meningitis (Clin Infect Dis)"}]},{"id":"rea-abces","s":"rea","t":"Abcès cérébraux et empyèmes","c":"Abcès et empyèmes","g":"Infectiologie","i":"radar","p":[28],"r":"Étiologies, bilan, filière dentaire, ponction-biopsie, antibiothérapie selon le terrain.","m":"abcès cérébral, empyème, céfotaxime, métronidazole, céfépime, linézolide, VIH, toxoplasmose, nocardiose, dento-TDM, cone beam","k":[{"t":"Définitions","i":"info","h":"\u003cul>\n\u003cli>\u003cstrong>Empyème\u003c/strong> : collection suppurée développée dans l’espace sous-dural ou extra-dural\u003c/li>\n\u003cli>\u003cstrong>Abcès\u003c/strong> : collection suppurée développée au sein du parenchyme cérébral\u003c/li>\n\u003cli>Mortalité élevée → 15 – 20 %\u003c/li>\n\u003c/ul>\n","x":"Empyème : collection suppurée développée dans l’espace sous-dural ou extra-dural Abcès : collection suppurée développée au sein du parenchyme cérébral Mortalité élevée → 15 – 20 %"},{"t":"Étiologies","i":"search","h":"\u003cul>\n\u003cli>Infection par contiguïté = 50 % (infection ORL ou post-craniotomie)\u003c/li>\n\u003cli>Dissémination hématogène = 30 % (endocardite infectieuse, infection dentaire…)\u003c/li>\n\u003cli>Inconnue = 20 %\u003c/li>\n\u003cli>Terrain immunodéprimé = étiologies spécifiques à rechercher :\u003cul>\n\u003cli>VIH : toxoplasmose, tuberculose, cryptococcose\u003c/li>\n\u003cli>Transplanté : \u003cem>Aspergillus\u003c/em> (&lt; 1 an), nocardiose (&gt; 1 an)\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","x":"Infection par contiguïté = 50 % (infection ORL ou post-craniotomie) Dissémination hématogène = 30 % (endocardite infectieuse, infection dentaire…) Inconnue = 20 % Terrain immunodéprimé = étiologies spécifiques à rechercher : VIH : toxoplasmose, tuberculose, cryptococcose Transplanté : Aspergillus (\u003c 1 an), nocardiose (> 1 an)"},{"t":"Bilan et mesures associées","i":"test-tubes","h":"\u003cul>\n\u003cli>\u003cstrong>Bactériologie\u003c/strong> : hémocultures, PL hors contre-indication, ponction-aspiration chirurgicale, cultures spécifiques si immunodéprimé (\u003cem>Nocardia\u003c/em>…), ARN 16S si cultures négatives\u003c/li>\n\u003cli>Recherche d’une \u003cstrong>porte d’entrée\u003c/strong> (ORL, cutanée, digestive, pulmonaire…) et d’une \u003cstrong>localisation secondaire\u003c/strong> (spondylodiscite, endocardite…)\u003c/li>\n\u003cli>Patient intubé : dento-TDM ; patient non intubé : cone beam\u003c/li>\n\u003cli>TDM TAP, ETT ± ETO séniorisée\u003c/li>\n\u003cli>Recherche d’une immunodépression : sérologie VIH, NFS, électrophorèse des protéines plasmatiques, dosage du complément (CH50, C3, C4)\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> \u003cstrong>Sérologie VIH systématique\u003c/strong> devant toute découverte d’abcès cérébral, et avant une éventuelle biopsie !\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003ch3>Filière d’éradication du foyer dentaire\u003c/h3>\n\u003cp>Après réalisation de l’examen dentaire, contacter par mail le référent de la filière dentaire (coordonnées dans l’annuaire interne), avec le référent infectieux en copie.\u003c/p>\n","x":"Bactériologie : hémocultures, PL hors contre-indication, ponction-aspiration chirurgicale, cultures spécifiques si immunodéprimé ( Nocardia …), ARN 16S si cultures négatives Recherche d’une porte d’entrée (ORL, cutanée, digestive, pulmonaire…) et d’une localisation secondaire (spondylodiscite, endocardite…) Patient intubé : dento-TDM ; patient non intubé : cone beam TDM TAP, ETT ± ETO séniorisée Recherche d’une immunodépression : sérologie VIH, NFS, électrophorèse des protéines plasmatiques, dosage du complément (CH50, C3, C4) Attention Sérologie VIH systématique devant toute découverte d’abcès cérébral, et avant une éventuelle biopsie ! Filière d’éradication du foyer dentaire Après réalisation de l’examen dentaire, contacter par mail le référent de la filière dentaire (coordonnées dans l’annuaire interne), avec le référent infectieux en copie."},{"t":"Traitement","i":"pill","h":"\u003cul>\n\u003cli>\u003cstrong>Ponction – biopsie chirurgicale\u003c/strong> (sauf VIH)\u003c/li>\n\u003cli>\u003cstrong>Antibiothérapie\u003c/strong> : durée de 6 – 8 semaines\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Terrain\u003c/th>\n\u003cth>Antibiothérapie\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Immunocompétent, infection communautaire\u003c/td>\n\u003ctd>\u003cstrong>Céfotaxime\u003c/strong> 200 mg/kg/j (sans dépasser 12 g/j) IVSE (1 g/48 ml à vitesse adaptée au poids) + \u003cstrong>métronidazole\u003c/strong> 500 mg × 3/j IVL sur 1 h\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Immunocompétent, infection post-opératoire\u003c/td>\n\u003ctd>\u003cstrong>Céfépime\u003c/strong> 2 g × 3/j IVL + \u003cstrong>linézolide\u003c/strong> 600 mg × 2 à 3/j IVL (sauf exposition au linézolide dans les 6 derniers mois)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Transplanté d’organe solide / hématologie\u003c/td>\n\u003ctd>Ajout de cotrimoxazole + voriconazole\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VIH\u003c/td>\n\u003ctd>Ajout de pyriméthamine – sulfadiazine\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> VIH : la ponction – biopsie n’est pas systématique ; une bonne réponse au traitement d’épreuve peut suffire à confirmer le diagnostic de toxoplasmose.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Ponction – biopsie chirurgicale (sauf VIH) Antibiothérapie : durée de 6 – 8 semaines Terrain Antibiothérapie Immunocompétent, infection communautaire Céfotaxime 200 mg/kg/j (sans dépasser 12 g/j) IVSE (1 g/48 ml à vitesse adaptée au poids) + métronidazole 500 mg × 3/j IVL sur 1 h Immunocompétent, infection post-opératoire Céfépime 2 g × 3/j IVL + linézolide 600 mg × 2 à 3/j IVL (sauf exposition au linézolide dans les 6 derniers mois) Transplanté d’organe solide / hématologie Ajout de cotrimoxazole + voriconazole VIH Ajout de pyriméthamine – sulfadiazine Note VIH : la ponction – biopsie n’est pas systématique ; une bonne réponse au traitement d’épreuve peut suffire à confirmer le diagnostic de toxoplasmose."},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://pubmed.ncbi.nlm.nih.gov/?term=ESCMID+guidelines+brain+abscess+Bodilsen+2024\" target=\"_blank\" rel=\"noopener noreferrer\">ESCMID 2023 : guidelines on diagnosis and treatment of brain abscess in children and adults (recherche PubMed)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. ESCMID 2023 : guidelines on diagnosis and treatment of brain abscess in children and adults (recherche PubMed)"}]},{"id":"rea-infection-urinaire","s":"rea","t":"Infection urinaire nosocomiale","c":"Infection urinaire","g":"Infectiologie","i":"glass-water","p":[29],"r":"Indications de l’ECBU, seuils chez le patient sondé, prise en charge, durées.","m":"infection urinaire, ECBU, sonde vésicale, bactériurie, colonisation, IUAS, pyélonéphrite","k":[{"t":"Définition","i":"info","h":"\u003cp>Infection urinaire survenant après au moins \u003cstrong>48 heures d’hospitalisation\u003c/strong>, ou après un geste invasif urologique (ou, en cas de matériel endo-urinaire, jusqu’à 7 jours suivant son ablation).\u003c/p>\n","x":"Infection urinaire survenant après au moins 48 heures d’hospitalisation , ou après un geste invasif urologique (ou, en cas de matériel endo-urinaire, jusqu’à 7 jours suivant son ablation)."},{"t":"Quand rechercher ?","i":"stethoscope","h":"\u003cul>\n\u003cli>Chez un patient conscient présentant un syndrome infectieux, des signes d’infection urinaire basse et haute doivent être systématiquement recherchés\u003c/li>\n\u003cli>La pyurie sur sonde vésicale n’a \u003cstrong>aucune valeur diagnostique\u003c/strong>\u003c/li>\n\u003c/ul>\n","x":"Chez un patient conscient présentant un syndrome infectieux, des signes d’infection urinaire basse et haute doivent être systématiquement recherchés La pyurie sur sonde vésicale n’a aucune valeur diagnostique"},{"t":"Place du prélèvement urinaire","i":"test-tubes","h":"\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> Les prélèvements urinaires ne doivent \u003cstrong>pas\u003c/strong> être systématiques.\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003cp>Un ECBU doit être réalisé :\u003c/p>\n\u003cul>\n\u003cli>en cas d’argument clinique\u003c/li>\n\u003cli>en cas de signes de gravité\u003c/li>\n\u003cli>en cas de syndrome infectieux non expliqué\u003c/li>\n\u003c/ul>\n\u003ch3>Patients sondés\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Leucocyturie\u003c/strong> : pas de valeur diagnostique\u003c/li>\n\u003cli>\u003cstrong>Bactériurie\u003c/strong> : seuil significatif &gt; 10³ UFC/ml (ou 10² UFC/ml si prélèvement profond — urines pyéliques)\u003c/li>\n\u003cli>Si inférieure au seuil : diagnostic d’IUAS non éliminé (augmentation du seuil en 1 à 3 jours en l’absence de traitement)\u003c/li>\n\u003c/ul>\n","x":"Important Les prélèvements urinaires ne doivent pas être systématiques. Un ECBU doit être réalisé : en cas d’argument clinique en cas de signes de gravité en cas de syndrome infectieux non expliqué Patients sondés Leucocyturie : pas de valeur diagnostique Bactériurie : seuil significatif > 10³ UFC/ml (ou 10² UFC/ml si prélèvement profond — urines pyéliques) Si inférieure au seuil : diagnostic d’IUAS non éliminé (augmentation du seuil en 1 à 3 jours en l’absence de traitement)"},{"t":"Prise en charge","i":"pill","h":"\u003cul>\n\u003cli>\u003cstrong>Colonisation urinaire\u003c/strong> (bactériurie asymptomatique) : pas d’antibiothérapie\u003c/li>\n\u003cli>\u003cstrong>Choc septique ou infection à \u003cem>P. aeruginosa\u003c/em>, \u003cem>S. marcescens\u003c/em> ou \u003cem>A. baumannii\u003c/em>\u003c/strong> : bithérapie par β-lactamine + aminoside ou fluoroquinolone (exemple : pipéracilline-tazobactam ± amikacine)\u003c/li>\n\u003cli>Adaptation secondaire à l’antibiogramme\u003c/li>\n\u003cli>Si la sonde vésicale doit être maintenue, un \u003cstrong>changement\u003c/strong> sera réalisé à 24 h d’antibiothérapie\u003c/li>\n\u003c/ul>\n","x":"Colonisation urinaire (bactériurie asymptomatique) : pas d’antibiothérapie Choc septique ou infection à P. aeruginosa , S. marcescens ou A. baumannii : bithérapie par β-lactamine + aminoside ou fluoroquinolone (exemple : pipéracilline-tazobactam ± amikacine) Adaptation secondaire à l’antibiogramme Si la sonde vésicale doit être maintenue, un changement sera réalisé à 24 h d’antibiothérapie"},{"t":"Durée de traitement","i":"clock","h":"\u003cul>\n\u003cli>Femme : \u003cstrong>10 jours\u003c/strong>\u003c/li>\n\u003cli>Homme : \u003cstrong>14 jours\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>Dans certaines situations, le traitement peut être raccourci à \u003cstrong>5 jours\u003c/strong> (traitement par lévofloxacine en l’absence de signe de gravité) ou à \u003cstrong>3 jours\u003c/strong> (femme ≤ 65 ans, sans pyélonéphrite aiguë et après ablation de la sonde urinaire).\u003c/p>\n","x":"Femme : 10 jours Homme : 14 jours Dans certaines situations, le traitement peut être raccourci à 5 jours (traitement par lévofloxacine en l’absence de signe de gravité) ou à 3 jours (femme ≤ 65 ans, sans pyélonéphrite aiguë et après ablation de la sonde urinaire)."},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://www.infectiologie.com/fr/recommandations.html\" target=\"_blank\" rel=\"noopener noreferrer\">SPILF : recommandations en infectiologie (dont infections urinaires associées aux soins)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. SPILF : recommandations en infectiologie (dont infections urinaires associées aux soins)"}]},{"id":"rea-catheters","s":"rea","t":"Infections liées aux cathéters","c":"Infections liées aux cathéters","g":"Infectiologie","i":"cable","p":[30,31,32],"r":"Diagnostic d’ILC, algorithme de prise en charge, antibiothérapie probabiliste et durées.","m":"ILC, cathéter, KT, VVC, bactériémie, fongémie, hémocultures différentielles, daptomycine, vancomycine, caspofungine, thrombophlébite","k":[{"t":"Diagnostic","i":"stethoscope","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/ilc-diagnostic.webp\" data-legende=\"Diagnostic des infections liées aux cathéters (ILC)\">\u003cimg src=\"figures/ilc-diagnostic.webp\" alt=\"Diagnostic des infections liées aux cathéters (ILC)\" width=\"1481\" height=\"944\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Diagnostic des infections liées aux cathéters (ILC)\u003c/figcaption>\u003c/figure>\n\u003ch3>Colonisation du cathéter\u003c/h3>\n\u003cp>Culture du KT ou hémoculture sur KT ≥ 10³ UFC/ml.\u003c/p>\n\u003ch3>Diagnostic d’ILC\u003c/h3>\n\u003cp>Colonisation \u003cstrong>ET\u003c/strong> ≥ 1 critère parmi :\u003c/p>\n\u003cul>\n\u003cli>Signes généraux (cliniques ou biologiques)\u003c/li>\n\u003cli>Signes locaux (rougeur &gt; 0,5 cm, tunnelite, écoulement purulent, abcès)\u003c/li>\n\u003cli>2 hémocultures positives au même germe\u003c/li>\n\u003c/ul>\n\u003ch3>Signes de gravité\u003c/h3>\n\u003cul>\n\u003cli>Instabilité hémodynamique\u003c/li>\n\u003cli>Neutropénie &lt; 500/mm³\u003c/li>\n\u003cli>Immunosuppression\u003c/li>\n\u003cli>Matériel étranger intravasculaire\u003c/li>\n\u003cli>Suppuration / érythème franc &gt; 0,5 cm\u003c/li>\n\u003c/ul>\n\u003ch3>ILC non septicémique\u003c/h3>\n\u003cul>\n\u003cli>Culture du KT ≥ 10³ UFC/ml\u003c/li>\n\u003cli>Et signes d’infection locale (purulence ou tunnelite)\u003c/li>\n\u003cli>Et/ou signes généraux (régression ≤ 48 h du retrait du KT)\u003c/li>\n\u003c/ul>\n\u003ch3>Bactériémie / fongémie liée au cathéter\u003c/h3>\n\u003cp>≤ 48 h suivant le diagnostic d’ILC \u003cstrong>ET\u003c/strong> critères bactériologiques :\u003c/p>\n\u003cul>\n\u003cli>Hémoculture positive au même germe que sur le KT\u003c/li>\n\u003cli>Ou hémocultures périphérique et centrale positives avec :\u003col>\n\u003cli>rapport quantitatif Hc centrale / Hc périphérique &gt; 5\u003c/li>\n\u003cli>différentiel de positivité Hc centrale − Hc périphérique &gt; 120 min\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003c/ul>\n","x":"Agrandir Colonisation du cathéter Culture du KT ou hémoculture sur KT ≥ 10³ UFC/ml. Diagnostic d’ILC Colonisation ET ≥ 1 critère parmi : Signes généraux (cliniques ou biologiques) Signes locaux (rougeur > 0,5 cm, tunnelite, écoulement purulent, abcès) 2 hémocultures positives au même germe Signes de gravité Instabilité hémodynamique Neutropénie \u003c 500/mm³ Immunosuppression Matériel étranger intravasculaire Suppuration / érythème franc > 0,5 cm ILC non septicémique Culture du KT ≥ 10³ UFC/ml Et signes d’infection locale (purulence ou tunnelite) Et/ou signes généraux (régression ≤ 48 h du retrait du KT) Bactériémie / fongémie liée au cathéter ≤ 48 h suivant le diagnostic d’ILC ET critères bactériologiques : Hémoculture positive au même germe que sur le KT Ou hémocultures périphérique et centrale positives avec : rapport quantitatif Hc centrale / Hc périphérique > 5 différentiel de positivité Hc centrale − Hc périphérique > 120 min"},{"t":"Algorithme de prise en charge","i":"workflow","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/ilc-prise-en-charge.webp\" data-legende=\"Prise en charge des infections liées aux cathéters\">\u003cimg src=\"figures/ilc-prise-en-charge.webp\" alt=\"Prise en charge des infections liées aux cathéters\" width=\"2287\" height=\"1471\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Prise en charge des infections liées aux cathéters\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>\u003cstrong>Si choc\u003c/strong> → antibiothérapie probabiliste couvrant :\u003cul>\n\u003cli>BGN (dont non fermentants) : pipéracilline – tazobactam\u003c/li>\n\u003cli>CGP (dont méti-R) : vancomycine ou daptomycine\u003c/li>\n\u003cli>si défaillance multiviscérale ou mauvaise évolution sous antibiothérapie → associer un antifongique type caspofungine\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Persistance d’hémocultures positives à 72 h d’antibiothérapie\u003c/strong> → TDM-TAP, ETT ± ETO, écho-doppler vasculaire\u003c/li>\n\u003cli>\u003cstrong>ETO\u003c/strong> si \u003cem>S. aureus\u003c/em>, \u003cem>Candida\u003c/em>, entérocoque ou facteur de risque d’endocardite infectieuse\u003c/li>\n\u003cli>\u003cstrong>Fond d’œil\u003c/strong> si \u003cem>Candida\u003c/em>\u003c/li>\n\u003cli>\u003cstrong>Thrombophlébite suppurée\u003c/strong> (TVP + bactériémie persistante à 72 h d’antibiothérapie adaptée) : retrait du KT, antibiothérapie 4 – 6 semaines, anticoagulation 6 semaines\u003c/li>\n\u003c/ul>\n","x":"Agrandir Si choc → antibiothérapie probabiliste couvrant : BGN (dont non fermentants) : pipéracilline – tazobactam CGP (dont méti-R) : vancomycine ou daptomycine si défaillance multiviscérale ou mauvaise évolution sous antibiothérapie → associer un antifongique type caspofungine Persistance d’hémocultures positives à 72 h d’antibiothérapie → TDM-TAP, ETT ± ETO, écho-doppler vasculaire ETO si S. aureus , Candida , entérocoque ou facteur de risque d’endocardite infectieuse Fond d’œil si Candida Thrombophlébite suppurée (TVP + bactériémie persistante à 72 h d’antibiothérapie adaptée) : retrait du KT, antibiothérapie 4 – 6 semaines, anticoagulation 6 semaines"},{"t":"Traitement anti-infectieux","i":"pill","h":"\u003cp>Antibiothérapie probabiliste \u003cstrong>si choc septique\u003c/strong>, secondairement adaptée à l’antibiogramme :\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Pipéracilline-tazobactam\u003c/strong> 4 g IVL 1 h puis 16 g/24 h, soit 8 g/48 ml à 4 ml/h\u003cul>\n\u003cli>ou \u003cstrong>céfépime\u003c/strong> 2 g IVL 1 h puis 6 g/24 h, soit 2 g/48 ml à 6 ml/h\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>+ Vancomycine\u003c/strong> 30 mg/kg IVL 2 h puis 30 mg/kg/j\u003cul>\n\u003cli>ou \u003cstrong>daptomycine\u003c/strong> 6 mg/kg/j si exposition à la vancomycine (&gt; 1 semaine dans les 3 derniers mois) ou insuffisance rénale\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>+ Amikacine\u003c/strong> 30 mg/kg IVL 30 min\u003c/li>\n\u003c/ul>\n\u003cp>Si défaillance multiviscérale, mauvaise évolution à 72 h d’antibiothérapie à large spectre ou colonisation connue : ajout de \u003cstrong>caspofungine\u003c/strong> 70 mg puis 50 mg/j (ou 70 mg/j si &gt; 80 kg).\u003c/p>\n","x":"Antibiothérapie probabiliste si choc septique , secondairement adaptée à l’antibiogramme : Pipéracilline-tazobactam 4 g IVL 1 h puis 16 g/24 h, soit 8 g/48 ml à 4 ml/h ou céfépime 2 g IVL 1 h puis 6 g/24 h, soit 2 g/48 ml à 6 ml/h + Vancomycine 30 mg/kg IVL 2 h puis 30 mg/kg/j ou daptomycine 6 mg/kg/j si exposition à la vancomycine (> 1 semaine dans les 3 derniers mois) ou insuffisance rénale + Amikacine 30 mg/kg IVL 30 min Si défaillance multiviscérale, mauvaise évolution à 72 h d’antibiothérapie à large spectre ou colonisation connue : ajout de caspofungine 70 mg puis 50 mg/j (ou 70 mg/j si > 80 kg)."},{"t":"Durée d’antibiothérapie","i":"clock","h":"\u003cp>Cathéter retiré dans un contexte fébrile et microbiologie positive :\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Situation\u003c/th>\u003cth>Antibiothérapie et durée\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\
