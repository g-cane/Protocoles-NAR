td>\n\u003ctd>HSA minime et hémorragie dans les VL\u003c/td>\n\u003ctd align=\"center\">14 %\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">3\u003c/td>\n\u003ctd>HSA remplissant au moins une citerne ou une scissure, pas d’hémorragie dans les VL\u003c/td>\n\u003ctd align=\"center\">12 %\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">4\u003c/td>\n\u003ctd>HSA remplissant au moins une citerne ou une scissure et hémorragie dans les VL\u003c/td>\n\u003ctd align=\"center\">28 %\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> \u003cstrong>HSA grave si WFNS ≥ 3 et/ou Fisher ≥ 3\u003c/strong>\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Clinique : score WFNS (World Federation of Neurologic Surgeons) Score WFNS Glasgow Déficit moteur GOS 1 à 3 à 6 mois (décès, végétatif ou handicap sévère) Décès 1 15 absent 13 % \u003c 5 % 2 13 – 14 absent 20 % \u003c 10 % 3 13 – 14 présent 42 % \u003c 10 % 4 7 – 12 – 51 % > 35 % 5 3 – 6 – 68 % > 50 % Radiologique : échelle de Fisher modifiée Grade Aspect scannographique Infarctus cérébral 0 Pas d’HSA ni d’hémorragie dans les ventricules latéraux (VL) 0 % 1 HSA minime, pas d’hémorragie dans les VL 6 % 2 HSA minime et hémorragie dans les VL 14 % 3 HSA remplissant au moins une citerne ou une scissure, pas d’hémorragie dans les VL 12 % 4 HSA remplissant au moins une citerne ou une scissure et hémorragie dans les VL 28 % Important HSA grave si WFNS ≥ 3 et/ou Fisher ≥ 3"},{"t":"Complications","i":"triangle-alert","h":"\u003ch3>Aiguës\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Neurologiques\u003c/strong> : HTIC, hydrocéphalie aiguë, re-saignement, comitialité\u003c/li>\n\u003cli>\u003cstrong>Extra-neurologiques\u003c/strong> : cardiomyopathie adrénergique, troubles ioniques\u003c/li>\n\u003c/ul>\n\u003ch3>À distance\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Neurologiques\u003c/strong> : vasospasme, ondes lentes de dépolarisation, ischémie cérébrale retardée, comitialité, hydrocéphalie chronique\u003c/li>\n\u003cli>\u003cstrong>Extra-neurologiques\u003c/strong> : dysnatrémies, complications de réanimation\u003c/li>\n\u003c/ul>\n\u003cp>Prise en charge des complications : voir \u003ca class=\"xref\" href=\"#rea-htic\">HTIC\u003c/a>, \u003ca class=\"xref\" href=\"#rea-vasospasme\">Vasospasme\u003c/a>, \u003ca class=\"xref\" href=\"#rea-dysnatremies\">Dysnatrémies\u003c/a>, \u003ca class=\"xref\" href=\"#rea-dve\">DVE\u003c/a>.\u003c/p>\n","x":"Aiguës Neurologiques : HTIC, hydrocéphalie aiguë, re-saignement, comitialité Extra-neurologiques : cardiomyopathie adrénergique, troubles ioniques À distance Neurologiques : vasospasme, ondes lentes de dépolarisation, ischémie cérébrale retardée, comitialité, hydrocéphalie chronique Extra-neurologiques : dysnatrémies, complications de réanimation Prise en charge des complications : voir HTIC , Vasospasme , Dysnatrémies , DVE ."},{"t":"Prise en charge","i":"pill","h":"\u003ch3>Conditionnement\u003c/h3>\n\u003cul>\n\u003cli>Équipement : VVC (sauf W1F1), cathéter artériel ± monitorage continu du Qc (PiCCO® ; EV1000®) si HSA grave, HTIC, vasospasme\u003c/li>\n\u003cli>Décubitus dorsal strict (10 jours minimum), tête de lit à +30°\u003c/li>\n\u003c/ul>\n\u003ch3>Traitements spécifiques\u003c/h3>\n\u003cul>\n\u003cli>Dérivation ventriculaire externe (\u003ca class=\"xref\" href=\"#rea-dve\">DVE\u003c/a>) si hydrocéphalie\u003c/li>\n\u003cli>Sécurisation de l’anévrisme \u003cstrong>&lt; 48 h\u003c/strong> (radio-embolisation ou clip chirurgical)\u003c/li>\n\u003cli>Prévention du vasospasme par \u003cstrong>nimodipine 60 mg × 6/j pendant 21 jours\u003c/strong> ; arrêt si mauvaise tolérance hémodynamique ou vasospasme\u003c/li>\n\u003c/ul>\n\u003ch3>Mesures associées\u003c/h3>\n\u003cul>\n\u003cli>Prévention des \u003ca class=\"xref\" href=\"#rea-acsos\">ACSOS\u003c/a>\u003c/li>\n\u003cli>Prise en charge antalgique : voir la section « Traitement antalgique » ; \u003cstrong>pas de néfopam\u003c/strong> (risque de comitialité)\u003c/li>\n\u003cli>Hémodynamique : adaptation au débit sanguin cérébral\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> Avant sécurisation de l’anévrisme : \u003cstrong>PAM &lt; 110 mmHg et PAS &lt; 160 mmHg\u003c/strong>\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003cul>\n\u003cli>Prévention MTEV : bas TED ; compression intermittente si indiquée ; différer l’anticoagulation (J7 – J10)\u003c/li>\n\u003cli>Alimentation : orale si possible, sinon entérale via SNG\u003c/li>\n\u003c/ul>\n","x":"Conditionnement Équipement : VVC (sauf W1F1), cathéter artériel ± monitorage continu du Qc (PiCCO® ; EV1000®) si HSA grave, HTIC, vasospasme Décubitus dorsal strict (10 jours minimum), tête de lit à +30° Traitements spécifiques Dérivation ventriculaire externe ( DVE ) si hydrocéphalie Sécurisation de l’anévrisme \u003c 48 h (radio-embolisation ou clip chirurgical) Prévention du vasospasme par nimodipine 60 mg × 6/j pendant 21 jours ; arrêt si mauvaise tolérance hémodynamique ou vasospasme Mesures associées Prévention des ACSOS Prise en charge antalgique : voir la section « Traitement antalgique » ; pas de néfopam (risque de comitialité) Hémodynamique : adaptation au débit sanguin cérébral Attention Avant sécurisation de l’anévrisme : PAM \u003c 110 mmHg et PAS \u003c 160 mmHg Prévention MTEV : bas TED ; compression intermittente si indiquée ; différer l’anticoagulation (J7 – J10) Alimentation : orale si possible, sinon entérale via SNG"},{"t":"Surveillance","i":"activity","h":"\u003cul>\n\u003cli>\u003cstrong>Clinique\u003c/strong> → primordiale !\u003c/li>\n\u003cli>\u003cstrong>Paraclinique\u003c/strong> : \u003ca class=\"xref\" href=\"#rea-dtc\">Doppler transcrânien\u003c/a> (DTC) quotidien voire pluriquotidien, échocardiographie transthoracique (\u003ca class=\"xref\" href=\"#rea-ett\">ETT\u003c/a>), ECG à l’entrée, biologie (ionogrammes sanguin et urinaire quotidiens), PIV/PIC, \u003ca class=\"xref\" href=\"#rea-ptio2\">PtiO2\u003c/a>, hémodynamique…\u003c/li>\n\u003c/ul>\n","x":"Clinique → primordiale ! Paraclinique : Doppler transcrânien (DTC) quotidien voire pluriquotidien, échocardiographie transthoracique ( ETT ), ECG à l’entrée, biologie (ionogrammes sanguin et urinaire quotidiens), PIV/PIC, PtiO2 , hémodynamique…"},{"t":"Traitement antalgique de l’HSA","i":"pill","h":"\u003cdiv class=\"timeline\">\n\u003cdiv class=\"step\">\u003cdiv class=\"when\">J1\u003csmall>PCA\u003c/small>\u003c/div>\u003cdiv class=\"what\">\n\n\u003cul>\n\u003cli>\u003cstrong>Paracétamol\u003c/strong> 15 mg/kg toutes les 6 heures en systématique\u003c/li>\n\u003cli>\u003cstrong>PCA oxycodone\u003c/strong> 1 mg/ml + dropéridol 1,25 mg — bolus 1 mg, période réfractaire 7 min, dose max 30 mg/4 h\u003c/li>\n\u003cli>\u003cstrong>Lactulose\u003c/strong> 10 g × 2\u003c/li>\n\u003cli>Anti-émétique : \u003cstrong>ondansétron\u003c/strong> 4 mg × 4 si besoin\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step\">\u003cdiv class=\"when\">J2\u003csmall>Relais per os\u003c/small>\u003c/div>\u003cdiv class=\"what\">\n\n\u003cul>\n\u003cli>\u003cstrong>Paracétamol\u003c/strong> systématique\u003c/li>\n\u003cli>Relais \u003cstrong>oxycodone per os\u003c/strong> : dose d’oxycodone IV / 24 h × 3, à répartir en 2 doses de forme oxycodone LP\u003c/li>\n\u003cli>Rattrapage : oxycodone 5 mg (poids &lt; 60 kg) ou oxycodone 10 mg (poids &gt; 60 kg)\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step\">\u003cdiv class=\"when\">J3\u003c/div>\u003cdiv class=\"what\">\n\n\u003cp>Si contrôle de la douleur non satisfaisant :\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Kétoprofène\u003c/strong> 100 mg LP × 2 (après avis neurochirurgical) \u003cstrong>et\u003c/strong> si anévrisme sécurisé et absence de risque d’hydrocéphalie aiguë\u003c/li>\n\u003cli>Discuter une \u003cstrong>ponction lombaire évacuatrice\u003c/strong> après avis neurochirurgical\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step\">\u003cdiv class=\"when\">→ J10\u003csmall>Adjuvants\u003c/small>\u003c/div>\u003cdiv class=\"what\">\n\n\u003cp>Thérapie adjuvante de faible niveau de preuve :\u003c/p>\n\u003cul>\n\u003cli>Clonazépam 0,5 mg per os si douleurs de nuque\u003c/li>\n\u003cli>Sulfate de magnésium : contrôle de la magnésémie, correction par dose de charge IVSE\u003c/li>\n\u003cli>Prégabaline 75 mg × 2 PO\u003c/li>\n\u003cli>Clonidine IVSE : 600 à 1200 µg/24 h\u003c/li>\n\u003cli>Lidocaïne IVSE 1 à 1,5 mg/kg/24 h\u003c/li>\n\u003cli>Bloc sphénopalatin à la Xylocaïne 2 % 5 à 10 mL\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n","x":"J1 PCA Paracétamol 15 mg/kg toutes les 6 heures en systématique PCA oxycodone 1 mg/ml + dropéridol 1,25 mg — bolus 1 mg, période réfractaire 7 min, dose max 30 mg/4 h Lactulose 10 g × 2 Anti-émétique : ondansétron 4 mg × 4 si besoin J2 Relais per os Paracétamol systématique Relais oxycodone per os : dose d’oxycodone IV / 24 h × 3, à répartir en 2 doses de forme oxycodone LP Rattrapage : oxycodone 5 mg (poids \u003c 60 kg) ou oxycodone 10 mg (poids > 60 kg) J3 Si contrôle de la douleur non satisfaisant : Kétoprofène 100 mg LP × 2 (après avis neurochirurgical) et si anévrisme sécurisé et absence de risque d’hydrocéphalie aiguë Discuter une ponction lombaire évacuatrice après avis neurochirurgical → J10 Adjuvants Thérapie adjuvante de faible niveau de preuve : Clonazépam 0,5 mg per os si douleurs de nuque Sulfate de magnésium : contrôle de la magnésémie, correction par dose de charge IVSE Prégabaline 75 mg × 2 PO Clonidine IVSE : 600 à 1200 µg/24 h Lidocaïne IVSE 1 à 1,5 mg/kg/24 h Bloc sphénopalatin à la Xylocaïne 2 % 5 à 10 mL"},{"t":"Algorithme si première TDM négative","i":"workflow","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/hsa-tdm-negative.webp\" data-legende=\"Figure 2 : Algorithme diagnostique de l’HSA si première TDM (angioscanner) négative\">\u003cimg src=\"figures/hsa-tdm-negative.webp\" alt=\"Figure 2 : Algorithme diagnostique de l’HSA si première TDM (angioscanner) négative\" width=\"694\" height=\"1565\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Figure 2 : Algorithme diagnostique de l’HSA si première TDM (angioscanner) négative\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>* Idéalement à J10 ; peut être avancée au maximum à J7 pour raisons organisationnelles, auquel cas un scanner cérébral non injecté sera réalisé au préalable pour vérifier la disparition de l’HSA\u003c/li>\n\u003cli>** 5 jours après l’angiographie\u003c/li>\n\u003cli>Code couleur : rouge → réanimation ; bleu → secteur ; vert → consultation externe\u003c/li>\n\u003c/ul>\n","x":"Agrandir * Idéalement à J10 ; peut être avancée au maximum à J7 pour raisons organisationnelles, auquel cas un scanner cérébral non injecté sera réalisé au préalable pour vérifier la disparition de l’HSA ** 5 jours après l’angiographie Code couleur : rouge → réanimation ; bleu → secteur ; vert → consultation externe"},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1161/STR.0000000000000436\" target=\"_blank\" rel=\"noopener noreferrer\">2023 AHA/ASA Guideline for the Management of Patients With Aneurysmal Subarachnoid Hemorrhage (Stroke 2023)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. 2023 AHA/ASA Guideline for the Management of Patients With Aneurysmal Subarachnoid Hemorrhage (Stroke 2023)"}]},{"id":"rea-htic","s":"rea","t":"Hypertension intracrânienne","c":"HTIC","g":"Neuro-réanimation","i":"gauge","p":[12,13],"r":"Définition (PIC > 20 mmHg), escalade en 4 étapes, osmothérapie, contrôle ciblé de la température.","m":"HTIC, PIC, PIV, PPC, osmothérapie, SSH, mannitol, craniectomie, barbiturique, hypothermie, CCT","k":[{"t":"Définition","i":"info","h":"\u003cp>L’hypertension intracrânienne (HTIC) se définit par une mesure de pression intracrânienne (PIC) ou intraventriculaire (PIV) \u003cstrong>&gt; 20 mmHg\u003c/strong>.\u003c/p>\n","x":"L’hypertension intracrânienne (HTIC) se définit par une mesure de pression intracrânienne (PIC) ou intraventriculaire (PIV) > 20 mmHg ."},{"t":"Diagnostic","i":"stethoscope","h":"\u003ch3>Suspicion clinique\u003c/h3>\n\u003cp>Céphalées, vomissements, troubles de conscience, mouvement pupillaire.\u003c/p>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> Clinique pauvre chez le patient sédaté !\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003ch3>Suspicion paraclinique\u003c/h3>\n\u003cul>\n\u003cli>\u003ca class=\"xref\" href=\"#rea-dtc\">DTC\u003c/a> : \u003cstrong>Vd &lt; 20 cm/s et IP &gt; 1,4\u003c/strong>\u003c/li>\n\u003cli>TDM ou IRM : attention → l’absence d’arguments pour une HTIC à l’imagerie \u003cstrong>n’exclut pas\u003c/strong> le diagnostic\u003c/li>\n\u003c/ul>\n\u003ch3>Confirmation\u003c/h3>\n\u003cp>Mesure directe de la PIC ou de la PIV.\u003c/p>\n","x":"Suspicion clinique Céphalées, vomissements, troubles de conscience, mouvement pupillaire. Attention Clinique pauvre chez le patient sédaté ! Suspicion paraclinique DTC : Vd \u003c 20 cm/s et IP > 1,4 TDM ou IRM : attention → l’absence d’arguments pour une HTIC à l’imagerie n’exclut pas le diagnostic Confirmation Mesure directe de la PIC ou de la PIV."},{"t":"Traitement","i":"pill","h":"\u003col>\n\u003cli>\u003cstrong>Étape 1\u003c/strong> : sédation, position à +30° et tête dans l’axe, contrôle strict des \u003ca class=\"xref\" href=\"#rea-acsos\">ACSOS\u003c/a>, recherche de la PPC optimale (sur arguments Doppler ± \u003ca class=\"xref\" href=\"#rea-ptio2\">PtiO2\u003c/a>)\u003c/li>\n\u003cli>\u003cstrong>Étape 2\u003c/strong> : approfondissement de la sédation, curarisation possible, contrôle de l’imagerie\u003c/li>\n\u003cli>\u003cstrong>Étape 3\u003c/strong> : dérivation du LCR (pour soustraction : Langfitt) — voir \u003ca class=\"xref\" href=\"#rea-dve\">DVE\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>Étape 4\u003c/strong> : 3 stratégies équivalentes → contrôle ciblé de la température (CCT), craniectomie décompressive, coma barbiturique\u003c/li>\n\u003c/ol>\n\u003ch3>Points importants\u003c/h3>\n\u003cul>\n\u003cli>Se poser la question de la \u003cstrong>chirurgie à chaque étape\u003c/strong>\u003c/li>\n\u003cli>Monitorage multimodal : monitorage continu du Qc, de la PtiO2 à envisager\u003c/li>\n\u003cli>Osmothérapie possible à chaque étape de la prise en charge si HTIC menaçante (reverse flow ; mouvement pupillaire)\u003c/li>\n\u003cli>Étape 4 → \u003cstrong>CCT en première intention\u003c/strong> (pratique du service)\u003c/li>\n\u003c/ul>\n","x":"Étape 1 : sédation, position à +30° et tête dans l’axe, contrôle strict des ACSOS , recherche de la PPC optimale (sur arguments Doppler ± PtiO2 ) Étape 2 : approfondissement de la sédation, curarisation possible, contrôle de l’imagerie Étape 3 : dérivation du LCR (pour soustraction : Langfitt) — voir DVE Étape 4 : 3 stratégies équivalentes → contrôle ciblé de la température (CCT), craniectomie décompressive, coma barbiturique Points importants Se poser la question de la chirurgie à chaque étape Monitorage multimodal : monitorage continu du Qc, de la PtiO2 à envisager Osmothérapie possible à chaque étape de la prise en charge si HTIC menaçante (reverse flow ; mouvement pupillaire) Étape 4 → CCT en première intention (pratique du service)"},{"t":"Osmothérapie","i":"syringe","h":"\u003cul>\n\u003cli>\u003cstrong>Sérum salé hypertonique (SSH) 7,5 %\u003c/strong> jusqu’à 8 – 10 g — surveillance natrémie et chlorémie\u003c/li>\n\u003cli>\u003cstrong>Mannitol 20 %\u003c/strong> 200 à 250 ml — attention à l’hyperdiurèse secondaire\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-tip\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-lightbulb\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Astuce\u003c/span> \u003cstrong>Reconstitution rapide de 40 ml de SSH 7,5 %\u003c/strong> = 3 ampoules de 10 ml de NaCl 10 % + 1 ampoule de 10 ml d’eau PPI\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Sérum salé hypertonique (SSH) 7,5 % jusqu’à 8 – 10 g — surveillance natrémie et chlorémie Mannitol 20 % 200 à 250 ml — attention à l’hyperdiurèse secondaire Astuce Reconstitution rapide de 40 ml de SSH 7,5 % = 3 ampoules de 10 ml de NaCl 10 % + 1 ampoule de 10 ml d’eau PPI"},{"t":"Contrôle ciblé de la température","i":"thermometer","h":"\u003cp>Température cible : \u003cstrong>34 – 35 °C\u003c/strong>\u003c/p>\n","x":"Température cible : 34 – 35 °C"},{"t":"Algorithme","i":"workflow","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/htic-algo.webp\" data-legende=\"Figure 1 : Prise en charge de l’HTIC\">\u003cimg src=\"figures/htic-algo.webp\" alt=\"Figure 1 : Prise en charge de l’HTIC\" width=\"1982\" height=\"1335\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Figure 1 : Prise en charge de l’HTIC\u003c/figcaption>\u003c/figure>\n","x":"Agrandir"},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1016/j.accpm.2017.12.001\" target=\"_blank\" rel=\"noopener noreferrer\">RFE SFAR : prise en charge des traumatisés crâniens graves à la phase précoce (Anaesth Crit Care Pain Med 2018)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1227/NEU.0000000000001432\" target=\"_blank\" rel=\"noopener noreferrer\">Brain Trauma Foundation : Guidelines for the Management of Severe TBI, 4ᵉ édition (Neurosurgery 2017)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1007/s00134-019-05805-9\" target=\"_blank\" rel=\"noopener noreferrer\">Algorithme SIBICC de prise en charge de la PIC (Intensive Care Med 2019)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. RFE SFAR : prise en charge des traumatisés crâniens graves à la phase précoce (Anaesth Crit Care Pain Med 2018) Brain Trauma Foundation : Guidelines for the Management of Severe TBI, 4ᵉ édition (Neurosurgery 2017) Algorithme SIBICC de prise en charge de la PIC (Intensive Care Med 2019)"}]},{"id":"rea-acsos","s":"rea","t":"Agressions cérébrales secondaires d’origine systémique","c":"ACSOS","g":"Neuro-réanimation","i":"shield-check","p":[14],"r":"Les 7 cibles systémiques à contrôler chez le cérébrolésé.","m":"ACSOS, capnie, glycémie, oxygène, natrémie, température, pression artérielle, hémoglobine","k":[{"t":"Objectifs","i":"target","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ACSOS\u003c/th>\n\u003cth>Objectif\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Capnie\u003c/td>\n\u003ctd>Normale (4,5 – 5 kPa)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Glycémie\u003c/td>\n\u003ctd>1,4 – 1,8 g/l\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Oxygène\u003c/td>\n\u003ctd>SpO2 &gt; 98 % et PaO2 &gt; 13,6 kPa\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Natrémie\u003c/td>\n\u003ctd>Normale (140 mmol/l)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Température\u003c/td>\n\u003ctd>&lt; 37 °C\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pression artérielle\u003c/td>\n\u003ctd>Adaptée au patient\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hémoglobine\u003c/td>\n\u003ctd>&gt; 7 g/dl voire plus élevée\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Le livret indique la cible de glycémie en « g/dl » ; il s’agit de grammes par litre (1,4 – 1,8 g/l, soit environ 7,8 – 10 mmol/l).\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003cp>Voir aussi : \u003ca class=\"xref\" href=\"#rea-htic\">HTIC\u003c/a>, \u003ca class=\"xref\" href=\"#rea-dysnatremies\">Dysnatrémies\u003c/a>, \u003ca class=\"xref\" href=\"#rea-anemie\">Anémie en réanimation\u003c/a>.\u003c/p>\n","x":"ACSOS Objectif Capnie Normale (4,5 – 5 kPa) Glycémie 1,4 – 1,8 g/l Oxygène SpO2 > 98 % et PaO2 > 13,6 kPa Natrémie Normale (140 mmol/l) Température \u003c 37 °C Pression artérielle Adaptée au patient Hémoglobine > 7 g/dl voire plus élevée Note Le livret indique la cible de glycémie en « g/dl » ; il s’agit de grammes par litre (1,4 – 1,8 g/l, soit environ 7,8 – 10 mmol/l). Voir aussi : HTIC , Dysnatrémies , Anémie en réanimation ."}]},{"id":"rea-dtc","s":"rea","t":"Doppler transcrânien","c":"DTC","g":"Neuro-réanimation","i":"audio-waveform","p":[15],"r":"Réalisation pratique, étude de l’ACM, valeurs normales et interprétation, index de Lindegaard.","m":"DTC, doppler, ACM, vitesses, index de pulsatilité, IP, Lindegaard, vasospasme, olighémie, hyperhémie","k":[{"t":"Principe et indications","i":"info","h":"\u003cul>\n\u003cli>Mesure la vitesse des hématies par doppler. Bonne corrélation entre variations normalisées des Vmoy cérébrales et variations normalisées de débit carotidien lors de variations de PA.\u003c/li>\n\u003cli>V\u003csub>mesurée\u003c/sub> = cos θ × V\u003csub>réelle\u003c/sub> → on ne peut que \u003cstrong>sous-estimer\u003c/strong> les vitesses réelles (θ : angle d’insonation entre le faisceau ultrasonore et l’axe du vaisseau)\u003c/li>\n\u003cli>\u003cstrong>Indications\u003c/strong> : recherche de vasospasme et monitorage du cérébrolésé dans le but d’optimiser le débit sanguin cérébral\u003c/li>\n\u003c/ul>\n","x":"Mesure la vitesse des hématies par doppler. Bonne corrélation entre variations normalisées des Vmoy cérébrales et variations normalisées de débit carotidien lors de variations de PA. V mesurée = cos θ × V réelle → on ne peut que sous-estimer les vitesses réelles (θ : angle d’insonation entre le faisceau ultrasonore et l’axe du vaisseau) Indications : recherche de vasospasme et monitorage du cérébrolésé dans le but d’optimiser le débit sanguin cérébral"},{"t":"Réalisation pratique","i":"clipboard-list","h":"\u003cul>\n\u003cli>Sonde 2 – 4 MHz (cardiologique)\u003c/li>\n\u003cli>Appareil en mode DTC\u003c/li>\n\u003cli>Réglage profondeur environ 10 cm – gamme de vitesse 0 à 150 cm/s\u003c/li>\n\u003cli>Fenêtres : \u003cstrong>temporale +++\u003c/strong>, occipitale, sous-mandibulaire, trans-orbitaire\u003c/li>\n\u003cli>Échoscopie puis doppler couleur puis doppler pulsé\u003c/li>\n\u003c/ul>\n","x":"Sonde 2 – 4 MHz (cardiologique) Appareil en mode DTC Réglage profondeur environ 10 cm – gamme de vitesse 0 à 150 cm/s Fenêtres : temporale +++ , occipitale, sous-mandibulaire, trans-orbitaire Échoscopie puis doppler couleur puis doppler pulsé"},{"t":"Étude de l’artère cérébrale moyenne (ACM)","i":"file-text","h":"\u003cul>\n\u003cli>\u003cstrong>Échoscopie\u003c/strong> : repères anatomiques → petite aile du sphénoïde, pédoncules cérébraux, ± voûte controlatérale et ligne médiane\u003c/li>\n\u003cli>\u003cstrong>Doppler couleur\u003c/strong> : flux dirigé vers la sonde (rouge), situé entre 4 et 6 cm de profondeur, « dérouler » l’artère sur au moins 1 cm\u003c/li>\n\u003cli>\u003cstrong>Doppler pulsé (PW)\u003c/strong> : mesure des vitesses sur la portion M1 – M2, en s’alignant autant que possible (angle d’insonation le plus faible possible)\u003c/li>\n\u003cli>\u003cstrong>Mesures\u003c/strong> : faire manuellement le contour de la courbe de vitesse (calcul automatique des vitesses systolique, diastolique, moyenne ainsi que de l’IP et de l’IR)\u003c/li>\n\u003cli>Penser à préciser artère étudiée, côté, PAM, PIC et PaCO2 au moment de la mesure ± PtiO2\u003c/li>\n\u003cli>Coupler à une mesure des vitesses sur l’artère carotide interne (ACI) en fenêtre sous-mandibulaire si arguments pour un vasospasme (Vmoy[ACM] &gt; 120 cm/s) pour calculer l’index de Lindegaard\u003c/li>\n\u003c/ul>\n","x":"Échoscopie : repères anatomiques → petite aile du sphénoïde, pédoncules cérébraux, ± voûte controlatérale et ligne médiane Doppler couleur : flux dirigé vers la sonde (rouge), situé entre 4 et 6 cm de profondeur, « dérouler » l’artère sur au moins 1 cm Doppler pulsé (PW) : mesure des vitesses sur la portion M1 – M2, en s’alignant autant que possible (angle d’insonation le plus faible possible) Mesures : faire manuellement le contour de la courbe de vitesse (calcul automatique des vitesses systolique, diastolique, moyenne ainsi que de l’IP et de l’IR) Penser à préciser artère étudiée, côté, PAM, PIC et PaCO2 au moment de la mesure ± PtiO2 Coupler à une mesure des vitesses sur l’artère carotide interne (ACI) en fenêtre sous-mandibulaire si arguments pour un vasospasme (Vmoy[ACM] > 120 cm/s) pour calculer l’index de Lindegaard"},{"t":"Interprétation des résultats (ACM)","i":"stethoscope","h":"\u003cp>Vitesses en cm/s.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Normal\u003c/th>\n\u003cth>Olighémie cérébrale\u003c/th>\n\u003cth>Olighémie systémique\u003c/th>\n\u003cth>Hyperhémie\u003c/th>\n\u003cth>Vasospasme\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Vsyst = 100 ± 20\u003c/td>\n\u003ctd>Vdia &lt; 20\u003c/td>\n\u003ctd>Vdia &lt; 20\u003c/td>\n\u003ctd>Vmoy élevée\u003c/td>\n\u003ctd>Vmoy &gt; 120 (ou + 50 cm/s en 24 h)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Vmoy = 62 ± 12\u003c/td>\n\u003ctd>Vsyst normale\u003c/td>\n\u003ctd>Vmoy &lt; 30\u003c/td>\n\u003ctd>Vdia élevée\u003c/td>\n\u003ctd>Lindegaard &gt; 3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Vdia = 40 ± 10\u003c/td>\n\u003ctd>Vmoy basse\u003c/td>\n\u003ctd>IP normal\u003c/td>\n\u003ctd>IP normal\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>IP = 1 ± 0,2\u003c/td>\n\u003ctd>IP &gt; 1,4\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n","x":"Vitesses en cm/s. Normal Olighémie cérébrale Olighémie systémique Hyperhémie Vasospasme Vsyst = 100 ± 20 Vdia \u003c 20 Vdia \u003c 20 Vmoy élevée Vmoy > 120 (ou + 50 cm/s en 24 h) Vmoy = 62 ± 12 Vsyst normale Vmoy \u003c 30 Vdia élevée Lindegaard > 3 Vdia = 40 ± 10 Vmoy basse IP normal IP normal IP = 1 ± 0,2 IP > 1,4"},{"t":"Index de Lindegaard","i":"file-text","h":"\u003cp class=\"formula\">Index de Lindegaard = \u003cspan class=\"frac\">\u003cspan>Vmoy (ACM)\u003c/span>\u003cspan>Vmoy (ACI)\u003c/span>\u003c/span>\u003c/p>\n\n\u003cp>Rapport sans unité entre la vitesse moyenne dans l’artère cérébrale moyenne et la vitesse moyenne dans l’artère carotide interne homolatérale (toutes deux en cm/s). \u003cstrong>&gt; 3\u003c/strong> : en faveur d’un \u003ca class=\"xref\" href=\"#rea-vasospasme\">vasospasme\u003c/a>.\u003c/p>\n","x":"Index de Lindegaard = Vmoy (ACM) Vmoy (ACI) Rapport sans unité entre la vitesse moyenne dans l’artère cérébrale moyenne et la vitesse moyenne dans l’artère carotide interne homolatérale (toutes deux en cm/s). > 3 : en faveur d’un vasospasme ."}]},{"id":"rea-vasospasme","s":"rea","t":"Vasospasme","c":"Vasospasme","g":"Neuro-réanimation","i":"shrink","p":[16,17,18,19],"r":"Diagnostic, paliers 1 à 4, protocole milrinone IVSE, protocole lévosimendan.","m":"vasospasme, ischémie retardée, milrinone, Corotrope, lévosimendan, Zimino, angioplastie, artériographie, Lindegaard, HSA","k":[{"t":"Introduction","i":"info","h":"\u003cp>Le vasospasme est une complication fréquente et grave de l’\u003ca class=\"xref\" href=\"#rea-hsa\">HSA\u003c/a>. Le principal enjeu est d’éviter la constitution de plages d’ischémie cérébrale (ischémie retardée).\u003c/p>\n","x":"Le vasospasme est une complication fréquente et grave de l’ HSA . Le principal enjeu est d’éviter la constitution de plages d’ischémie cérébrale (ischémie retardée)."},{"t":"Diagnostic","i":"stethoscope","h":"\u003cul>\n\u003cli>\u003cstrong>Signes cliniques\u003c/strong> : tout symptôme neurologique chez un patient atteint d’une HSA → trouble de la vigilance, confusion, déficit sensitivomoteur, majoration des céphalées\u003c/li>\n\u003cli>\u003cstrong>Signes biologiques\u003c/strong> : dysnatrémie, élévation de la natriurèse, pléiocytose neuro-méningée, syndrome inflammatoire\u003c/li>\n\u003cli>\u003cstrong>Signes \u003ca class=\"xref\" href=\"#rea-dtc\">Doppler\u003c/a>\u003c/strong> : Vsyst &gt; 200 cm/s ; Vmoy &gt; 120 cm/s ou ↗ &gt; 50 cm/s sur 2 examens rapprochés \u003cstrong>ET\u003c/strong> index de Lindegaard &gt; 3\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> \u003cstrong>Confirmation systématique par imagerie\u003c/strong> : TDM cérébrale (Willis + séquences de perfusion)\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Signes cliniques : tout symptôme neurologique chez un patient atteint d’une HSA → trouble de la vigilance, confusion, déficit sensitivomoteur, majoration des céphalées Signes biologiques : dysnatrémie, élévation de la natriurèse, pléiocytose neuro-méningée, syndrome inflammatoire Signes Doppler : Vsyst > 200 cm/s ; Vmoy > 120 cm/s ou ↗ > 50 cm/s sur 2 examens rapprochés ET index de Lindegaard > 3 Important Confirmation systématique par imagerie : TDM cérébrale (Willis + séquences de perfusion)"},{"t":"Prise en charge par paliers","i":"pill","h":"\u003cp>Traitement médical IVSE en première intention = \u003cstrong>milrinone\u003c/strong> → inhibiteur des phosphodiestérases de type 3 (IPDE-3) avec une activité inotrope/lusitrope positive et vasodilatatrice.\u003c/p>\n\u003ch3>Palier 1 : avant imagerie cérébrale\u003c/h3>\n\u003cul>\n\u003cli>↗ PAM (objectif 100 – 120 mmHg)\u003c/li>\n\u003cli>Optimisation de la volémie\u003c/li>\n\u003cli>Optimisation de la ventilation (objectif normocapnie : 4,5 – 5 kPa)\u003c/li>\n\u003cli>Contrôle strict des \u003ca class=\"xref\" href=\"#rea-acsos\">ACSOS\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch3>Palier 2 : après confirmation du spasme par imagerie\u003c/h3>\n\u003cul>\n\u003cli>Correction d’une hypokaliémie : \u003cstrong>kaliémie ≥ 4 mmol/l\u003c/strong>\u003c/li>\n\u003cli>Remplissage vasculaire par 1000 ml de cristalloïdes en 30 minutes\u003c/li>\n\u003cli>\u003cstrong>Protocole milrinone IVSE\u003c/strong> (voir section suivante)\u003c/li>\n\u003cli>Monitorage hémodynamique \u003cstrong>obligatoire\u003c/strong> (ETT, PiCCO/EV1000)\u003c/li>\n\u003c/ul>\n\u003ch3>Palier 3 : échec de la milrinone\u003c/h3>\n\u003cul>\n\u003cli>Artériographie cérébrale en urgence → angioplastie chimique et/ou mécanique\u003c/li>\n\u003c/ul>\n\u003ch3>Palier 4 : échec de la milrinone et de 2 angioplasties\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Protocole lévosimendan IVSE\u003c/strong> après discussion multidisciplinaire\u003c/li>\n\u003c/ul>\n","x":"Traitement médical IVSE en première intention = milrinone → inhibiteur des phosphodiestérases de type 3 (IPDE-3) avec une activité inotrope/lusitrope positive et vasodilatatrice. Palier 1 : avant imagerie cérébrale ↗ PAM (objectif 100 – 120 mmHg) Optimisation de la volémie Optimisation de la ventilation (objectif normocapnie : 4,5 – 5 kPa) Contrôle strict des ACSOS Palier 2 : après confirmation du spasme par imagerie Correction d’une hypokaliémie : kaliémie ≥ 4 mmol/l Remplissage vasculaire par 1000 ml de cristalloïdes en 30 minutes Protocole milrinone IVSE (voir section suivante) Monitorage hémodynamique obligatoire (ETT, PiCCO/EV1000) Palier 3 : échec de la milrinone Artériographie cérébrale en urgence → angioplastie chimique et/ou mécanique Palier 4 : échec de la milrinone et de 2 angioplasties Protocole lévosimendan IVSE après discussion multidisciplinaire"},{"t":"Protocole milrinone IVSE","i":"syringe","h":"\u003cp>Milrinone (Corotrope®) \u003cstrong>1 mg/ml\u003c/strong>.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Départ : 0,50 µg/kg/min\u003c/strong> (poids réel : voir calculateur sur la feuille de prescription)\u003c/li>\n\u003cli>Puis ↗ par palier de \u003cstrong>0,25 µg/kg/min toutes les 20 min\u003c/strong> jusqu’à la levée du vasospasme (clinique, doppler ou PtiO2)\u003c/li>\n\u003cli>\u003cstrong>Dose maximale : 2 µg/kg/min\u003c/strong>\u003c/li>\n\u003cli>Si apparition d’une souffrance myocardique (ECG, troponine) : ↘ par palier de 0,25 µg/kg/min jusqu’à correction de l’anomalie\u003c/li>\n\u003cli>Si instabilité hémodynamique majeure : \u003cstrong>diviser la dose par 2\u003c/strong>\u003c/li>\n\u003cli>Phase de plateau : \u003cstrong>3 jours\u003c/strong> de traitement par milrinone\u003c/li>\n\u003cli>Sevrage : ↘ par palier de 0,25 µg/kg/min \u003cstrong>toutes les 12 heures\u003c/strong>\u003c/li>\n\u003cli>Arrêt définitif après le dernier palier à 0,5 µg/kg/min\u003c/li>\n\u003c/ul>\n","x":"Milrinone (Corotrope®) 1 mg/ml . Départ : 0,50 µg/kg/min (poids réel : voir calculateur sur la feuille de prescription) Puis ↗ par palier de 0,25 µg/kg/min toutes les 20 min jusqu’à la levée du vasospasme (clinique, doppler ou PtiO2) Dose maximale : 2 µg/kg/min Si apparition d’une souffrance myocardique (ECG, troponine) : ↘ par palier de 0,25 µg/kg/min jusqu’à correction de l’anomalie Si instabilité hémodynamique majeure : diviser la dose par 2 Phase de plateau : 3 jours de traitement par milrinone Sevrage : ↘ par palier de 0,25 µg/kg/min toutes les 12 heures Arrêt définitif après le dernier palier à 0,5 µg/kg/min"},{"t":"Points essentiels","i":"target","h":"\u003cul>\n\u003cli>Surveillance (pluri)quotidienne par DTC (recherche d’une récidive du spasme)\u003c/li>\n\u003cli>Monitorage continu du débit cardiaque (thermodilution, ETT itératives…)\u003c/li>\n\u003cli>Troponine et ECG \u003cstrong>quotidiens\u003c/strong> (tolérance du traitement)\u003c/li>\n\u003c/ul>\n","x":"Surveillance (pluri)quotidienne par DTC (recherche d’une récidive du spasme) Monitorage continu du débit cardiaque (thermodilution, ETT itératives…) Troponine et ECG quotidiens (tolérance du traitement)"},{"t":"Algorithme : vasospasme dans les HSA anévrismales","i":"workflow","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/vasospasme-algo.webp\" data-legende=\"Protocole de prise en charge du vasospasme dans les HSA anévrismales\">\u003cimg src=\"figures/vasospasme-algo.webp\" alt=\"Protocole de prise en charge du vasospasme dans les HSA anévrismales\" width=\"1450\" height=\"2138\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Protocole de prise en charge du vasospasme dans les HSA anévrismales\u003c/figcaption>\u003c/figure>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Dans cet algorithme du livret, l’objectif ventilatoire est noté PaCO2 5 – 5,5 kPa et le remplissage est réalisé par 1000 ml d’Isofundine® en 30 min.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Agrandir Note Dans cet algorithme du livret, l’objectif ventilatoire est noté PaCO2 5 – 5,5 kPa et le remplissage est réalisé par 1000 ml d’Isofundine® en 30 min."},{"t":"Protocole lévosimendan","i":"syringe","h":"\u003ch3>Principes généraux\u003c/h3>\n\u003cul>\n\u003cli>Optimisation de la PAM entre 90 et 120 mmHg\u003c/li>\n\u003cli>Optimisation de la volémie avec maintien d’une volémie « haute »\u003c/li>\n\u003cli>Kaliémie entre 3,9 et 4,4 mmol/l\u003c/li>\n\u003cli>Optimisation de la ventilation (normocapnie)\u003c/li>\n\u003cli>Lutte contre les ACSOS\u003c/li>\n\u003c/ul>\n\u003ch3>Reconstitution\u003c/h3>\n\u003cul>\n\u003cli>Lévosimendan (Zimino®) : ampoules de 5 ml à 2,5 mg/ml\u003c/li>\n\u003cli>2 ampoules dans \u003cstrong>500 ml de G5 %\u003c/strong> → dilution à \u003cstrong>0,05 mg/ml\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003ch3>Mode d’administration\u003c/h3>\n\u003cul>\n\u003cli>Utilisation d’une \u003cstrong>pompe volumétrique\u003c/strong>\u003c/li>\n\u003cli>Utilisation d’une \u003cstrong>voie dédiée\u003c/strong> (tritube, identifiée)\u003c/li>\n\u003c/ul>\n\u003ch3>Posologie\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>0,4 µg/kg/min\u003c/strong>\u003c/li>\n\u003cli>Calcul sur le \u003cstrong>poids réel\u003c/strong>\u003c/li>\n\u003cli>Une seule perfusion sur \u003cstrong>24 h\u003c/strong>\u003c/li>\n\u003cli>Pas de dose de charge ni de décroissance (effet rémanent)\u003c/li>\n\u003c/ul>\n\u003ch3>Gestion de la milrinone\u003c/h3>\n\u003cul>\n\u003cli>Décroissance jusqu’à \u003cstrong>0,5 µg/kg/min sur 4 heures\u003c/strong>\u003c/li>\n\u003cli>Maintien de cette dose pendant \u003cstrong>48 heures\u003c/strong>\u003c/li>\n\u003cli>Puis \u003cstrong>arrêt\u003c/strong> sans décroissance\u003c/li>\n\u003c/ul>\n\u003ch3>Surveillance\u003c/h3>\n\u003cul>\n\u003cli>Clinique : scope 5 brins (arythmie), pression artérielle\u003c/li>\n\u003cli>Paraclinique : surveillance du vasospasme (DTC, PtiO2, TDM de perfusion), surveillance du débit cardiaque (ETT, thermodilution), ECG quotidien, dosage quotidien de la troponine et de la kaliémie\u003c/li>\n\u003c/ul>\n\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/levosimendan.webp\" data-legende=\"Protocole lévosimendan (fiche originale)\">\u003cimg src=\"figures/levosimendan.webp\" alt=\"Protocole lévosimendan (fiche originale)\" width=\"1493\" height=\"2194\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Protocole lévosimendan (fiche originale)\u003c/figcaption>\u003c/figure>\n","x":"Principes généraux Optimisation de la PAM entre 90 et 120 mmHg Optimisation de la volémie avec maintien d’une volémie « haute » Kaliémie entre 3,9 et 4,4 mmol/l Optimisation de la ventilation (normocapnie) Lutte contre les ACSOS Reconstitution Lévosimendan (Zimino®) : ampoules de 5 ml à 2,5 mg/ml 2 ampoules dans 500 ml de G5 % → dilution à 0,05 mg/ml Mode d’administration Utilisation d’une pompe volumétrique Utilisation d’une voie dédiée (tritube, identifiée) Posologie 0,4 µg/kg/min Calcul sur le poids réel Une seule perfusion sur 24 h Pas de dose de charge ni de décroissance (effet rémanent) Gestion de la milrinone Décroissance jusqu’à 0,5 µg/kg/min sur 4 heures Maintien de cette dose pendant 48 heures Puis arrêt sans décroissance Surveillance Clinique : scope 5 brins (arythmie), pression artérielle Paraclinique : surveillance du vasospasme (DTC, PtiO2, TDM de perfusion), surveillance du débit cardiaque (ETT, thermodilution), ECG quotidien, dosage quotidien de la troponine et de la kaliémie Agrandir"},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1007/s12028-012-9701-5\" target=\"_blank\" rel=\"noopener noreferrer\">Lannes M. et al. Milrinone and homeostasis to treat cerebral vasospasm associated with subarachnoid hemorrhage: the Montreal Neurological Hospital protocol (Neurocrit Care 2012)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1161/STR.0000000000000436\" target=\"_blank\" rel=\"noopener noreferrer\">2023 AHA/ASA Guideline for the Management of Patients With Aneurysmal Subarachnoid Hemorrhage\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. Lannes M. et al. Milrinone and homeostasis to treat cerebral vasospasm associated with subarachnoid hemorrhage: the Montreal Neurological Hospital protocol (Neurocrit Care 2012) 2023 AHA/ASA Guideline for the Management of Patients With Aneurysmal Subarachnoid Hemorrhage"}]},{"id":"rea-dve","s":"rea","t":"Dérivation ventriculaire externe","c":"DVE","g":"Neuro-réanimation","i":"pipette","p":[46,47],"r":"Indications, niveaux de réglage, monitorage, dysfonctionnement, thrombolyse du cathéter.","m":"DVE, dérivation, hydrocéphalie, LCR, niveau, rinçage, Actilyse, altéplase, thrombolyse, PIC","k":[{"t":"Indications","i":"circle-check","h":"\u003cul>\n\u003cli>Hydrocéphalie (communicante ou obstructive)\u003c/li>\n\u003cli>Hémorragie cérébro-méningée avec hémorragie intra-ventriculaire\u003c/li>\n\u003cli>Hypertension intracrânienne (y compris sans hydrocéphalie)\u003c/li>\n\u003c/ul>\n\u003cp>Dans l’hydrocéphalie, elle permet de diminuer la taille ventriculaire, luttant ainsi contre l’hypertension intracrânienne. La plupart du temps, il s’agit de patients admis dans le cadre d’une hémorragie méningée.\u003c/p>\n\u003cp>Dans l’hémorragie intra-ventriculaire, la pose de DVE participe aussi à l’évacuation du sang intra-ventriculaire.\u003c/p>\n\u003cp>Elle permet parfois de maîtriser, mais de façon très transitoire, un accès d’hypertension intracrânienne.\u003c/p>\n","x":"Hydrocéphalie (communicante ou obstructive) Hémorragie cérébro-méningée avec hémorragie intra-ventriculaire Hypertension intracrânienne (y compris sans hydrocéphalie) Dans l’hydrocéphalie, elle permet de diminuer la taille ventriculaire, luttant ainsi contre l’hypertension intracrânienne. La plupart du temps, il s’agit de patients admis dans le cadre d’une hémorragie méningée. Dans l’hémorragie intra-ventriculaire, la pose de DVE participe aussi à l’évacuation du sang intra-ventriculaire. Elle permet parfois de maîtriser, mais de façon très transitoire, un accès d’hypertension intracrânienne."},{"t":"Réglage","i":"sliders-horizontal","h":"\u003cp>\u003cstrong>Niveau zéro anatomique\u003c/strong> : jonction front – racine du nez pour tous les patients.\u003c/p>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> Vérifier régulièrement que le zéro du niveau correspond au zéro de la réglette de DVE.\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Situation\u003c/th>\n\u003cth align=\"center\">Niveau de base\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>HSA \u003cstrong>avant\u003c/strong> sécurisation de l’anévrisme\u003c/td>\n\u003ctd align=\"center\">+ 15 cm\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>HSA \u003cstrong>après\u003c/strong> sécurisation de l’anévrisme\u003c/td>\n\u003ctd align=\"center\">+ 10 cm\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pathologie de fosse postérieure\u003c/td>\n\u003ctd align=\"center\">+ 20 cm\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hydrocéphalie en dehors d’une HSA\u003c/td>\n\u003ctd align=\"center\">+ 10 cm\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n","x":"Niveau zéro anatomique : jonction front – racine du nez pour tous les patients. Attention Vérifier régulièrement que le zéro du niveau correspond au zéro de la réglette de DVE. Situation Niveau de base HSA avant sécurisation de l’anévrisme + 15 cm HSA après sécurisation de l’anévrisme + 10 cm Pathologie de fosse postérieure + 20 cm Hydrocéphalie en dehors d’une HSA + 10 cm"},{"t":"Monitorage","i":"activity","h":"\u003cul>\n\u003cli>Toutes les DVE doivent être équipées d’un \u003cstrong>capteur de pression\u003c/strong> pour monitorer la pression intracrânienne. Il permet de visualiser la perméabilité du système en continu par l’analyse de la courbe de pression sur le moniteur.\u003c/li>\n\u003cli>La seule mesure de pression intracrânienne valide est celle faite \u003cstrong>après clampage\u003c/strong> du système de dérivation.\u003c/li>\n\u003cli>L’hypertension intracrânienne est définie comme une pression supérieure à \u003cstrong>20 mmHg\u003c/strong> mesurée chez un patient allongé.\u003c/li>\n\u003cli>Comme tout système de mesure de pression, le zéro doit être refait de façon régulière et, dans tous les cas, devant tout chiffre pouvant amener à envisager un changement thérapeutique.\u003c/li>\n\u003c/ul>\n","x":"Toutes les DVE doivent être équipées d’un capteur de pression pour monitorer la pression intracrânienne. Il permet de visualiser la perméabilité du système en continu par l’analyse de la courbe de pression sur le moniteur. La seule mesure de pression intracrânienne valide est celle faite après clampage du système de dérivation. L’hypertension intracrânienne est définie comme une pression supérieure à 20 mmHg mesurée chez un patient allongé. Comme tout système de mesure de pression, le zéro doit être refait de façon régulière et, dans tous les cas, devant tout chiffre pouvant amener à envisager un changement thérapeutique."},{"t":"Dysfonctionnement de DVE","i":"triangle-alert","h":"\u003cp>En cas d’hémorragie importante, il peut y avoir obstruction du système et perte de la courbe de pression.\u003c/p>\n\u003cp>Il convient alors de réaliser un rinçage de la tubulure et du cathéter intra-ventriculaire, mais \u003cstrong>après avoir bien vérifié tout le système\u003c/strong> (plicature, robinet fermé, etc.).\u003c/p>\n\u003cp>Le rinçage du système entre le robinet le plus proche du patient et la poche de DVE est réalisé par l’équipe paramédicale (protocole en place).\u003c/p>\n\u003ch3>Rinçage entre le robinet et le patient : acte médical\u003c/h3>\n\u003col>\n\u003cli>Habillage stérile, masque, calot, gants stériles et asepsie stricte ; désinfection du site d’injection et manipulation du robinet avec compresses imprégnées de chlorhexidine 2 %\u003c/li>\n\u003cli>\u003cstrong>Ne pas aspirer en première intention\u003c/strong> (majoration de l’obstruction)\u003c/li>\n\u003cli>Injecter \u003cstrong>2 ml\u003c/strong> de sérum physiologique stérile à l’aide d’une seringue de 5 ml\u003c/li>\n\u003cli>Vérifier à nouveau la perméabilité\u003c/li>\n\u003cli>Si échec, renouveler l’injection de 2 ml\u003c/li>\n\u003cli>Si échec, aspiration à l’aide d’une seringue de 5 ml\u003c/li>\n\u003cli>Si échec, réalisation d’une TDM non injectée afin de vérifier le bon positionnement du cathéter ± avis neurochirurgical\u003c/li>\n\u003c/ol>\n","x":"En cas d’hémorragie importante, il peut y avoir obstruction du système et perte de la courbe de pression. Il convient alors de réaliser un rinçage de la tubulure et du cathéter intra-ventriculaire, mais après avoir bien vérifié tout le système (plicature, robinet fermé, etc.). Le rinçage du système entre le robinet le plus proche du patient et la poche de DVE est réalisé par l’équipe paramédicale (protocole en place). Rinçage entre le robinet et le patient : acte médical Habillage stérile, masque, calot, gants stériles et asepsie stricte ; désinfection du site d’injection et manipulation du robinet avec compresses imprégnées de chlorhexidine 2 % Ne pas aspirer en première intention (majoration de l’obstruction) Injecter 2 ml de sérum physiologique stérile à l’aide d’une seringue de 5 ml Vérifier à nouveau la perméabilité Si échec, renouveler l’injection de 2 ml Si échec, aspiration à l’aide d’une seringue de 5 ml Si échec, réalisation d’une TDM non injectée afin de vérifier le bon positionnement du cathéter ± avis neurochirurgical"},{"t":"Thrombolyse d’un cathéter de DVE","i":"scissors","h":"\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> Acte médical, réalisé par un \u003cstrong>médecin sénior\u003c/strong> ; vérification au préalable de la bonne position de la DVE en intraventriculaire.\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003cp>\u003cstrong>Population concernée\u003c/strong> : patient avec saignement ventriculaire massif et dysfonction de DVE.\u003c/p>\n\u003ch3>Préparation\u003c/h3>\n\u003cul>\n\u003cli>Habillage stérile (casaque, gants, calot et masque)\u003c/li>\n\u003cli>Préparation du matériel en stérile :\u003cul>\n\u003cli>seringue de solution = \u003cstrong>10 mg d’Actilyse® dans 10 mL\u003c/strong> de NaCl 0,9 % (soit 1 mg/mL), à bien identifier\u003c/li>\n\u003cli>seringue de sérum physiologique\u003c/li>\n\u003cli>compresses imprégnées\u003c/li>\n\u003cli>champage\u003c/li>\n\u003cli>seringue vide de 10 mL\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Désinfection du site d’injection et manipulation du robinet avec compresses imprégnées de chlorhexidine 2 % ; protection du site d’injection dans une nouvelle compresse imprégnée\u003c/li>\n\u003c/ul>\n\u003ch3>Procédure\u003c/h3>\n\u003col>\n\u003cli>Clamper la DVE avec le robinet distal\u003c/li>\n\u003cli>Retirer lentement 2 à 3 mL de LCR au niveau du robinet proximal\u003c/li>\n\u003cli>Injection lente, en retenant le piston, de \u003cstrong>1 à 2 mL de solution d’Actilyse® diluée (1 mg/mL)\u003c/strong> vers le patient, puis de 2 mL de NaCl 0,9 % pour rincer l’Actilyse®\u003c/li>\n\u003cli>Injection en suivant de 5 mL de NaCl 0,9 % vers la burette pour rincer le circuit (à soustraire du bilan de sortie de la DVE)\u003c/li>\n\u003cli>DVE à laisser clampée via le robinet proximal durant \u003cstrong>30 min\u003c/strong> idéalement (selon la tolérance du patient)\u003c/li>\n\u003cli>Protection du robinet proximal selon le protocole du service\u003c/li>\n\u003cli>Vérification, après déclampage, de la pulsatilité et de la productivité de la DVE\u003c/li>\n\u003cli>Évaluation à 8 – 12 h et éventuel renouvellement de la procédure\u003c/li>\n\u003c/ol>\n","x":"Important Acte médical, réalisé par un médecin sénior ; vérification au préalable de la bonne position de la DVE en intraventriculaire. Population concernée : patient avec saignement ventriculaire massif et dysfonction de DVE. Préparation Habillage stérile (casaque, gants, calot et masque) Préparation du matériel en stérile : seringue de solution = 10 mg d’Actilyse® dans 10 mL de NaCl 0,9 % (soit 1 mg/mL), à bien identifier seringue de sérum physiologique compresses imprégnées champage seringue vide de 10 mL Désinfection du site d’injection et manipulation du robinet avec compresses imprégnées de chlorhexidine 2 % ; protection du site d’injection dans une nouvelle compresse imprégnée Procédure Clamper la DVE avec le robinet distal Retirer lentement 2 à 3 mL de LCR au niveau du robinet proximal Injection lente, en retenant le piston, de 1 à 2 mL de solution d’Actilyse® diluée (1 mg/mL) vers le patient, puis de 2 mL de NaCl 0,9 % pour rincer l’Actilyse® Injection en suivant de 5 mL de NaCl 0,9 % vers la burette pour rincer le circuit (à soustraire du bilan de sortie de la DVE) DVE à laisser clampée via le robinet proximal durant 30 min idéalement (selon la tolérance du patient) Protection du robinet proximal selon le protocole du service Vérification, après déclampage, de la pulsatilité et de la productivité de la DVE Évaluation à 8 – 12 h et éventuel renouvellement de la procédure"}]},{"id":"rea-ptio2","s":"rea","t":"Pression tissulaire cérébrale en oxygène","c":"PtiO2","g":"Neuro-réanimation","i":"circle-gauge","p":[48],"r":"Indications, mise en place, objectif > 20 mmHg, algorithme de correction, limites.","m":"PtiO2, oxygène tissulaire, Licox, hyperoxie, monitorage multimodal, HTIC, vasospasme","k":[{"t":"Indications","i":"circle-check","h":"\u003cul>\n\u003cli>Hypertension intracrânienne\u003c/li>\n\u003cli>Hémorragie sous-arachnoïdienne : dès J3, pour couvrir la période à risque de vasospasme chez le patient non évaluable cliniquement\u003c/li>\n\u003c/ul>\n","x":"Hypertension intracrânienne Hémorragie sous-arachnoïdienne : dès J3, pour couvrir la période à risque de vasospasme chez le patient non évaluable cliniquement"},{"t":"Procédure de mise en place","i":"clipboard-list","h":"\u003cul>\n\u003cli>Par un médecin sénior. En frontal droit, sauf cas particuliers.\u003c/li>\n\u003cli>Temps de « chauffe » du moniteur avant interprétation des résultats : \u003cstrong>au moins 12 h\u003c/strong>.\u003c/li>\n\u003cli>Vérification du bon fonctionnement de la fibre : \u003cstrong>épreuve d’hyperoxie 3 h après la pose\u003c/strong> (microtraumatisme dû à la pose) : mettre à 100 % de FiO2 ; si la valeur est au moins multipliée par 2 → OK.\u003c/li>\n\u003cli>Au moindre doute sur le positionnement : TDM.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> \u003cstrong>Objectif thérapeutique : PtiO2 &gt; 20 mmHg\u003c/strong>\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Par un médecin sénior. En frontal droit, sauf cas particuliers. Temps de « chauffe » du moniteur avant interprétation des résultats : au moins 12 h . Vérification du bon fonctionnement de la fibre : épreuve d’hyperoxie 3 h après la pose (microtraumatisme dû à la pose) : mettre à 100 % de FiO2 ; si la valeur est au moins multipliée par 2 → OK. Au moindre doute sur le positionnement : TDM. Important Objectif thérapeutique : PtiO2 > 20 mmHg"},{"t":"Algorithme de prise en charge","i":"workflow","h":"\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> PtiO2 interprétable si \u003cstrong>10 &lt; PaO2 &lt; 13 kPa\u003c/strong>\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003col>\n\u003cli>\u003cstrong>Traitement de l’HTIC\u003c/strong> : pour PIC &lt; 25 mmHg et PPC &gt; 60 mmHg — voir \u003ca class=\"xref\" href=\"#rea-htic\">HTIC\u003c/a>\u003c/li>\n\u003cli>\u003cstrong>PaCO2\u003c/strong> : objectif 4,5 – 5 kPa\u003c/li>\n\u003cli>\u003cstrong>Température\u003c/strong> : 36 – 36,5 °C\u003c/li>\n\u003cli>\u003cstrong>\u003ca class=\"xref\" href=\"#rea-dtc\">Doppler transcrânien\u003c/a>\u003c/strong> :\u003cul>\n\u003cli>suspicion de vasospasme → \u003ca class=\"xref\" href=\"#rea-vasospasme\">protocole vasospasme\u003c/a>\u003c/li>\n\u003cli>vitesse diastolique &lt; 25 cm/s → augmentation de la PAM à 90 – 100 mmHg\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Index cardiaque\u003c/strong> : maximalisation du débit cardiaque (remplissage et/ou inotropes positifs)\u003c/li>\n\u003c/ol>\n","x":"Note PtiO2 interprétable si 10 \u003c PaO2 \u003c 13 kPa Traitement de l’HTIC : pour PIC \u003c 25 mmHg et PPC > 60 mmHg — voir HTIC PaCO2 : objectif 4,5 – 5 kPa Température : 36 – 36,5 °C Doppler transcrânien : suspicion de vasospasme → protocole vasospasme vitesse diastolique \u003c 25 cm/s → augmentation de la PAM à 90 – 100 mmHg Index cardiaque : maximalisation du débit cardiaque (remplissage et/ou inotropes positifs)"},{"t":"Limites","i":"triangle-alert","h":"\u003cul>\n\u003cli>Dérive des mesures à partir de J5 → confrontation aux autres monitorages, pas de variation brutale\u003c/li>\n\u003cli>Bon positionnement (ex. : résorption trans-épendymaire → TDM au moindre doute)\u003c/li>\n\u003cli>Monitorage \u003cstrong>indirect\u003c/strong> de la perfusion cérébrale\u003c/li>\n\u003c/ul>\n","x":"Dérive des mesures à partir de J5 → confrontation aux autres monitorages, pas de variation brutale Bon positionnement (ex. : résorption trans-épendymaire → TDM au moindre doute) Monitorage indirect de la perfusion cérébrale"},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://pubmed.ncbi.nlm.nih.gov/?term=Brain+Oxygen+Optimization+in+Severe+Traumatic+Brain+Injury+Phase-II+Okonkwo\" target=\"_blank\" rel=\"noopener noreferrer\">Okonkwo DO et al. Brain Oxygen Optimization in Severe Traumatic Brain Injury Phase-II (BOOST-II) — recherche PubMed\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. Okonkwo DO et al. Brain Oxygen Optimization in Severe Traumatic Brain Injury Phase-II (BOOST-II) — recherche PubMed"}]},{"id":"rea-eme","s":"rea","t":"État de mal épileptique","c":"EME","g":"Neuro-réanimation","i":"zap","p":[43],"r":"Algorithme thérapeutique de la 1ʳᵉ à la 3ᵉ ligne, EME réfractaire et super-réfractaire.","m":"EME, état de mal, épilepsie, convulsions, midazolam, clonazépam, valproate, phénytoïne, fosphénytoïne, phénobarbital, lévétiracétam, propofol, thiopental, kétamine","k":[{"t":"Algorithme","i":"workflow","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/eme-algo.webp\" data-legende=\"État de mal épileptique : algorithme thérapeutique\">\u003cimg src=\"figures/eme-algo.webp\" alt=\"État de mal épileptique : algorithme thérapeutique\" width=\"1920\" height=\"1485\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>État de mal épileptique : algorithme thérapeutique\u003c/figcaption>\u003c/figure>\n","x":"Agrandir"},{"t":"Lecture de l’algorithme","i":"workflow","h":"\u003cp>Crise tonico-clonique généralisée \u003cstrong>≥ 5 min\u003c/strong>.\u003c/p>\n\u003ch3>5 min : EME précoce — traitement de 1ʳᵉ ligne\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Midazolam\u003c/strong> (IM, buccal, nasal) : 10 mg si ≥ 40 kg, 5 mg si &lt; 40 kg\u003c/li>\n\u003cli>ou \u003cstrong>Clonazépam\u003c/strong> : 1 mg ou 1,5 mg IVD\u003c/li>\n\u003c/ul>\n\u003cp>Si convulsions ≥ 5 min : renouveler (midazolam aux mêmes doses, ou clonazépam 1 ou 1,5 mg IVD) — attention si patient âgé ou détresse respiratoire.\u003c/p>\n\u003ch3>15 – 20 min : EME installé — traitement de 2ᵉ ligne\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Molécule\u003c/th>\n\u003cth>Dose\u003c/th>\n\u003cth>Remarque\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Valproate\u003c/td>\n\u003ctd>30 – 40 mg/kg en 15 min\u003c/td>\n\u003ctd>Max 3 g ; attention chez la femme jeune\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Fos/phénytoïne\u003c/td>\n\u003ctd>20 mg/kg\u003c/td>\n\u003ctd>50 mg/min\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Phénobarbital\u003c/td>\n\u003ctd>15 mg/kg\u003c/td>\n\u003ctd>100 mg/min\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lévétiracétam\u003c/td>\n\u003ctd>30 – 60 mg/kg en 10 min\u003c/td>\n\u003ctd>Max 4,5 g\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>30 – 40 min : EME réfractaire (EMER) — 3ᵉ ligne = anesthésie générale\u003c/h3>\n\u003cp>Ou plus tôt si détresse respiratoire. AG avec intubation/ventilation et EEG continu :\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Midazolam\u003c/strong> : bolus 10 mg IV, puis 0,2 – 0,4 mg/kg/h\u003c/li>\n\u003cli>\u003cstrong>Propofol\u003c/strong> : bolus 2 mg/kg IV, puis 3 – 5 mg/kg/h, avec midazolam (0,1 – 0,2 mg/kg/h)\u003c/li>\n\u003c/ul>\n\u003ch3>≥ 24 heures : EME super-réfractaire\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Thiopental\u003c/strong> : 0,5 mg/kg en bolus répétés puis 1 – 5 mg/kg/h, avec EEG continu\u003c/li>\n\u003cli>Hypothermie 32 – 35 °C\u003c/li>\n\u003c/ul>\n\u003ch3>≥ 48 heures : EME super-réfractaire\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Kétamine\u003c/strong> (bolus 1 à 3 mg/kg puis 0,5 – 5 mg/kg/h) + benzodiazépine\u003c/li>\n\u003cli>Hypothermie, régime cétogène, électroconvulsivothérapie, stimulation vagale…\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Cette section retranscrit la figure du livret (page 43), qui est la seule source ; en cas de doute, se référer à l’image.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Crise tonico-clonique généralisée ≥ 5 min . 5 min : EME précoce — traitement de 1ʳᵉ ligne Midazolam (IM, buccal, nasal) : 10 mg si ≥ 40 kg, 5 mg si \u003c 40 kg ou Clonazépam : 1 mg ou 1,5 mg IVD Si convulsions ≥ 5 min : renouveler (midazolam aux mêmes doses, ou clonazépam 1 ou 1,5 mg IVD) — attention si patient âgé ou détresse respiratoire. 15 – 20 min : EME installé — traitement de 2ᵉ ligne Molécule Dose Remarque Valproate 30 – 40 mg/kg en 15 min Max 3 g ; attention chez la femme jeune Fos/phénytoïne 20 mg/kg 50 mg/min Phénobarbital 15 mg/kg 100 mg/min Lévétiracétam 30 – 60 mg/kg en 10 min Max 4,5 g 30 – 40 min : EME réfractaire (EMER) — 3ᵉ ligne = anesthésie générale Ou plus tôt si détresse respiratoire. AG avec intubation/ventilation et EEG continu : Midazolam : bolus 10 mg IV, puis 0,2 – 0,4 mg/kg/h Propofol : bolus 2 mg/kg IV, puis 3 – 5 mg/kg/h, avec midazolam (0,1 – 0,2 mg/kg/h) ≥ 24 heures : EME super-réfractaire Thiopental : 0,5 mg/kg en bolus répétés puis 1 – 5 mg/kg/h, avec EEG continu Hypothermie 32 – 35 °C ≥ 48 heures : EME super-réfractaire Kétamine (bolus 1 à 3 mg/kg puis 0,5 – 5 mg/kg/h) + benzodiazépine Hypothermie, régime cétogène, électroconvulsivothérapie, stimulation vagale… Note Cette section retranscrit la figure du livret (page 43), qui est la seule source ; en cas de doute, se référer à l’image."},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://pubmed.ncbi.nlm.nih.gov/?term=Outin+status+epilepticus+French+guidelines+2020+Annals+of+Intensive+Care\" target=\"_blank\" rel=\"noopener noreferrer\">RFE SRLF – SFMU – GFRUP 2018 : prise en charge des états de mal épileptiques (recherche PubMed)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. RFE SRLF – SFMU – GFRUP 2018 : prise en charge des états de mal épileptiques (recherche PubMed)"}]},{"id":"rea-avc-ischemique","s":"rea","t":"AVC ischémique","c":"AVC ischémique","g":"Neuro-réanimation","i":"timer","p":[51,52,53,54,55,56],"r":"Thrombolyse (y compris sous anticoagulant), thrombectomie, objectifs tensionnels, craniectomie, bilan étiologique, prévention HAS 2018.","m":"AVC, infarctus cérébral, thrombolyse, tPA, altéplase, thrombectomie, AOD, NIHSS, craniectomie, sylvien malin, prévention secondaire","k":[{"t":"Thrombolyse intraveineuse","i":"scissors","h":"\u003cul>\n\u003cli>Indiquée si délai \u003cstrong>&lt; 4 h 30\u003c/strong>\u003c/li>\n\u003cli>Si heure indéterminée (AVC du réveil) : IRM en urgence (recherche d’un \u003cem>mismatch\u003c/em> FLAIR-DWI)\u003c/li>\n\u003cli>Si traitement anticoagulant : voir l’algorithme ci-dessous\u003c/li>\n\u003c/ul>\n\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/avc-thrombolyse-aod.webp\" data-legende=\"Algorithme : thrombolyse intraveineuse et traitement anticoagulant\">\u003cimg src=\"figures/avc-thrombolyse-aod.webp\" alt=\"Algorithme : thrombolyse intraveineuse et traitement anticoagulant\" width=\"2023\" height=\"659\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Algorithme : thrombolyse intraveineuse et traitement anticoagulant\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Situation\u003c/th>\n\u003cth>Résultat\u003c/th>\n\u003cth align=\"center\">tPA IV\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Dosage spécifique disponible en moins de 30 min (quelle que soit la molécule)\u003c/td>\n\u003ctd>&lt; 50 ng/mL\u003c/td>\n\u003ctd align=\"center\">Oui\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>50 – 100 ng/mL\u003c/td>\n\u003ctd align=\"center\">À discuter\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>&gt; 100 ng/mL\u003c/td>\n\u003ctd align=\"center\">Non\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dosage non disponible — dabigatran\u003c/td>\n\u003ctd>TT &lt; 60 s\u003c/td>\n\u003ctd align=\"center\">Oui\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>TP et TCA normaux\u003c/td>\n\u003ctd align=\"center\">À discuter\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dosage non disponible — rivaroxaban\u003c/td>\n\u003ctd>Anti-Xa &lt; 0,5 U/mL\u003c/td>\n\u003ctd align=\"center\">Oui\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003c/td>\n\u003ctd>TP et TCA normaux\u003c/td>\n\u003ctd align=\"center\">À discuter\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dosage non disponible — tous les « -xabans »\u003c/td>\n\u003ctd>Anti-Xa &lt; 0,5 U/mL\u003c/td>\n\u003ctd align=\"center\">Oui\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dosage non disponible — tous les AOD\u003c/td>\n\u003ctd>Autres situations\u003c/td>\n\u003ctd align=\"center\">Non\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n","x":"Indiquée si délai \u003c 4 h 30 Si heure indéterminée (AVC du réveil) : IRM en urgence (recherche d’un mismatch FLAIR-DWI) Si traitement anticoagulant : voir l’algorithme ci-dessous Agrandir Situation Résultat tPA IV Dosage spécifique disponible en moins de 30 min (quelle que soit la molécule) \u003c 50 ng/mL Oui 50 – 100 ng/mL À discuter > 100 ng/mL Non Dosage non disponible — dabigatran TT \u003c 60 s Oui TP et TCA normaux À discuter Dosage non disponible — rivaroxaban Anti-Xa \u003c 0,5 U/mL Oui TP et TCA normaux À discuter Dosage non disponible — tous les « -xabans » Anti-Xa \u003c 0,5 U/mL Oui Dosage non disponible — tous les AOD Autres situations Non"},{"t":"Thrombectomie","i":"scissors","h":"\u003cul>\n\u003cli>Jusqu’à \u003cstrong>6 heures\u003c/strong>\u003c/li>\n\u003cli>Occlusion proximale des artères cérébrales (carotide, sylvienne, tronc basilaire)\u003c/li>\n\u003cli>En complément de la thrombolyse intraveineuse (&lt; 4 h 30)\u003c/li>\n\u003cli>Décision prise par : 1 neurologue et 1 neuroradiologue interventionnel\u003c/li>\n\u003cli>Dans un établissement avec centre de neuroradiologie interventionnelle et UNV\u003c/li>\n\u003cli>Par un neuroradiologue expérimenté (arrêté du 15 mars 2010)\u003c/li>\n\u003cli>Avec des stents retrievers\u003c/li>\n\u003cli>Choix de la technique d’anesthésie au cas par cas\u003c/li>\n\u003c/ul>\n\u003ch3>Anesthésie pour thrombectomie (RPP SFAR 2022)\u003c/h3>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> \u003cstrong>R1.1.1\u003c/strong> — Les experts suggèrent de privilégier l’\u003cstrong>anesthésie générale avec intubation orotrachéale\u003c/strong>, réalisée par une équipe anesthésique, plutôt que l’anesthésie locale seule, afin d’améliorer le pronostic neurologique à 3 mois, lorsqu’au moins une des situations suivantes est présente :\u003c/p>\n\u003cul>\n\u003cli>atteinte de la circulation postérieure\u003c/li>\n\u003cli>neuronavigation radiologique prévue délicate\u003c/li>\n\u003cli>score NIHSS ≥ 15\u003c/li>\n\u003cli>altération de la vigilance\u003c/li>\n\u003cli>défaillance respiratoire\u003c/li>\n\u003cli>agitation du patient\u003c/li>\n\u003cli>vomissements\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/blockquote>\n\u003cp>Pour approfondir : \u003ca class=\"ext\" href=\"https://sfar.org/prise-en-charge-anesthesique-peri-procedurale-dune-revascularisation-cerebrale-par-thrombectomie\" target=\"_blank\" rel=\"noopener noreferrer\">RPP SFAR 2022 — Prise en charge anesthésique péri-procédurale d’une revascularisation cérébrale par thrombectomie\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/p>\n","x":"Jusqu’à 6 heures Occlusion proximale des artères cérébrales (carotide, sylvienne, tronc basilaire) En complément de la thrombolyse intraveineuse (\u003c 4 h 30) Décision prise par : 1 neurologue et 1 neuroradiologue interventionnel Dans un établissement avec centre de neuroradiologie interventionnelle et UNV Par un neuroradiologue expérimenté (arrêté du 15 mars 2010) Avec des stents retrievers Choix de la technique d’anesthésie au cas par cas Anesthésie pour thrombectomie (RPP SFAR 2022) Note R1.1.1 — Les experts suggèrent de privilégier l’ anesthésie générale avec intubation orotrachéale , réalisée par une équipe anesthésique, plutôt que l’anesthésie locale seule, afin d’améliorer le pronostic neurologique à 3 mois, lorsqu’au moins une des situations suivantes est présente : atteinte de la circulation postérieure neuronavigation radiologique prévue délicate score NIHSS ≥ 15 altération de la vigilance défaillance respiratoire agitation du patient vomissements Pour approfondir : RPP SFAR 2022 — Prise en charge anesthésique péri-procédurale d’une revascularisation cérébrale par thrombectomie"},{"t":"Objectif de pression artérielle","i":"target","h":"\u003cul>\n\u003cli>\u003cstrong>Sans\u003c/strong> thrombolyse / thrombectomie : respecter l’HTA jusqu’à PAS 220 mmHg / PAM 110 mmHg\u003c/li>\n\u003cli>\u003cstrong>Après\u003c/strong> thrombolyse / thrombectomie : PAS max 185 mmHg / PAM max 110 mmHg\u003c/li>\n\u003cli>Dans tous les cas, \u003cstrong>lutte contre l’hypotension\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Le livret imprime « PAM max 185 mmHg / PAM max 110 mmHg » pour la seconde ligne ; la première valeur correspond à la PAS.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Sans thrombolyse / thrombectomie : respecter l’HTA jusqu’à PAS 220 mmHg / PAM 110 mmHg Après thrombolyse / thrombectomie : PAS max 185 mmHg / PAM max 110 mmHg Dans tous les cas, lutte contre l’hypotension Note Le livret imprime « PAM max 185 mmHg / PAM max 110 mmHg » pour la seconde ligne ; la première valeur correspond à la PAS."},{"t":"Mesures associées","i":"shield-check","h":"\u003cul>\n\u003cli>Position 0° à +30°\u003c/li>\n\u003cli>Prévention des \u003ca class=\"xref\" href=\"#rea-acsos\">ACSOS\u003c/a>\u003c/li>\n\u003cli>Prévention MTEV : bas CPI ou HBPM préventive précoce\u003c/li>\n\u003c/ul>\n","x":"Position 0° à +30° Prévention des ACSOS Prévention MTEV : bas CPI ou HBPM préventive précoce"},{"t":"Craniectomie décompressive","i":"scissors","h":"\u003cul>\n\u003cli>\u003cstrong>Indications\u003c/strong> : AVC sylvien malin (ischémie constituée &gt; 145 cm³ à l’IRM) + patient(e) &lt; 60 ans + NIHSS &gt; 15\u003c/li>\n\u003cli>\u003cstrong>Arguments en défaveur\u003c/strong> : dépassé (HTIC avec mydriase bilatérale) ; handicap avant l’AVC ; remaniement hémorragique important\u003c/li>\n\u003cli>\u003cstrong>Si réalisée\u003c/strong> : &gt; 12 cm de diamètre et idéalement dans les 48 h après le début des signes\u003c/li>\n\u003c/ul>\n","x":"Indications : AVC sylvien malin (ischémie constituée > 145 cm³ à l’IRM) + patient(e) \u003c 60 ans + NIHSS > 15 Arguments en défaveur : dépassé (HTIC avec mydriase bilatérale) ; handicap avant l’AVC ; remaniement hémorragique important Si réalisée : > 12 cm de diamètre et idéalement dans les 48 h après le début des signes"},{"t":"Bilan étiologique","i":"test-tubes","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/avc-bilan-etiologique.webp\" data-legende=\"Bilan d’AVC ischémique : démarche diagnostique étiologique chez le sujet jeune\">\u003cimg src=\"figures/avc-bilan-etiologique.webp\" alt=\"Bilan d’AVC ischémique : démarche diagnostique étiologique chez le sujet jeune\" width=\"1293\" height=\"847\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Bilan e la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1161/STR.0000000000000211\" target=\"_blank\" rel=\"noopener noreferrer\">AHA/ASA 2019 : Guidelines for the Early Management of Patients With Acute Ischemic Stroke\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1016/S1474-4422(07)70036-4\" target=\"_blank\" rel=\"noopener noreferrer\">Vahedi K. et al. Early decompressive surgery in malignant infarction of the middle cerebral artery: pooled analysis (Lancet Neurol 2007)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. AHA/ASA 2019 : Guidelines for the Early Management of Patients With Acute Ischemic Stroke Vahedi K. et al. Early decompressive surgery in malignant infarction of the middle cerebral artery: pooled analysis (Lancet Neurol 2007)"}]},{"id":"rea-avc-hemorragique","s":"rea","t":"AVC hémorragique","c":"AVC hémorragique","g":"Neuro-réanimation","i":"droplet","p":[57,58,59],"r":"Objectif PAS \u003c 140 mmHg, réversion des AVK, des AOD et des antiagrégants plaquettaires.","m":"hématome intracérébral, hémorragie intracrânienne, AVK, INR, CCP, PPSB, vitamine K, AOD, dabigatran, rivaroxaban, apixaban, idarucizumab, andexanet, FEIBA, antiagrégants, transfusion plaquettaire","k":[{"t":"Prise en charge chirurgicale","i":"pill","h":"\u003cp>À discuter au cas par cas.\u003c/p>\n","x":"À discuter au cas par cas."},{"t":"Objectif tensionnel à la phase aiguë","i":"target","h":"\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> \u003cstrong>Objectif : pression artérielle systolique &lt; 140 mmHg\u003c/strong>\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Important Objectif : pression artérielle systolique \u003c 140 mmHg"},{"t":"Gestion des AVK (HAS 2008)","i":"droplets","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/avk-has-2008.webp\" data-legende=\"Prise en charge hospitalière d’une hémorragie grave sous AVK (objectif : INR &lt; 1,5)\">\u003cimg src=\"figures/avk-has-2008.webp\" alt=\"Prise en charge hospitalière d’une hémorragie grave sous AVK (objectif : INR &lt; 1,5)\" width=\"1287\" height=\"915\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Prise en charge hospitalière d’une hémorragie grave sous AVK (objectif : INR &lt; 1,5)\u003c/figcaption>\u003c/figure>\n\u003col>\n\u003cli>Arrêt des AVK et mesure de l’INR en urgence\u003c/li>\n\u003cli>\u003cstrong>INR disponible\u003c/strong> : CCP à dose adaptée à l’INR, selon le RCP — \u003cstrong>INR non disponible\u003c/strong> : CCP 25 U/kg (soit 1 ml/kg)\u003c/li>\n\u003cli>\u003cstrong>+ Vitamine K 10 mg\u003c/strong> (1 ampoule adulte ; privilégier la voie orale)\u003c/li>\n\u003cli>Contrôle de l’INR à 30 min\u003c/li>\n\u003cli>Si INR &gt; 1,5 : nouvelle dose de CCP selon le RCP ; contrôle de l’INR à 6 – 8 h\u003c/li>\n\u003c/ol>\n\u003cp>CCP = concentré de complexe prothrombinique, aussi appelé PPSB. L’administration accélérée des CCP est possible en cas d’extrême urgence.\u003c/p>\n\u003cp>Source : \u003ca class=\"ext\" href=\"https://www.has-sante.fr/jcms/c_682188/fr/prise-en-charge-des-surdosages-en-antivitamines-k-des-situations-a-risque-hemorragique-et-des-accidents-hemorragiques-chez-les-patients-traites-par-antivitamines-k-en-ville-et-en-milieu-hospitalier\" target=\"_blank\" rel=\"noopener noreferrer\">HAS 2008 — surdosages, situations à risque hémorragique et accidents hémorragiques sous AVK\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/p>\n","x":"Agrandir Arrêt des AVK et mesure de l’INR en urgence INR disponible : CCP à dose adaptée à l’INR, selon le RCP — INR non disponible : CCP 25 U/kg (soit 1 ml/kg) + Vitamine K 10 mg (1 ampoule adulte ; privilégier la voie orale) Contrôle de l’INR à 30 min Si INR > 1,5 : nouvelle dose de CCP selon le RCP ; contrôle de l’INR à 6 – 8 h CCP = concentré de complexe prothrombinique, aussi appelé PPSB. L’administration accélérée des CCP est possible en cas d’extrême urgence. Source : HAS 2008 — surdosages, situations à risque hémorragique et accidents hémorragiques sous AVK"},{"t":"Gestion des anticoagulants oraux directs (SFAR 2019)","i":"file-text","h":"\u003cul>\n\u003cli>Les tests d’hémostase conventionnels (temps de Quick et temps de céphaline avec activateur) ont des sensibilités faibles et variables suivant l’AOD et le réactif utilisé. Il faut donc privilégier les \u003cstrong>tests spécifiques\u003c/strong> permettant d’exprimer la concentration d’AOD en ng/ml.\u003c/li>\n\u003cli>Une concentration \u003cstrong>&lt; 50 ng/ml\u003c/strong> permet d’exclure la participation de l’AOD à une hémorragie active, et \u003cstrong>tous les gestes invasifs peuvent être réalisés si elle est &lt; 30 ng/ml\u003c/strong>.\u003c/li>\n\u003cli>Pour les AOD anti-Xa, les tests spécifiques reposent sur la mesure de l’activité anti-Xa.\u003c/li>\n\u003cli>Pour le dabigatran, les tests spécifiques reposent sur le temps de thrombine dilué ou le temps d’écarine. Un temps de thrombine normal permet notamment d’exclure une concentration significative de dabigatran.\u003c/li>\n\u003c/ul>\n\u003ch3>Tests d’hémostase et risque hémorragique sous AOD\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>\u003c/th>\u003cth>Dabigatran\u003c/th>
