c/span>\u003c/button>\u003cfigcaption>Position des écarteurs selon le niveau de la chirurgie : L5-S1 (A) ou L4-L5 (B)\u003c/figcaption>\u003c/figure>\n","x":"La manipulation des gros vaisseaux par les écarteurs peut provoquer une ischémie aiguë du membre inférieur gauche. Important La SpO2 est mise au pied gauche en cas d’ALIF L4-L5. Agrandir"},{"t":"Plaie péritonéale","i":"triangle-alert","h":"\u003cp>La proximité du péritoine rend possibles des plaies péritonéales en cas de « hernie » de celui-ci sur le trajet de la dissection.\u003c/p>\n\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> \u003cstrong>La curarisation doit être maintenue jusqu’aux essais de cage.\u003c/strong>\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"La proximité du péritoine rend possibles des plaies péritonéales en cas de « hernie » de celui-ci sur le trajet de la dissection. Important La curarisation doit être maintenue jusqu’aux essais de cage."}]},{"id":"anesth-pbm-adulte","s":"anesth","t":"Protocole PBM adulte","c":"PBM adulte","g":"Épargne sanguine","i":"droplet","p":[87,88],"r":"Gestion du capital sanguin pré-, per- et post-opératoire d’une chirurgie à haut risque hémorragique.","m":"PBM, patient blood management, épargne sanguine, anémie, carence martiale, Ferinject, carboxymaltose ferrique, Exacyl, acide tranexamique, Cell-Saver, transfusion, RAI","k":[{"t":"Pré-opératoire","i":"shield-check","h":"\u003cp>Chirurgie à haut risque hémorragique :\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Recherche systématique\u003c/strong> de l’anémie et de la carence martiale pour toute chirurgie à haut risque hémorragique* (numération ± bilan martial si Hb &lt; 13 g/dl ± bilan vitaminique si ferritine ≥ 100 µg/l et CST &gt; 20 %)\u003c/li>\n\u003cli>\u003cstrong>Chirurgie non urgente\u003c/strong> : si carence martiale associée → carboxymaltose ferrique (\u003cstrong>Ferinject®\u003c/strong>) \u003cstrong>1000 mg IVL\u003c/strong> (ou 500 mg si &lt; 35 kg) sur 15 minutes, \u003cstrong>au moins 21 jours** avant la chirurgie\u003c/strong> (discuter le report de la chirurgie si le délai est insuffisant) ± supplémentation vitaminique\u003c/li>\n\u003cli>\u003cstrong>Chirurgie urgente\u003c/strong> : si carence martiale associée → Ferinject® 1000 mg IVL (ou 500 mg si &lt; 35 kg) sur 15 minutes, lors de la VPA ou au plus tard le jour de la chirurgie ± supplémentation vitaminique\u003c/li>\n\u003cli>\u003cstrong>VPA\u003c/strong> : vérifier le groupe ABO ; prélever RAI et hémoglobine de contrôle si fer IV ; mise en réserve de sang\u003c/li>\n\u003c/ul>\n\u003cp>* Identification des chirurgies à haut risque hémorragique dès la consultation de chirurgie ; remise d’emblée de l’ordonnance type pour le bilan.\u003c/p>\n\u003cp>** Réalisation après la CPA, au J0 d’orthopédie (faire la prescription DxCare pour le fer).\u003c/p>\n","x":"Chirurgie à haut risque hémorragique : Recherche systématique de l’anémie et de la carence martiale pour toute chirurgie à haut risque hémorragique* (numération ± bilan martial si Hb \u003c 13 g/dl ± bilan vitaminique si ferritine ≥ 100 µg/l et CST > 20 %) Chirurgie non urgente : si carence martiale associée → carboxymaltose ferrique ( Ferinject® ) 1000 mg IVL (ou 500 mg si \u003c 35 kg) sur 15 minutes, au moins 21 jours** avant la chirurgie (discuter le report de la chirurgie si le délai est insuffisant) ± supplémentation vitaminique Chirurgie urgente : si carence martiale associée → Ferinject® 1000 mg IVL (ou 500 mg si \u003c 35 kg) sur 15 minutes, lors de la VPA ou au plus tard le jour de la chirurgie ± supplémentation vitaminique VPA : vérifier le groupe ABO ; prélever RAI et hémoglobine de contrôle si fer IV ; mise en réserve de sang * Identification des chirurgies à haut risque hémorragique dès la consultation de chirurgie ; remise d’emblée de l’ordonnance type pour le bilan. ** Réalisation après la CPA, au J0 d’orthopédie (faire la prescription DxCare pour le fer)."},{"t":"Per-opératoire","i":"shield-check","h":"\u003cp>Chirurgie à haut risque hémorragique ou saignement non prévu :\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Cell-Saver®\u003c/strong> à envisager systématiquement si chirurgie non tumorale et non infectieuse\u003c/li>\n\u003cli>Discuter le protocole \u003cstrong>acide tranexamique (Exacyl®)\u003c/strong> : 1 g IVL sur 10 min ± entretien 1 g IVL sur 8 h\u003c/li>\n\u003cli>Maintien de la \u003cstrong>normothermie\u003c/strong> (réchauffement du patient + des solutés)\u003c/li>\n\u003cli>Support transfusionnel (selon la règle 4 CGR / 4 PFC / 1 CPA) ± fibrinogène ± calcium\u003c/li>\n\u003cli>Saignement important : monitorage de l’hémostase\u003c/li>\n\u003cli>Tracer la transfusion → dossier transfusionnel + DxCare / ICCA\u003c/li>\n\u003c/ul>\n","x":"Chirurgie à haut risque hémorragique ou saignement non prévu : Cell-Saver® à envisager systématiquement si chirurgie non tumorale et non infectieuse Discuter le protocole acide tranexamique (Exacyl®) : 1 g IVL sur 10 min ± entretien 1 g IVL sur 8 h Maintien de la normothermie (réchauffement du patient + des solutés) Support transfusionnel (selon la règle 4 CGR / 4 PFC / 1 CPA) ± fibrinogène ± calcium Saignement important : monitorage de l’hémostase Tracer la transfusion → dossier transfusionnel + DxCare / ICCA"},{"t":"Post-opératoire","i":"shield-check","h":"\u003cp>En cas de saignement &gt; 500 ml :\u003c/p>\n\u003cul>\n\u003cli>Rechercher une anémie post-opératoire et prévenir le chirurgien qui prendra en charge le patient\u003c/li>\n\u003cli>Supplémentation en \u003cstrong>fer IV si Hb &lt; 12 g/dl\u003c/strong> liée au saignement (sans nécessité de nouveau bilan martial)\u003c/li>\n\u003cli>Transfusion \u003cstrong>unitaire\u003c/strong> selon les seuils habituels et la tolérance de l’anémie\u003c/li>\n\u003cli>Programmer le suivi de l’anémie et de la carence martiale si elle persiste à la sortie du patient → prescrire une NFS de contrôle + consultation à 1 mois avec le médecin traitant\u003c/li>\n\u003cli>Tracer la transfusion → dossier transfusionnel + DxCare\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> \u003c/p>\n\u003cul>\n\u003cli>Donner au patient une ordonnance pour \u003cstrong>RAI post-transfusionnelles\u003c/strong> à réaliser entre 1 et 3 mois après la transfusion\u003c/li>\n\u003cli>Prendre un avis spécialisé en cas d’anémie profonde (&lt; 10 g/dl) non expliquée, ou en cas d’anémie persistante sévère\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/blockquote>\n","x":"En cas de saignement > 500 ml : Rechercher une anémie post-opératoire et prévenir le chirurgien qui prendra en charge le patient Supplémentation en fer IV si Hb \u003c 12 g/dl liée au saignement (sans nécessité de nouveau bilan martial) Transfusion unitaire selon les seuils habituels et la tolérance de l’anémie Programmer le suivi de l’anémie et de la carence martiale si elle persiste à la sortie du patient → prescrire une NFS de contrôle + consultation à 1 mois avec le médecin traitant Tracer la transfusion → dossier transfusionnel + DxCare Note Donner au patient une ordonnance pour RAI post-transfusionnelles à réaliser entre 1 et 3 mois après la transfusion Prendre un avis spécialisé en cas d’anémie profonde (\u003c 10 g/dl) non expliquée, ou en cas d’anémie persistante sévère"},{"t":"Organisation pratique","i":"clipboard-list","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/pbm-organisation.webp\" data-legende=\"Gestion du capital sanguin en péri-opératoire de neurochirurgie : organisation pratique\">\u003cimg src=\"figures/pbm-organisation.webp\" alt=\"Gestion du capital sanguin en péri-opératoire de neurochirurgie : organisation pratique\" width=\"1296\" height=\"1486\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Gestion du capital sanguin en péri-opératoire de neurochirurgie : organisation pratique\u003c/figcaption>\u003c/figure>\n\u003col>\n\u003cli>Identification du patient éligible par le chirurgien : patient devant bénéficier d’une chirurgie à haut risque hémorragique non urgente\u003c/li>\n\u003cli>Le chirurgien informe l’anesthésiste et/ou le secrétariat d’anesthésie\u003c/li>\n\u003cli>Remise au patient d’une ordonnance pour bilan type, pour la recherche d’une anémie par carence martiale (disponible dans le lecteur I &gt; équipe médicale &gt; protocoles cliniques &gt; anesthésie &gt; PBM &gt; adulte)\u003c/li>\n\u003cli>Programmation de la CPA avec le résultat du bilan réalisé par le patient\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Anémie + carence martiale\u003c/th>\n\u003cth>Autres cas\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Après la CPA\u003c/strong>\u003c/td>\n\u003ctd>Fer IV selon le protocole, dans le service de J0 d’orthopédie, le jour de la CPA ; prescription DxCare à faire ; mail au chirurgien pour programmer la date d’intervention \u003cstrong>au moins 21 jours après le fer IV\u003c/strong>\u003c/td>\n\u003ctd>Programmation libre de la chirurgie\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Lors de la VPA\u003c/strong>\u003c/td>\n\u003ctd>Faire prélever NFS / RAI ; mise en réserve ; prévenir le bloc pour le Cell-Saver® en salle, si non contre-indiqué\u003c/td>\n\u003ctd>Faire prélever RAI (± NFS) ; mise en réserve ; prévenir le bloc pour le Cell-Saver® en salle, si non contre-indiqué\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch3>En cas de chirurgie urgente\u003c/h3>\n\u003cul>\n\u003cli>Remise de l’ordonnance pour bilan ± bilan martial lors de la CPA\u003c/li>\n\u003cli>Si indiqué, fer IV réalisé le soir précédant la chirurgie ou au plus tard le jour de la chirurgie\u003c/li>\n\u003c/ul>\n","x":"Agrandir Identification du patient éligible par le chirurgien : patient devant bénéficier d’une chirurgie à haut risque hémorragique non urgente Le chirurgien informe l’anesthésiste et/ou le secrétariat d’anesthésie Remise au patient d’une ordonnance pour bilan type, pour la recherche d’une anémie par carence martiale (disponible dans le lecteur I > équipe médicale > protocoles cliniques > anesthésie > PBM > adulte) Programmation de la CPA avec le résultat du bilan réalisé par le patient Anémie + carence martiale Autres cas Après la CPA Fer IV selon le protocole, dans le service de J0 d’orthopédie, le jour de la CPA ; prescription DxCare à faire ; mail au chirurgien pour programmer la date d’intervention au moins 21 jours après le fer IV Programmation libre de la chirurgie Lors de la VPA Faire prélever NFS / RAI ; mise en réserve ; prévenir le bloc pour le Cell-Saver® en salle, si non contre-indiqué Faire prélever RAI (± NFS) ; mise en réserve ; prévenir le bloc pour le Cell-Saver® en salle, si non contre-indiqué En cas de chirurgie urgente Remise de l’ordonnance pour bilan ± bilan martial lors de la CPA Si indiqué, fer IV réalisé le soir précédant la chirurgie ou au plus tard le jour de la chirurgie"},{"t":"Référence","i":"book-marked","h":"\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://www.has-sante.fr/jcms/p_3193968/fr/gestion-du-capital-sanguin-en-pre-per-et-post-operatoire-et-en-obstetrique\" target=\"_blank\" rel=\"noopener noreferrer\">HAS 2022 : gestion du capital sanguin en pré-, per- et post-opératoire et en obstétrique (texte complet)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>Voir aussi : \u003ca class=\"xref\" href=\"#rea-anemie\">Anémie en réanimation\u003c/a>, \u003ca class=\"xref\" href=\"#anesth-pbm-pediatrique\">PBM pédiatrique\u003c/a>.\u003c/p>\n","x":"HAS 2022 : gestion du capital sanguin en pré-, per- et post-opératoire et en obstétrique (texte complet) Voir aussi : Anémie en réanimation , PBM pédiatrique ."}]},{"id":"anesth-pbm-pediatrique","s":"anesth","t":"Protocole PBM pédiatrique","c":"PBM pédiatrique","g":"Épargne sanguine","i":"syringe","p":[92],"r":"EPO et fer IV avant chirurgie de craniosténose — chronologie J-28 à J-7.","m":"PBM, pédiatrie, craniosténose, EPO, époétine, Retacrit, Ferinject, fer, enfant","k":[{"t":"Population cible","i":"users","h":"\u003cp>Enfant devant bénéficier d’une chirurgie pour \u003cstrong>craniosténose\u003c/strong>, endoscopique ou classique.\u003c/p>\n","x":"Enfant devant bénéficier d’une chirurgie pour craniosténose , endoscopique ou classique."},{"t":"Organisation","i":"clipboard-list","h":"\u003cul>\n\u003cli>CPA organisée \u003cstrong>au minimum 3 semaines avant\u003c/strong> la chirurgie. Enfant vu en début de vacation.\u003c/li>\n\u003cli>Puéricultrice prévenue\u003c/li>\n\u003cli>Prescription DxCare pour l’injection de fer IV et la première injection d’EPO\u003c/li>\n\u003cli>Prescription sécurisée pour les 2ᵉ et 3ᵉ injections d’EPO (ordonnance sécurisée pour l’EPO dans l’outil bureautique + ordonnance du bilan à réaliser à J-7)\u003c/li>\n\u003c/ul>\n","x":"CPA organisée au minimum 3 semaines avant la chirurgie. Enfant vu en début de vacation. Puéricultrice prévenue Prescription DxCare pour l’injection de fer IV et la première injection d’EPO Prescription sécurisée pour les 2ᵉ et 3ᵉ injections d’EPO (ordonnance sécurisée pour l’EPO dans l’outil bureautique + ordonnance du bilan à réaliser à J-7)"},{"t":"Chronologie","i":"clock","h":"\u003cdiv class=\"timeline\">\n\u003cdiv class=\"step\">\u003cdiv class=\"when\">J-28 à J-21\u003csmall>Service J0, en suivant de la CPA\u003c/small>\u003c/div>\u003cdiv class=\"what\">\n\n\u003cul>\n\u003cli>\u003cstrong>EPO 600 UI/kg SC\u003c/strong> (époétine zêta – Retacrit®) \u003cstrong>+ Ferinject® 15 mg/kg IVL\u003c/strong>\u003c/li>\n\u003cli>Bilan : 1ʳᵉ détermination\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step\">\u003cdiv class=\"when\">J-14\u003csmall>À domicile, par IDE\u003c/small>\u003c/div>\u003cdiv class=\"what\">\n\n\u003cul>\n\u003cli>\u003cstrong>EPO 600 UI/kg SC\u003c/strong> (époétine zêta – Retacrit®)\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003cdiv class=\"step\">\u003cdiv class=\"when\">J-7\u003csmall>À domicile, par IDE\u003c/small>\u003c/div>\u003cdiv class=\"what\">\n\n\u003cul>\n\u003cli>\u003cstrong>EPO 600 UI/kg SC\u003c/strong> (époétine zêta – Retacrit®)\u003c/li>\n\u003cli>Bilan : 2ᵉ détermination + NFS – plaquettes, TP, TCA et RAI\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/div>\n\u003c/div>\n","x":"J-28 à J-21 Service J0, en suivant de la CPA EPO 600 UI/kg SC (époétine zêta – Retacrit®) + Ferinject® 15 mg/kg IVL Bilan : 1ʳᵉ détermination J-14 À domicile, par IDE EPO 600 UI/kg SC (époétine zêta – Retacrit®) J-7 À domicile, par IDE EPO 600 UI/kg SC (époétine zêta – Retacrit®) Bilan : 2ᵉ détermination + NFS – plaquettes, TP, TCA et RAI"},{"t":"Protocole complet","i":"syringe","h":"\u003cp>Disponible dans le lecteur partagé « I » : équipe médicale &gt; protocoles cliniques &gt; anesthésie &gt; PBM &gt; pédiatrie.\u003c/p>\n\u003cp>Voir aussi : \u003ca class=\"xref\" href=\"#anesth-pediatrie\">Anesthésie pédiatrique\u003c/a>.\u003c/p>\n","x":"Disponible dans le lecteur partagé « I » : équipe médicale > protocoles cliniques > anesthésie > PBM > pédiatrie. Voir aussi : Anesthésie pédiatrique ."}]},{"id":"anesth-pediatrie","s":"anesth","t":"Anesthésie pédiatrique en neurochirurgie","c":"Pédiatrie","g":"Pédiatrie","i":"baby","p":[90,91],"r":"Bilan pré-opératoire selon le risque hémorragique, RAI, information des parents, VPA, jeûne.","m":"pédiatrie, enfant, craniosténose, bilan, RAI, groupe sanguin, Coombs, jeûne, lait, CGR, PFC, parents, USC pédiatrique","k":[{"t":"Chirurgies selon le risque hémorragique","i":"triangle-alert","h":"\u003cp>Le bilan pré-opératoire peut être prescrit lors de l’hospitalisation pour la réalisation d’une imagerie pré-opératoire en HDJ.\u003c/p>\n\u003cdiv class=\"duo\">\n\u003cdiv>\n\n\u003ch3>Risque hémorragique faible\u003c/h3>\n\u003cul>\n\u003cli>Kyste dermoïde\u003c/li>\n\u003cli>Boîtier de stimulation (VNS)\u003c/li>\n\u003cli>PIL\u003c/li>\n\u003cli>Pompe à baclofène\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003cdiv>\n\n\u003ch3>Risque élevé / chirurgie intracrânienne\u003c/h3>\n\u003cul>\n\u003cli>Craniosténoses (scaphocéphalie, brachycéphalie, trigonocéphalie, plagiocéphalie, oxycéphalie)\u003c/li>\n\u003cli>Tumeurs cérébrales (biopsies et exérèses)\u003c/li>\n\u003cli>Cortectomies temporo-mésiales\u003c/li>\n\u003cli>SEEG\u003c/li>\n\u003cli>VCS\u003c/li>\n\u003cli>DVP\u003c/li>\n\u003cli>Malformation d’Arnold-Chiari\u003c/li>\n\u003cli>Cranioplastie\u003c/li>\n\u003cli>Moelle attachée\u003c/li>\n\u003c/ul>\n\u003c/div>\n\u003c/div>\n","x":"Le bilan pré-opératoire peut être prescrit lors de l’hospitalisation pour la réalisation d’une imagerie pré-opératoire en HDJ. Risque hémorragique faible Kyste dermoïde Boîtier de stimulation (VNS) PIL Pompe à baclofène Risque élevé / chirurgie intracrânienne Craniosténoses (scaphocéphalie, brachycéphalie, trigonocéphalie, plagiocéphalie, oxycéphalie) Tumeurs cérébrales (biopsies et exérèses) Cortectomies temporo-mésiales SEEG VCS DVP Malformation d’Arnold-Chiari Cranioplastie Moelle attachée"},{"t":"Bilan pré-opératoire","i":"test-tubes","h":"\u003cul>\n\u003cli>\u003cstrong>NFS – plaquettes\u003c/strong> : toute chirurgie à risque hémorragique ou chirurgie intracrânienne\u003c/li>\n\u003cli>\u003cstrong>Ionogramme sanguin (Na, K)\u003c/strong> : toute tumeur cérébrale\u003c/li>\n\u003cli>\u003cstrong>Bilan de coagulation\u003c/strong> (TP – TCA – fibrinogène ± facteurs VIII, IX, XI si TCA allongé) :\u003cul>\n\u003cli>indications : tout enfant avant l’acquisition de la marche ; chirurgie à risque hémorragique élevé\u003c/li>\n\u003cli>normes : TP &gt; 70 % ; ratio TCA : 1,30 jusqu’à 1 mois, puis 1,20 après 1 mois\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Carte de groupe sanguin, 2 déterminations\u003c/strong> :\u003cul>\n\u003cli>nouvelles déterminations si chirurgie &gt; 6 mois\u003c/li>\n\u003cli>&lt; 6 mois : groupe sanguin maternel (2 déterminations)\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch3>RAI\u003c/h3>\n\u003cp>\u003cstrong>Avant 4 mois\u003c/strong> : la RAI du bilan initial reste valide, même en cas de polytransfusion.\u003c/p>\n\u003cul>\n\u003cli>RAI sur un bilan précédent (même si &gt; 21 jours) : pas de nouveau prélèvement\u003c/li>\n\u003cli>Mère présente : RAI maternelles\u003c/li>\n\u003cli>Mère absente : test de Coombs\u003c/li>\n\u003cli>Si RAI maternelles positives ou Coombs positif chez l’enfant : toute transfusion de CGR nécessite une épreuve de compatibilité\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Après 4 mois\u003c/strong> :\u003c/p>\n\u003cul>\n\u003cli>RAI &lt; 3 jours si transfusion\u003c/li>\n\u003cli>Prolongation à 21 jours sinon\u003c/li>\n\u003c/ul>\n","x":"NFS – plaquettes : toute chirurgie à risque hémorragique ou chirurgie intracrânienne Ionogramme sanguin (Na, K) : toute tumeur cérébrale Bilan de coagulation (TP – TCA – fibrinogène ± facteurs VIII, IX, XI si TCA allongé) : indications : tout enfant avant l’acquisition de la marche ; chirurgie à risque hémorragique élevé normes : TP > 70 % ; ratio TCA : 1,30 jusqu’à 1 mois, puis 1,20 après 1 mois Carte de groupe sanguin, 2 déterminations : nouvelles déterminations si chirurgie > 6 mois \u003c 6 mois : groupe sanguin maternel (2 déterminations) RAI Avant 4 mois : la RAI du bilan initial reste valide, même en cas de polytransfusion. RAI sur un bilan précédent (même si > 21 jours) : pas de nouveau prélèvement Mère présente : RAI maternelles Mère absente : test de Coombs Si RAI maternelles positives ou Coombs positif chez l’enfant : toute transfusion de CGR nécessite une épreuve de compatibilité Après 4 mois : RAI \u003c 3 jours si transfusion Prolongation à 21 jours sinon"},{"t":"Information des parents","i":"users","h":"\u003cul>\n\u003cli>Sur le haut risque hémorragique et transfusionnel\u003c/li>\n\u003cli>Sur la nécessité d’un abord veineux central pour les chirurgies les plus à risque, ou si l’abord veineux périphérique est difficile ou insuffisant (enfant &lt; 1 an)\u003c/li>\n\u003cli>Sur la nécessité probable d’une PA invasive pour les chirurgies à plus haut risque hémorragique\u003c/li>\n\u003cli>Sur la surveillance en USC ou en réanimation pédiatrique en post-opératoire\u003c/li>\n\u003cli>Sur les bilans répétés en post-opératoire pour les chirurgies les plus hémorragiques\u003c/li>\n\u003cli>Possibilité de report si l’enfant est malade (balance bénéfice / risque)\u003c/li>\n\u003c/ul>\n","x":"Sur le haut risque hémorragique et transfusionnel Sur la nécessité d’un abord veineux central pour les chirurgies les plus à risque, ou si l’abord veineux périphérique est difficile ou insuffisant (enfant \u003c 1 an) Sur la nécessité probable d’une PA invasive pour les chirurgies à plus haut risque hémorragique Sur la surveillance en USC ou en réanimation pédiatrique en post-opératoire Sur les bilans répétés en post-opératoire pour les chirurgies les plus hémorragiques Possibilité de report si l’enfant est malade (balance bénéfice / risque)"},{"t":"Visite pré-anesthésique","i":"clipboard-list","h":"\u003cp>Vérification :\u003c/p>\n\u003cul>\n\u003cli>de l’absence de contre-indication anesthésique habituelle pour l’enfant (fièvre, auscultation anormale, encombrement bronchique, etc.)\u003c/li>\n\u003cli>du bilan : dernière Hb, carte de groupe sanguin valide, RAI, bilan de coagulation\u003c/li>\n\u003cli>de la \u003cstrong>commande de 20 ml/kg de CGR\u003c/strong> à l’EFS (en général 1 CGR adulte) ± PFC (40 ml/kg) si chirurgie à très haut risque hémorragique\u003c/li>\n\u003cli>de l’\u003cstrong>autorisation d’opérer des 2 parents\u003c/strong>\u003c/li>\n\u003cli>de la PCR COVID 48 – 72 h avant l’intervention chirurgicale\u003c/li>\n\u003c/ul>\n\u003cp>Si nécessaire, RAI la veille et contrôle de la NFS.\u003c/p>\n\u003cp>Confirmation de la place en USC pédiatrique chirurgicale (anesthésie) / USC médicale ou réanimation pédiatrique pour le post-opératoire (cf. procédure).\u003c/p>\n","x":"Vérification : de l’absence de contre-indication anesthésique habituelle pour l’enfant (fièvre, auscultation anormale, encombrement bronchique, etc.) du bilan : dernière Hb, carte de groupe sanguin valide, RAI, bilan de coagulation de la commande de 20 ml/kg de CGR à l’EFS (en général 1 CGR adulte) ± PFC (40 ml/kg) si chirurgie à très haut risque hémorragique de l’ autorisation d’opérer des 2 parents de la PCR COVID 48 – 72 h avant l’intervention chirurgicale Si nécessaire, RAI la veille et contrôle de la NFS. Confirmation de la place en USC pédiatrique chirurgicale (anesthésie) / USC médicale ou réanimation pédiatrique pour le post-opératoire (cf. procédure)."},{"t":"Consignes de jeûne","i":"clock","h":"\u003cp>Rajouter l’onglet « VPA pédia » sur DxCare pour le MAR de neurochirurgie.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth align=\"center\">\u003c/th>\n\u003cth>&lt; 6 mois\u003c/th>\n\u003cth>6 mois – 1 an\u003c/th>\n\u003cth>&gt; 1 an\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>H-6\u003c/strong>\u003c/td>\n\u003ctd>Lait non 1ᵉʳ âge ou épaissi\u003c/td>\n\u003ctd>Lait 2ᵉ âge ou épaissi, et solides\u003c/td>\n\u003ctd>Lait ou solides\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>H-4\u003c/strong>\u003c/td>\n\u003ctd>Lait 1ᵉʳ âge ou lait artificiel\u003c/td>\n\u003ctd>–\u003c/td>\n\u003ctd>–\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>H-3\u003c/strong>\u003c/td>\n\u003ctd>Lait maternel\u003c/td>\n\u003ctd>–\u003c/td>\n\u003ctd>–\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>H-2\u003c/strong>\u003c/td>\n\u003ctd>–\u003c/td>\n\u003ctd>–\u003c/td>\n\u003ctd>Eau sucrée ou jus sans pulpe\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>H-1\u003c/strong>\u003c/td>\n\u003ctd>Eau sucrée ou jus sans pulpe\u003c/td>\n\u003ctd>Eau sucrée ou jus sans pulpe\u003c/td>\n\u003ctd>–\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>NB : yaourt et compote sont considérés comme des \u003cstrong>solides\u003c/strong>.\u003c/p>\n","x":"Rajouter l’onglet « VPA pédia » sur DxCare pour le MAR de neurochirurgie. \u003c 6 mois 6 mois – 1 an > 1 an H-6 Lait non 1ᵉʳ âge ou épaissi Lait 2ᵉ âge ou épaissi, et solides Lait ou solides H-4 Lait 1ᵉʳ âge ou lait artificiel – – H-3 Lait maternel – – H-2 – – Eau sucrée ou jus sans pulpe H-1 Eau sucrée ou jus sans pulpe Eau sucrée ou jus sans pulpe – NB : yaourt et compote sont considérés comme des solides ."},{"t":"Numéros de téléphone utiles","i":"phone","h":"\u003cp>Bloc pédiatrique, anesthésiste régulateur du bloc pédiatrique, anesthésiste de médecine péri-opératoire, soins continus chirurgicaux, réanimateur pédiatrique de régulation et de garde, réanimation pédiatrique : numéros dans l’annuaire interne.\u003c/p>\n\u003cp>Voir aussi : \u003ca class=\"xref\" href=\"#anesth-pbm-pediatrique\">PBM pédiatrique\u003c/a>.\u003c/p>\n","x":"Bloc pédiatrique, anesthésiste régulateur du bloc pédiatrique, anesthésiste de médecine péri-opératoire, soins continus chirurgicaux, réanimateur pédiatrique de régulation et de garde, réanimation pédiatrique : numéros dans l’annuaire interne. Voir aussi : PBM pédiatrique ."}]},{"id":"anesth-diabete","s":"anesth","t":"Diabète péri-opératoire","c":"Diabète péri-opératoire","g":"Fiches pratiques","i":"candy","p":[93,94,95,96,97,98,99,100,101,102,103],"r":"Les 10 fiches SFAR – SFD 2025, du pré-opératoire à la reprise des traitements, hypo- et hyperglycémie, insuline IVSE et basal-bolus.","m":"diabète, DT1, DT2, HbA1c, insuline, IVSE, basal bolus, hypoglycémie, hyperglycémie, cétose, cétonémie, SGLT2, gliflozine, metformine, pompe à insuline, G10%, G30%, relais","k":[{"t":"Source","i":"book-marked","h":"\u003cp>Fiches simplifiées du groupe SFAR – SFD, 2025 : \u003ca class=\"ext\" href=\"https://sfar.org/wp-content/uploads/2025/10/Fiches-simplifiees-PEC-diabetique-01102025.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">prise en charge du patient diabétique en péri-opératoire (PDF, sfar.org)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>. Chaque fiche du livret est reproduite telle quelle ; toucher une fiche pour l’agrandir.\u003c/p>\n","x":"Fiches simplifiées du groupe SFAR – SFD, 2025 : prise en charge du patient diabétique en péri-opératoire (PDF, sfar.org) . Chaque fiche du livret est reproduite telle quelle ; toucher une fiche pour l’agrandir."},{"t":"Généralités (DT1 et DT2)","i":"info","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/diabete-generalites.webp\" data-legende=\"Généralités : types de diabète, objectifs glycémiques, stratégie selon l’HbA1c\">\u003cimg src=\"figures/diabete-generalites.webp\" alt=\"Généralités : types de diabète, objectifs glycémiques, stratégie selon l’HbA1c\" width=\"2339\" height=\"1343\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Généralités : types de diabète, objectifs glycémiques, stratégie selon l’HbA1c\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>\u003cstrong>Objectifs glycémiques en péri-opératoire : 5 à 10 mmol/l (0,9 à 1,8 g/l)\u003c/strong>\u003c/li>\n\u003cli>HbA1c : récupérer le dernier dosage en consultation, ou faire un dosage si le patient n’en a pas fait depuis plus de 3 mois ou s’il présente un déséquilibre de son diabète\u003c/li>\n\u003cli>Stratégie selon l’HbA1c : &lt; 5 % différer ; 5 – 6 % avis médecin généraliste / diabétologue ; **6 – 8 % intervention possible** ; 8 – 9 % avis médecin généraliste / diabétologue ; &gt; 9 % différer\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-caution\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-octagon-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Danger\u003c/span> Chez le patient \u003cstrong>DT1\u003c/strong>, quelle que soit la glycémie : \u003cstrong>ne jamais arrêter l’insuline lente\u003c/strong> (risque vital d’acidocétose).\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Agrandir Objectifs glycémiques en péri-opératoire : 5 à 10 mmol/l (0,9 à 1,8 g/l) HbA1c : récupérer le dernier dosage en consultation, ou faire un dosage si le patient n’en a pas fait depuis plus de 3 mois ou s’il présente un déséquilibre de son diabète Stratégie selon l’HbA1c : \u003c 5 % différer ; 5 – 6 % avis médecin généraliste / diabétologue ; **6 – 8 % intervention possible** ; 8 – 9 % avis médecin généraliste / diabétologue ; > 9 % différer Danger Chez le patient DT1 , quelle que soit la glycémie : ne jamais arrêter l’insuline lente (risque vital d’acidocétose)."},{"t":"Prise en charge pré-opératoire","i":"pill","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/diabete-preop.webp\" data-legende=\"Pré-opératoire : arrêt des antidiabétiques, règles de jeûne, protocole selon la glycémie capillaire\">\u003cimg src=\"figures/diabete-preop.webp\" alt=\"Pré-opératoire : arrêt des antidiabétiques, règles de jeûne, protocole selon la glycémie capillaire\" width=\"2339\" height=\"1352\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Pré-opératoire : arrêt des antidiabétiques, règles de jeûne, protocole selon la glycémie capillaire\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Traitement\u003c/th>\n\u003cth>Intervention courte et ≤ 1 repas jeûné\u003c/th>\n\u003cth>Intervention mineure ou majeure et/ou ≥ 2 repas jeûnés\u003c/th>\n\u003cth>Intervention urgente\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Metformine ; sulfamides, glinides ; inhibiteurs des α-glucosidases ; inhibiteurs de DPP-4\u003c/td>\n\u003ctd>Pas d’arrêt\u003c/td>\n\u003ctd>Pas de prise le matin\u003c/td>\n\u003ctd>Arrêt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Agonistes des récepteurs du GLP-1\u003c/td>\n\u003ctd>Pas d’arrêt (échographie gastrique ± induction en séquence rapide)\u003c/td>\n\u003ctd>Pas d’arrêt (échographie gastrique ± induction en séquence rapide)\u003c/td>\n\u003ctd>Arrêt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Inhibiteurs de SGLT2\u003c/strong>\u003c/td>\n\u003ctd>Dernière prise \u003cstrong>3 jours avant\u003c/strong> l’intervention (risque d’acidocétose euglycémique)\u003c/td>\n\u003ctd>Dernière prise \u003cstrong>3 jours avant\u003c/strong> l’intervention\u003c/td>\n\u003ctd>Arrêt\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Insulines SC\u003c/td>\n\u003ctd>Pas d’arrêt\u003c/td>\n\u003ctd>Pas d’injection le matin (\u003cstrong>sauf la basale chez le DT1\u003c/strong>)\u003c/td>\n\u003ctd>Arrêt et relais\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pompe à insuline\u003c/td>\n\u003ctd>Pas d’arrêt\u003c/td>\n\u003ctd>Arrêt de la pompe à l’arrivée au bloc*\u003c/td>\n\u003ctd>Arrêt et relais\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>\u003cstrong>Règles de jeûne\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Repas du soir normal ; donner le traitement habituel (antidiabétiques non insuliniques et/ou insulines aux mêmes posologies)\u003c/li>\n\u003cli>Dernier repas solide à H-6 ; liquides clairs autorisés jusqu’à H-2\u003c/li>\n\u003cli>Perfusion de soluté glucosé \u003cstrong>si et seulement si\u003c/strong> : jeûne et insuline lente injectée (matin ou soir) ou pompe à insuline en cours → G10 % 40 ml/h à partir du premier repas jeûné ; ou jeûne prolongé → apports glucosés quotidiens nécessaires (100 à 150 g de glucose, par exemple G10 % 40 ml/h)\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>* Maintien possible d’une pompe à insuline si\u003c/strong> : intervention courte &lt; 2 h ; perturbations du contrôle glycémique non attendues ; dispositifs visibles et à distance du champ opératoire ; glycémies artérielles, veineuses ou capillaires préférées aux mesures du glucose interstitiel en per-opératoire ; accord du patient et de l’équipe d’anesthésie ; gestion de son matériel par le patient précocement en post-opératoire ; avis du diabétologue pour l’adaptation des débits d’insuline.\u003c/p>\n","x":"Agrandir Traitement Intervention courte et ≤ 1 repas jeûné Intervention mineure ou majeure et/ou ≥ 2 repas jeûnés Intervention urgente Metformine ; sulfamides, glinides ; inhibiteurs des α-glucosidases ; inhibiteurs de DPP-4 Pas d’arrêt Pas de prise le matin Arrêt Agonistes des récepteurs du GLP-1 Pas d’arrêt (échographie gastrique ± induction en séquence rapide) Pas d’arrêt (échographie gastrique ± induction en séquence rapide) Arrêt Inhibiteurs de SGLT2 Dernière prise 3 jours avant l’intervention (risque d’acidocétose euglycémique) Dernière prise 3 jours avant l’intervention Arrêt Insulines SC Pas d’arrêt Pas d’injection le matin ( sauf la basale chez le DT1 ) Arrêt et relais Pompe à insuline Pas d’arrêt Arrêt de la pompe à l’arrivée au bloc* Arrêt et relais Règles de jeûne Repas du soir normal ; donner le traitement habituel (antidiabétiques non insuliniques et/ou insulines aux mêmes posologies) Dernier repas solide à H-6 ; liquides clairs autorisés jusqu’à H-2 Perfusion de soluté glucosé si et seulement si : jeûne et insuline lente injectée (matin ou soir) ou pompe à insuline en cours → G10 % 40 ml/h à partir du premier repas jeûné ; ou jeûne prolongé → apports glucosés quotidiens nécessaires (100 à 150 g de glucose, par exemple G10 % 40 ml/h) * Maintien possible d’une pompe à insuline si : intervention courte \u003c 2 h ; perturbations du contrôle glycémique non attendues ; dispositifs visibles et à distance du champ opératoire ; glycémies artérielles, veineuses ou capillaires préférées aux mesures du glucose interstitiel en per-opératoire ; accord du patient et de l’équipe d’anesthésie ; gestion de son matériel par le patient précocement en post-opératoire ; avis du diabétologue pour l’adaptation des débits d’insuline."},{"t":"Inhibiteur de SGLT2 arrêté depuis moins de 3 jours","i":"file-text","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/diabete-sglt2.webp\" data-legende=\"Traitement par inhibiteur de SGLT2 et arrêt &lt; 3 jours\">\u003cimg src=\"figures/diabete-sglt2.webp\" alt=\"Traitement par inhibiteur de SGLT2 et arrêt &lt; 3 jours\" width=\"2339\" height=\"1338\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Traitement par inhibiteur de SGLT2 et arrêt &lt; 3 jours\u003c/figcaption>\u003c/figure>\n\u003cp>Recherche d’une cétose, en préférant la \u003cstrong>cétonémie\u003c/strong> à la cétonurie :\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Cétonémie &lt; 0,5 mmol/l\u003c/strong> (cétonurie = 0) : si hyperglycémie, voir la fiche « glycémie ≥ 16,5 mmol/l » ; surveillance de la cétonémie à H12\u003c/li>\n\u003cli>\u003cstrong>0,5 ≤ cétonémie ≤ 1,5 mmol/l\u003c/strong> (cétonurie à 1 croix) : analogue rapide de l’insuline SC + glucose selon la glycémie (tableau ci-dessous) ; surveillance de la glycémie et de la cétonémie à H4\u003c/li>\n\u003cli>\u003cstrong>Cétonémie &gt; 1,5 mmol/l\u003c/strong> (cétonurie ≥ 2 croix) : rechercher une acidose ; transfert en USC pour insulinothérapie IVSE\u003c/li>\n\u003c/ul>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Glycémie\u003c/th>\n\u003cth align=\"center\">8 – 12 mmol/l (1,5 – 2,2 g/l)\u003c/th>\n\u003cth align=\"center\">12 – 16,4 mmol/l (2,2 – 2,99 g/l)\u003c/th>\n\u003cth align=\"center\">≥ 16,5 mmol/l (3 g/l)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Analogue rapide de l’insuline SC\u003c/td>\n\u003ctd align=\"center\">4 UI\u003c/td>\n\u003ctd align=\"center\">6 UI\u003c/td>\n\u003ctd align=\"center\">10 UI\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Glucose\u003c/td>\n\u003ctd align=\"center\">15 g\u003c/td>\n\u003ctd align=\"center\">0\u003c/td>\n\u003ctd align=\"center\">0\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n","x":"Agrandir Recherche d’une cétose, en préférant la cétonémie à la cétonurie : Cétonémie \u003c 0,5 mmol/l (cétonurie = 0) : si hyperglycémie, voir la fiche « glycémie ≥ 16,5 mmol/l » ; surveillance de la cétonémie à H12 0,5 ≤ cétonémie ≤ 1,5 mmol/l (cétonurie à 1 croix) : analogue rapide de l’insuline SC + glucose selon la glycémie (tableau ci-dessous) ; surveillance de la glycémie et de la cétonémie à H4 Cétonémie > 1,5 mmol/l (cétonurie ≥ 2 croix) : rechercher une acidose ; transfert en USC pour insulinothérapie IVSE Glycémie 8 – 12 mmol/l (1,5 – 2,2 g/l) 12 – 16,4 mmol/l (2,2 – 2,99 g/l) ≥ 16,5 mmol/l (3 g/l) Analogue rapide de l’insuline SC 4 UI 6 UI 10 UI Glucose 15 g 0 0"},{"t":"Glycémie ≥ 16,5 mmol/l (3 g/l)","i":"triangle-alert","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/diabete-hyperglycemie.webp\" data-legende=\"Conduite à tenir devant une glycémie ≥ 16,5 mmol/l (3 g/l)\">\u003cimg src=\"figures/diabete-hyperglycemie.webp\" alt=\"Conduite à tenir devant une glycémie ≥ 16,5 mmol/l (3 g/l)\" width=\"2339\" height=\"1338\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Conduite à tenir devant une glycémie ≥ 16,5 mmol/l (3 g/l)\u003c/figcaption>\u003c/figure>\n\u003cp>Recherche d’une cétose, en préférant la cétonémie à la cétonurie :\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Cétonémie\u003c/th>\n\u003cth>Conduite\u003c/th>\n\u003cth>Suite\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>&lt; 0,5 mmol/l (cétonurie = 0)\u003c/td>\n\u003ctd>\u003cstrong>6 UI SC\u003c/strong> d’analogue rapide de l’insuline\u003c/td>\n\u003ctd>Surveillance de la glycémie à H4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>0,5 à 1,5 mmol/l (cétonurie à 1 croix)\u003c/td>\n\u003ctd>\u003cstrong>10 UI SC\u003c/strong> d’analogue rapide de l’insuline\u003c/td>\n\u003ctd>Contrôle de la glycémie et recherche de cétose à H4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>&gt; 1,5 mmol/l (cétonurie ≥ 2 croix)\u003c/td>\n\u003ctd>\u003cstrong>Rechercher une acidose\u003c/strong>\u003c/td>\n\u003ctd>Transfert en USC pour insulinothérapie IVSE\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n","x":"Agrandir Recherche d’une cétose, en préférant la cétonémie à la cétonurie : Cétonémie Conduite Suite \u003c 0,5 mmol/l (cétonurie = 0) 6 UI SC d’analogue rapide de l’insuline Surveillance de la glycémie à H4 0,5 à 1,5 mmol/l (cétonurie à 1 croix) 10 UI SC d’analogue rapide de l’insuline Contrôle de la glycémie et recherche de cétose à H4 > 1,5 mmol/l (cétonurie ≥ 2 croix) Rechercher une acidose Transfert en USC pour insulinothérapie IVSE"},{"t":"Hypoglycémie à l’hôpital","i":"triangle-alert","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/diabete-hypoglycemie.webp\" data-legende=\"Conduite à tenir devant une hypoglycémie à l’hôpital\">\u003cimg src=\"figures/diabete-hypoglycemie.webp\" alt=\"Conduite à tenir devant une hypoglycémie à l’hôpital\" width=\"2339\" height=\"1338\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Conduite à tenir devant une hypoglycémie à l’hôpital\u003c/figcaption>\u003c/figure>\n\u003cp>\u003cstrong>Glycémie &lt; 3,3 mmol/l (0,6 g/l)\u003c/strong>\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Situation\u003c/th>\n\u003cth>Resucrage\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Patient \u003cstrong>inconscient\u003c/strong>, glycémie &lt; 2,2 mmol/l (0,4 g/l)\u003c/td>\n\u003ctd>\u003cstrong>2 ampoules de G30 % IVD\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Patient \u003cstrong>inconscient\u003c/strong>, 2,2 &lt; glycémie &lt; 3,3 mmol/l\u003c/td>\n\u003ctd>\u003cstrong>1 ampoule de G30 % IVD\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Patient \u003cstrong>conscient\u003c/strong>, glycémie &lt; 3,3 mmol/l (0,6 g/l)\u003c/td>\n\u003ctd>Sucre par voie orale : \u003cstrong>3 morceaux de sucre\u003c/strong> ou \u003cstrong>20 cl de jus de fruit\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Contrôle de la glycémie à \u003cstrong>15 min\u003c/strong> :\u003c/p>\n\u003cul>\n\u003cli>&lt; 3,3 mmol/l (0,6 g/l) → reprendre l’arbre décisionnel et prévenir le médecin\u003c/li>\n\u003cli>≥ 3,3 mmol/l (0,6 g/l) → contrôle de la glycémie à 1 heure\u003c/li>\n\u003c/ul>\n","x":"Agrandir Glycémie \u003c 3,3 mmol/l (0,6 g/l) Situation Resucrage Patient inconscient , glycémie \u003c 2,2 mmol/l (0,4 g/l) 2 ampoules de G30 % IVD Patient inconscient , 2,2 \u003c glycémie \u003c 3,3 mmol/l 1 ampoule de G30 % IVD Patient conscient , glycémie \u003c 3,3 mmol/l (0,6 g/l) Sucre par voie orale : 3 morceaux de sucre ou 20 cl de jus de fruit Contrôle de la glycémie à 15 min : \u003c 3,3 mmol/l (0,6 g/l) → reprendre l’arbre décisionnel et prévenir le médecin ≥ 3,3 mmol/l (0,6 g/l) → contrôle de la glycémie à 1 heure"},{"t":"Insulinothérapie IVSE","i":"syringe","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/diabete-ivse.webp\" data-legende=\"Protocole d’insulinothérapie IVSE\">\u003cimg src=\"figures/diabete-ivse.webp\" alt=\"Protocole d’insulinothérapie IVSE\" width=\"2339\" height=\"1343\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Protocole d’insulinothérapie IVSE\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>Objectifs glycémiques per-opératoires : \u003cstrong>5 – 10 mmol/l (0,9 – 1,8 g/l)\u003c/strong>\u003c/li>\n\u003cli>En unités de soins critiques ou au bloc opératoire \u003cstrong>seulement\u003c/strong>\u003c/li>\n\u003cli>Dilution : analogue rapide de l’insuline \u003cstrong>1 UI/ml\u003c/strong> dans du NaCl 0,9 %\u003c/li>\n\u003cli>Voie d’abord : robinet proximal sur KTC ou robinet proximal sur VVP\u003c/li>\n\u003cli>Apports glucosés au bloc (G10 % 40 ml/h), sauf si hyperglycémie &gt; 16,5 mmol/l\u003c/li>\n\u003cli>Kaliémie : objectif 4 à 4,5 mmol/l ; contrôle toutes les 4 h si stable, sinon à chaque changement de débit d’insuline\u003c/li>\n\u003cli>Privilégier les mesures de glycémie sur sang total (artériel ou veineux), si possible sur la machine à gaz du sang\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> Le tableau d’initiation et d’adaptation des débits (bolus, débit, fréquence des glycémies) est à lire sur la fiche ci-dessus. \u003cstrong>Pas de relais SC si insuline IVSE &gt; 4 UI/h.\u003c/strong> Pas d’insuline IVSE en salle d’hospitalisation conventionnelle.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Agrandir Objectifs glycémiques per-opératoires : 5 – 10 mmol/l (0,9 – 1,8 g/l) En unités de soins critiques ou au bloc opératoire seulement Dilution : analogue rapide de l’insuline 1 UI/ml dans du NaCl 0,9 % Voie d’abord : robinet proximal sur KTC ou robinet proximal sur VVP Apports glucosés au bloc (G10 % 40 ml/h), sauf si hyperglycémie > 16,5 mmol/l Kaliémie : objectif 4 à 4,5 mmol/l ; contrôle toutes les 4 h si stable, sinon à chaque changement de débit d’insuline Privilégier les mesures de glycémie sur sang total (artériel ou veineux), si possible sur la machine à gaz du sang Attention Le tableau d’initiation et d’adaptation des débits (bolus, débit, fréquence des glycémies) est à lire sur la fiche ci-dessus. Pas de relais SC si insuline IVSE > 4 UI/h. Pas d’insuline IVSE en salle d’hospitalisation conventionnelle."},{"t":"Relais insuline IVSE / SC","i":"syringe","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/diabete-relais.webp\" data-legende=\"Relais insuline IVSE / SC\">\u003cimg src=\"figures/diabete-relais.webp\" alt=\"Relais insuline IVSE / SC\" width=\"2339\" height=\"1342\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Relais insuline IVSE / SC\u003c/figcaption>\u003c/figure>\n\u003cp>\u003cstrong>Indications\u003c/strong> : glycémies stabilisées et ≤ 10 mmol/l (1,8 g/l) ; reprise d’une alimentation orale (mais ce n’est pas une condition) ; relais à l’arrêt de l’insuline IVSE si posologie ≤ 4 UI/h.\u003c/p>\n\u003cp>\u003cstrong>Contre-indications\u003c/strong> : posologie d’insuline IVSE &gt; 4 UI/h ; besoins en insuline non stabilisés. \u003cstrong>Pas de relais SC\u003c/strong> si posologie d’insuline IVSE ≤ 0,5 UI/h chez un patient non insulinotraité antérieurement.\u003c/p>\n\u003cp>\u003cstrong>Calcul de dose\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Quantité d’insuline inconnue : insuline lente SC en 1 fois le soir = \u003cstrong>0,3 UI/kg/24 h\u003c/strong> ; analogue rapide SC par repas = 0,3 UI/kg/24 h à diviser par 3\u003c/li>\n\u003cli>Ou, à partir de la quantité totale d’insuline IVSE sur 24 h : insuline lente SC en 1 fois le soir = \u003cstrong>½ dose IVSE / 24 h\u003c/strong> ; analogue rapide SC par repas = ½ dose IVSE / 24 h à diviser par 3\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Modalités\u003c/strong> : pas de délai entre l’arrêt de l’insuline IVSE et l’injection de l’insuline lente (faite en SSPI) ; l’insuline lente SC est prescrite de préférence à 20 h le soir ; sinon, injection complémentaire pour couvrir les besoins jusqu’à 20 h :\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Arrêt de l’insuline IVSE\u003c/th>\n\u003cth align=\"center\">Entre 0 h et 6 h\u003c/th>\n\u003cth align=\"center\">De 6 h à 14 h\u003c/th>\n\u003cth align=\"center\">Entre 14 h et 16 h\u003c/th>\n\u003cth align=\"center\">Entre 16 h et 0 h\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Dose d’insuline lente initiale\u003c/td>\n\u003ctd align=\"center\">¾ dose\u003c/td>\n\u003ctd align=\"center\">½ dose\u003c/td>\n\u003ctd align=\"center\">¼ dose\u003c/td>\n\u003ctd align=\"center\">Dose de 20 h\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dose d’insuline lente suivante\u003c/td>\n\u003ctd align=\"center\">À 20 h le soir même\u003c/td>\n\u003ctd align=\"center\">À 20 h le soir même\u003c/td>\n\u003ctd align=\"center\">À 20 h le soir même\u003c/td>\n\u003ctd align=\"center\">À 20 h le jour suivant\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n","x":"Agrandir Indications : glycémies stabilisées et ≤ 10 mmol/l (1,8 g/l) ; reprise d’une alimentation orale (mais ce n’est pas une condition) ; relais à l’arrêt de l’insuline IVSE si posologie ≤ 4 UI/h. Contre-indications : posologie d’insuline IVSE > 4 UI/h ; besoins en insuline non stabilisés. Pas de relais SC si posologie d’insuline IVSE ≤ 0,5 UI/h chez un patient non insulinotraité antérieurement. Calcul de dose Quantité d’insuline inconnue : insuline lente SC en 1 fois le soir = 0,3 UI/kg/24 h ; analogue rapide SC par repas = 0,3 UI/kg/24 h à diviser par 3 Ou, à partir de la quantité totale d’insuline IVSE sur 24 h : insuline lente SC en 1 fois le soir = ½ dose IVSE / 24 h ; analogue rapide SC par repas = ½ dose IVSE / 24 h à diviser par 3 Modalités : pas de délai entre l’arrêt de l’insuline IVSE et l’injection de l’insuline lente (faite en SSPI) ; l’insuline lente SC est prescrite de préférence à 20 h le soir ; sinon, injection complémentaire pour couvrir les besoins jusqu’à 20 h : Arrêt de l’insuline IVSE Entre 0 h et 6 h De 6 h à 14 h Entre 14 h et 16 h Entre 16 h et 0 h Dose d’insuline lente initiale ¾ dose ½ dose ¼ dose Dose de 20 h Dose d’insuline lente suivante À 20 h le soir même À 20 h le soir même À 20 h le soir même À 20 h le jour suivant"},{"t":"Insulinothérapie SC basal-bolus","i":"syringe","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/diabete-basal-bolus.webp\" data-legende=\"Protocole d’insulinothérapie SC de type basal-bolus\">\u003cimg src=\"figures/diabete-basal-bolus.webp\" alt=\"Protocole d’insulinothérapie SC de type basal-bolus\" width=\"2339\" height=\"1350\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Protocole d’insulinothérapie SC de type basal-bolus\u003c/figcaption>\u003c/figure>\n\u003col>\n\u003cli>\u003cstrong>Basal = insuline lente\u003c/strong> : 0,3 UI/kg/j SC à 20 h (ou dose habituelle, ou ½ dose IV des dernières 24 h ; 30 UI maximum à l’initiation). Adaptation selon la glycémie à jeun du matin suivant : &lt; 5 mmol/l (0,9 g/l) : − 2 UI ; 5 – 10 mmol/l : idem ; &gt; 10 mmol/l (1,8 g/l) : + 2 UI\u003c/li>\n\u003cli>\u003cstrong>Bolus pour le repas\u003c/strong> : analogue rapide SC avant chaque repas oral, quelle que soit la glycémie : 0,1 UI/kg SC. Moitié de la posologie si apports caloriques insuffisants. Ne pas faire si alimentation entérale ou parentérale continue\u003c/li>\n\u003cli>\u003cstrong>Bolus correcteur\u003c/strong> : analogue rapide SC selon la glycémie (à additionner au bolus du repas à 8 h, 12 h, 20 h) ; glycémies pré-prandiales à 8 h, 12 h, 20 h, et à 16 h, 0 h, 4 h si déséquilibre important\u003c/li>\n\u003c/ol>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Glycémie\u003c/th>\n\u003cth align=\"center\">&lt; 3,3 mmol/l (0,6 g/l)\u003c/th>\n\u003cth align=\"center\">3,3 – 5 (0,6 – 0,9)\u003c/th>\n\u003cth align=\"center\">5 – 10 (0,9 – 1,8)\u003c/th>\n\u003cth align=\"center\">10 – 12 (1,8 – 2,2)\u003c/th>\n\u003cth align=\"center\">12 – 16,5 (2,2 – 3)\u003c/th>\n\u003cth align=\"center\">&gt; 16,5 mmol/l (3 g/l)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Bolus correcteur\u003c/td>\n\u003ctd align=\"center\">1 amp. de G30 % IV ou 15 g de sucre PO\u003c/td>\n\u003ctd align=\"center\">0\u003c/td>\n\u003ctd align=\"center\">0\u003c/td>\n\u003ctd align=\"center\">3 UI SC\u003c/td>\n\u003ctd align=\"center\">4 UI SC\u003c/td>\n\u003ctd align=\"center\">6 UI SC\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n","x":"Agrandir Basal = insuline lente : 0,3 UI/kg/j SC à 20 h (ou dose habituelle, ou ½ dose IV des dernières 24 h ; 30 UI maximum à l’initiation). Adaptation selon la glycémie à jeun du matin suivant : \u003c 5 mmol/l (0,9 g/l) : − 2 UI ; 5 – 10 mmol/l : idem ; > 10 mmol/l (1,8 g/l) : + 2 UI Bolus pour le repas : analogue rapide SC avant chaque repas oral, quelle que soit la glycémie : 0,1 UI/kg SC. Moitié de la posologie si apports caloriques insuffisants. Ne pas faire si alimentation entérale ou parentérale continue Bolus correcteur : analogue rapide SC selon la glycémie (à additionner au bolus du repas à 8 h, 12 h, 20 h) ; glycémies pré-prandiales à 8 h, 12 h, 20 h, et à 16 h, 0 h, 4 h si déséquilibre important Glycémie \u003c 3,3 mmol/l (0,6 g/l) 3,3 – 5 (0,6 – 0,9) 5 – 10 (0,9 – 1,8) 10 – 12 (1,8 – 2,2) 12 – 16,5 (2,2 – 3) > 16,5 mmol/l (3 g/l) Bolus correcteur 1 amp. de G30 % IV ou 15 g de sucre PO 0 0 3 UI SC 4 UI SC 6 UI SC"},{"t":"Reprise des antidiabétiques chez le DT2","i":"file-text","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/diabete-reprise.webp\" data-legende=\"Modalités de reprise des traitements antidiabétiques chez le DT2\">\u003cimg src=\"figures/diabete-reprise.webp\" alt=\"Modalités de reprise des traitements antidiabétiques chez le DT2\" width=\"2339\" height=\"1342\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Modalités de reprise des traitements antidiabétiques chez le DT2\u003c/figcaption>\u003c/figure>\n\u003cp>Conditions préalables : \u003cstrong>alimentation orale suffisante\u003c/strong> et \u003cstrong>glycémie &lt; 12 mmol/l (2,2 g/l) depuis plus de 24 h\u003c/strong> — sinon, continuer et adapter le schéma basal-bolus.\u003c/p>\n\u003cp>\u003cstrong>Reprise des antidiabétiques non insuliniques selon la clairance de la créatinine\u003c/strong> (idéalement mesurée) :\u003c/p>\n\u003cul>\n\u003cli>&gt; 60 ml/min : reprise de tous les antidiabétiques\u003c/li>\n\u003cli>30 – 60 ml/min : reprise des antidiabétiques \u003cstrong>sauf la metformine\u003c/strong>\u003c/li>\n\u003cli>&lt; 30 ml/min : pas de reprise des antidiabétiques → appel de l’équipe d’endocrinologie avant la sortie\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Arrêt du schéma basal-bolus\u003c/strong> :\u003c/p>\n\u003cul>\n\u003cli>Pas d’insuline antérieurement : insuline lente ≥ 16 UI/j → continuer le basal-bolus (appel de l’équipe d’endocrinologie avant la sortie) ; insuline lente &lt; 16 UI/j → arrêter le basal-bolus\u003c/li>\n\u003cli>Insuline antérieurement : reprise des insulines antérieures\u003c/li>\n\u003c/ul>\n","x":"Agrandir Conditions préalables : alimentation orale suffisante et glycémie \u003c 12 mmol/l (2,2 g/l) depuis plus de 24 h — sinon, continuer et adapter le schéma basal-bolus. Reprise des antidiabétiques non insuliniques selon la clairance de la créatinine (idéalement mesurée) : > 60 ml/min : reprise de tous les antidiabétiques 30 – 60 ml/min : reprise des antidiabétiques sauf la metformine \u003c 30 ml/min : pas de reprise des antidiabétiques → appel de l’équipe d’endocrinologie avant la sortie Arrêt du schéma basal-bolus : Pas d’insuline antérieurement : insuline lente ≥ 16 UI/j → continuer le basal-bolus (appel de l’équipe d’endocrinologie avant la sortie) ; insuline lente \u003c 16 UI/j → arrêter le basal-bolus Insuline antérieurement : reprise des insulines antérieures"},{"t":"Chirurgie de courte durée","i":"clock","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/diabete-courte-duree.webp\" data-legende=\"Chirurgie de courte durée\">\u003cimg src=\"figures/diabete-courte-duree.webp\" alt=\"Chirurgie de courte durée\" width=\"2339\" height=\"1343\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Chirurgie de courte durée\u003c/figcaption>\u003c/figure>\n\u003cp>Rechercher les complications du diabète et doser l’HbA1c (\u003cstrong>différer la chirurgie si HbA1c &gt; 9 %\u003c/strong>).\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth align=\"center\">Repas jeûnés\u003c/th>\n\u003cth>Horaire prévisible\u003c/th>\n\u003cth>Attitude pratique\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd align=\"center\">0\u003c/td>\n\u003ctd>Quel que soit l’horaire\u003c/td>\n\u003ctd>Poursuite du traitement le matin\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">1\u003c/td>\n\u003ctd>Avant 10 h\u003c/td>\n\u003ctd>Petit-déjeuner et traitement du matin pris après l’intervention\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">1\u003c/td>\n\u003ctd>Entre 10 h et 12 h\u003c/td>\n\u003ctd>Pas de petit-déjeuner et traitement donné à l’arrivée. Perfusion de G10 % 40 ml/h jusqu’au repas suivant si insuline ou sulfamide\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">1\u003c/td>\n\u003ctd>Après 12 h\u003c/td>\n\u003ctd>Poursuite du traitement le matin avec prise d’un petit-déjeuner léger\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">2\u003c/td>\n\u003ctd>–\u003c/td>\n\u003ctd>Voir les fiches DT1 et DT2 — intervention mineure\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>En pré-, per- et post-opératoire : bolus correcteur si besoin (voir « Insulinothérapie SC basal-bolus »).\u003c/p>\n\u003cp>\u003cstrong>En post-opératoire\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Reprise d’une alimentation orale dès que possible\u003c/li>\n\u003cli>Glycémie ≤ 10 mmol/l (1,8 g/l) : reprendre les traitements habituels aux horaires habituels\u003c/li>\n\u003cli>Glycémie &gt; 10 mmol/l (1,8 g/l) : prolonger l’hospitalisation jusqu’à correction de la glycémie entre 5 et 10 mmol/l, avec injection de bolus correcteurs selon le protocole précédent\u003c/li>\n\u003cli>Glycémie &gt; 16,5 mmol/l (3 g/l) : contre-indication à une sortie à domicile et hospitalisation pour insulinothérapie IVSE\u003c/li>\n\u003c/ul>\n","x":"Agrandir Rechercher les complications du diabète et doser l’HbA1c ( différer la chirurgie si HbA1c > 9 % ). Repas jeûnés Horaire prévisible Attitude pratique 0 Quel que soit l’horaire Poursuite du traitement le matin 1 Avant 10 h Petit-déjeuner et traitement du matin pris après l’intervention 1 Entre 10 h et 12 h Pas de petit-déjeuner et traitement donné à l’arrivée. Perfusion de G10 % 40 ml/h jusqu’au repas suivant si insuline ou sulfamide 1 Après 12 h Poursuite du traitement le matin avec prise d’un petit-déjeuner léger 2 – Voir les fiches DT1 et DT2 — intervention mineure En pré-, per- et post-opératoire : bolus correcteur si besoin (voir « Insulinothérapie SC basal-bolus »). En post-opératoire Reprise d’une alimentation orale dès que possible Glycémie ≤ 10 mmol/l (1,8 g/l) : reprendre les traitements habituels aux horaires habituels Glycémie > 10 mmol/l (1,8 g/l) : prolonger l’hospitalisation jusqu’à correction de la glycémie entre 5 et 10 mmol/l, avec injection de bolus correcteurs selon le protocole précédent Glycémie > 16,5 mmol/l (3 g/l) : contre-indication à une sortie à domicile et hospitalisation pour insulinothérapie IVSE"}]}]}</script>
<script>
(() => {
  'use strict';
  const D = JSON.parse(document.getElementById('nar-data').textContent);
  const $ = (id) => document.getElementById(id);
  const vue = $('vue');
  const champ = $('q');
  const parId = new Map(D.protocoles.map((p) => [p.id, p]));
  const sectionDe = new Map(D.sections.map((s) => [s.id, s]));

  // ---------- Petits outils ----------
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ic = (nom, cls = '') => `<svg class="ic ${cls}" aria-hidden="true"><use href="#i-${nom}"/></svg>`;
  const norm = (s) => s.normalize('NFC').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[\u2019`]/g, "'").replace(/\u0153/g, 'oe');
  // Variante qui conserve la longueur du texte (pour surligner aux bonnes positions).
  const normLongueur = (s) => s.normalize('NFC').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[\u2019`]/g, "'");
  const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? 's' : ''}`;

  const memoire = {
    lire(cle, defaut) {
      try {
        const v = localStorage.getItem(cle);
        return v === null ? defaut : JSON.parse(v);
      } catch (e) {
        return defaut;
      }
    },
    ecrire(cle, valeur) {
      try {
        localStorage.setItem(cle, JSON.stringify(valeur));
      } catch (e) { /* stockage indisponible : l'appli fonctionne sans */ }
    },
  };
  let favoris = memoire.lire('nar-favoris', []).filter((id) => parId.has(id));
  let recents = memoire.lire('nar-recents', []).filter((id) => parId.has(id));

  let toastTimer = 0;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 1800);
  }

  // ---------- Index de recherche ----------
  const index = D.protocoles.map((p) => ({
    p,
    titre: norm(`${p.t} ${p.c}`),
    mots: norm(`${p.m} ${p.g} ${p.r}`),
    rub: p.k.map((k) => ({ titre: norm(k.t), texte: norm(k.x), brut: k.x.normalize('NFC') })),
  }));

  function chercher(requete) {
    const jetons = norm(requete).split(/[\s,;]+/).filter((j) => j.length >= 2 || /\d/.test(j));
    if (!jetons.length) return { jetons, liste: [] };
    const liste = [];
    for (const e of index) {
      let score = 0;
      let complet = true;
      const parRub = e.rub.map(() => 0);
      for (const j of jetons) {
        let vu = false;
        if (e.titre.includes(j)) { score += 12; vu = true; }
        if (e.mots.includes(j)) { score += 5; vu = true; }
        e.rub.forEach((r, i) => {
          if (r.titre.includes(j)) { score += 3; parRub[i] += 3; vu = true; }
          if (r.texte.includes(j)) { score += 1; parRub[i] += 1; vu = true; }
        });
        if (!vu) { complet = false; break; }
      }
      if (!complet) continue;
      const rubs = parRub
        .map((s, i) => ({ s, i }))
        .filter((r) => r.s > 0)
        .sort((a, b) => b.s - a.s || a.i - b.i)
        .slice(0, 3)
        .map(({ i }) => ({ i, extrait: extrait(e.rub[i], jetons) }));
      liste.push({ p: e.p, score, rubs });
    }
    liste.sort((a, b) => b.score - a.score);
    return { jetons, liste };
  }

  function extrait(rub, jetons) {
    let pos = -1;
    for (const j of jetons) {
      const i = rub.texte.indexOf(j);
      if (i >= 0 && (pos < 0 || i < pos)) pos = i;
    }
    if (pos < 0) pos = 0;
    let debut = Math.max(0, pos - 50);
    const esp = rub.brut.indexOf(' ', debut);
    if (debut > 0 && esp >= 0 && esp < pos) debut = esp + 1;
    const fin = Math.min(rub.brut.length, debut + 150);
    const brut = rub.brut.slice(debut, fin);
    const n = normLongueur(brut);
    // Surlignage : mêmes positions dans le texte normalisé et dans le texte d'origine.
    const marques = [];
    for (const j of jetons) {
      let i = 0;
      while ((i = n.indexOf(j, i)) >= 0) { marques.push([i, i + j.length]); i += j.length; }
    }
    marques.sort((a, b) => a[0] - b[0]);
    let html = '';
    let c = 0;
    for (const [a, b] of marques) {
      if (a < c) continue;
      html += `${esc(brut.slice(c, a))}<mark>${esc(brut.slice(a, b))}</mark>`;
      c = b;
    }
    html += esc(brut.slice(c));
    return `${debut > 0 ? '… ' : ''}${html}${fin < rub.brut.length ? ' …' : ''}`;
  }

  // ---------- Morceaux d'interface ----------
  function carte(p, options = {}) {
    const fav = favoris.includes(p.id) ? ic('star', 'carte-fav') : '';
    const sous = options.avecSection ? `${sectionDe.get(p.s).court} · ${p.g}` : p.r;
    return `<a class="carte s-${p.s}" href="#${p.id}"><span class="carte-ic">${ic(p.i)}</span><span class="carte-txt"><strong>${esc(p.t)}</strong><span>${esc(sous)}</span></span>${fav}${ic('chevron-right')}</a>`;
  }
  const puce = (p) => `<a class="puce s-${p.s}" href="#${p.id}">${ic(p.i)}${esc(p.c)}</a>`;

  function vueAccueil() {
    const portes = D.sections
      .map((s) => {
        const n = D.protocoles.filter((p) => p.s === s.id).length;
        return `<a class="porte porte-${s.id}" href="#${s.id}"><span class="porte-ic">${ic(s.id)}</span><div><h2>${esc(s.titre)}</h2><p>${esc(s.accroche)}</p></div><span class="porte-bas"><span>${pluriel(n, 'fiche')}</span>${ic('chevron-right')}</span></a>`;
      })
      .join('');
    const blocFav = favoris.length
      ? `<section class="bloc"><div class="bloc-titre"><h2>${ic('star')} Favoris</h2><span class="compte">${favoris.length}</span></div><div class="cartes">${favoris.map((id) => carte(parId.get(id), { avecSection: true })).join('')}</div></section>`
      : '';
    const blocRecents = recents.length
      ? `<section class="bloc"><div class="bloc-titre"><h2>${ic('history')} Consultés récemment</h2></div><div class="puces">${recents.map((id) => puce(parId.get(id))).join('')}</div></section>`
      : '';
    vue.className = 'vue';
    vue.innerHTML = `
      <section class="intro">
        <p class="eyebrow">${esc(D.meta.service)} · ${esc(D.meta.version)}</p>
        <h1>${esc(D.meta.titre)}</h1>
        <p>${esc(D.meta.sousTitre)} — ${pluriel(D.protocoles.length, 'fiche')}, recherche plein texte, pages du livret consultables.</p>
      </section>
      <nav class="portes" aria-label="Sections">${portes}</nav>
      ${blocFav}
      <section class="bloc"><div class="bloc-titre"><h2>${ic('zap')} Accès rapide</h2></div><div class="puces">${D.acces.map((id) => puce(parId.get(id))).join('')}</div></section>
      ${blocRecents}`;
    document.title = D.meta.titre;
  }

  function vueSection(s) {
    const fiches = D.protocoles.filter((p) => p.s === s.id);
    const groupes = s.groupes.map((g) => ({ g, fiches: fiches.filter((p) => p.g === g) })).filter((x) => x.fiches.length);
    vue.className = `vue s-${s.id}`;
    vue.innerHTML = `
      <div class="tete"><div class="tete-ic">${ic(s.id)}</div><div><h1>${esc(s.titre)}</h1><p>${pluriel(fiches.length, 'fiche')} · ${esc(s.accroche)}</p></div></div>
      <nav class="bascule" aria-label="Section">${D.sections.map((x) => `<a href="#${x.id}"${x.id === s.id ? ' aria-current="page"' : ''}>${esc(x.titre)}</a>`).join('')}</nav>
      <div class="puces" role="navigation" aria-label="Groupes">${groupes.map((x, i) => `<button type="button" class="puce" data-groupe="${i}">${esc(x.g)}</button>`).join('')}</div>
      ${groupes
        .map((x, i) => `<section class="bloc" data-bloc="${i}"><div class="bloc-titre"><h2>${esc(x.g)}</h2><span class="compte">${pluriel(x.fiches.length, 'fiche')}</span></div><div class="cartes">${x.fiches.map((p) => carte(p)).join('')}</div></section>`)
        .join('')}`;
    document.title = `${s.titre} · ${D.meta.titre}`;
  }

  const ouvertes = new Map(); // fiche -> rubriques dépliées (conservé pendant la session)
  let cibleRubrique = null; // { id, i } : rubrique à ouvrir en arrivant depuis la recherche

  function vueFiche(p) {
    const s = sectionDe.get(p.s);
    const memes = D.protocoles.filter((x) => x.s === p.s);
    const rang = memes.indexOf(p);
    const prec = memes[rang - 1];
    const suiv = memes[rang + 1];
    let etat = ouvertes.get(p.id);
    if (!etat) {
      etat = new Set(p.k.length <= 2 ? p.k.map((_, i) => i) : []);
      ouvertes.set(p.id, etat);
    }
    if (cibleRubrique && cibleRubrique.id === p.id) etat.add(cibleRubrique.i);
    const fav = favoris.includes(p.id);
    const plage = p.p.length > 1 ? `p. ${p.p[0]}–${p.p[p.p.length - 1]}` : `p. ${p.p[0]}`;
    vue.className = `vue s-${p.s}`;
    vue.innerHTML = `
      <nav class="fil" aria-label="Fil d’Ariane"><a href="#${s.id}">${esc(s.titre)}</a>${ic('chevron-right')}<span>${esc(p.g)}</span></nav>
      <header class="fiche-tete">
        <div class="fiche-titre"><span class="carte-ic">${ic(p.i)}</span><h1>${esc(p.t)}</h1></div>
        ${p.r ? `<p class="fiche-resume">${esc(p.r)}</p>` : ''}
        <div class="outils">
          <button type="button" class="outil" id="btn-fav" aria-pressed="${fav}">${ic('star')}<span>${fav ? 'Favori' : 'Ajouter aux favoris'}</span></button>
          ${p.k.length > 1 ? `<button type="button" class="outil" id="btn-tout">${ic('chevrons-up-down')}<span>Tout déplier</span></button>` : ''}
          <button type="button" class="outil" data-page="${p.p[0]}">${ic('book-open')}<span>Livret ${plage}</span></button>
        </div>
      </header>
      <div class="rubriques">
        ${p.k
          .map((k, i) => `<details class="rub" data-i="${i}"${etat.has(i) ? ' open' : ''}><summary><span class="rub-ic">${ic(k.i)}</span><span class="rub-titre">${esc(k.t)}</span>${ic('chevron-down', 'rub-chevron')}</summary><div class="rub-corps prose">${k.h}</div></details>`)
          .join('')}
      </div>
      <section class="bloc sources">
        <div class="bloc-titre"><h2>Pages du livret</h2><span class="compte">${esc(D.meta.version)}</span></div>
        <p>En cas de doute sur une valeur, ouvrir la page d’origine : c’est elle qui fait foi.</p>
        <div class="pages">${p.p.map((n) => `<button type="button" class="page-btn" data-page="${n}">p. ${n}</button>`).join('')}</div>
      </section>
      <nav class="voisins" aria-label="Fiches voisines">
        ${prec ? `<a class="voisin" href="#${prec.id}"><small>← Précédente</small><strong>${esc(prec.c)}</strong></a>` : ''}
        ${suiv ? `<a class="voisin suivant" href="#${suiv.id}"><small>Suivante →</small><strong>${esc(suiv.c)}</strong></a>` : ''}
      </nav>`;
    document.title = `${p.c} · ${D.meta.titre}`;
    majToutDeplier(p);
    recents = [p.id, ...recents.filter((id) => id !== p.id)].slice(0, 6);
    memoire.ecrire('nar-recents', recents);
  }

  function majToutDeplier(p) {
    const b = $('btn-tout');
    if (!b) return;
    const tout = ouvertes.get(p.id).size === p.k.length;
    b.dataset.tout = tout ? '1' : '';
    b.innerHTML = `${ic(tout ? 'chevrons-down-up' : 'chevrons-up-down')}<span>${tout ? 'Tout replier' : 'Tout déplier'}</span>`;
  }

  function vueRecherche() {
    const q = champ.value.trim();
    vue.className = 'vue';
    document.title = `Recherche · ${D.meta.titre}`;
    if (!q) {
      vue.innerHTML = `<div class="vide"><strong>Rechercher dans les ${D.protocoles.length} fiches</strong>Un médicament, un score, un sigle : « milrinone », « INR », « jeûne », « cell-index »…</div>`;
      return;
    }
    const { liste } = chercher(q);
    if (!liste.length) {
      vue.innerHTML = `<div class="bloc-titre"><h2>Aucun résultat pour « ${esc(q)} »</h2></div><div class="vide"><strong>Rien trouvé</strong>Essayer un autre terme ou un sigle (DCI plutôt que nom commercial, ou l’inverse).</div>`;
      return;
    }
    vue.innerHTML = `
      <div class="bloc-titre"><h2>${pluriel(liste.length, 'fiche')} pour « ${esc(q)} »</h2></div>
      <div class="resultats">${liste
        .map(({ p, rubs }) => `<div class="res s-${p.s}"><a class="res-tete" href="#${p.id}"><span class="carte-ic">${ic(p.i)}</span><div><strong>${esc(p.t)}</strong><small>${esc(sectionDe.get(p.s).titre)} · ${esc(p.g)}</small></div>${ic('chevron-right')}</a>${rubs
          .map((r) => `<a class="res-rub" href="#${p.id}" data-rub="${r.i}"><b>${esc(p.k[r.i].t)}</b><span>${r.extrait}</span></a>`)
          .join('')}</div>`)
        .join('')}</div>`;
  }

  // ---------- Navigation (une vue par #nom) ----------
  const defilement = new Map();
  let routeCourante = null;
  let parClic = false;
  let retourRecherche = 'accueil';

  const routeDe = () => decodeURIComponent(location.hash.replace(/^#/, '')) || 'accueil';

  function afficher() {
    const r = routeDe();
    const ancienne = routeCourante;
    routeCourante = r;
    const btn = $('nav-back');
    let retour = { href: '#accueil', icone: 'house', label: 'Accueil' };
    if (r === 'recherche') {
      vueRecherche();
      retour = { href: `#${retourRecherche}`, icone: 'arrow-left', label: 'Quitter la recherche' };
    } else if (sectionDe.has(r)) {
      vueSection(sectionDe.get(r));
    } else if (parId.has(r)) {
      const p = parId.get(r);
      vueFiche(p);
      retour = { href: `#${p.s}`, icone: 'arrow-left', label: `Retour à ${sectionDe.get(p.s).titre}` };
    } else {
      vueAccueil();
    }
    btn.setAttribute('href', retour.href);
    btn.setAttribute('aria-label', retour.label);
    btn.innerHTML = ic(retour.icone);

    const cible = cibleRubrique && cibleRubrique.id === r ? vue.querySelector(`.rub[data-i="${cibleRubrique.i}"]`) : null;
    cibleRubrique = null;
    if (cible) {
      cible.classList.add('cible');
      requestAnimationFrame(() => cible.scrollIntoView({ block: 'start' }));
      setTimeout(() => cible.classList.remove('cible'), 2200);
    } else if (parClic || ancienne === null) {
      window.scrollTo(0, 0);
    } else {
      const y = defilement.get(r) || 0;
      requestAnimationFrame(() => window.scrollTo(0, y));
    }
    parClic = false;
  }

  function aller(route) {
    parClic = true;
    if (routeDe() === route) afficher();
    else location.hash = route;
  }

  window.addEventListener('hashchange', afficher);
  let attenteDefilement = 0;
  window.addEventListener('scroll', () => {
    if (attenteDefilement) return;
    attenteDefilement = requestAnimationFrame(() => {
      attenteDefilement = 0;
      if (routeCourante) defilement.set(routeCourante, window.scrollY);
    });
  }, { passive: true });

  // ---------- Recherche ----------
  let minuterie = 0;
  function majRecherche() {
    $('q-clear').hidden = !champ.value;
    clearTimeout(minuterie);
    minuterie = setTimeout(() => {
      if (champ.value.trim()) {
        if (routeCourante !== 'recherche') {
          retourRecherche = routeCourante || 'accueil';
          aller('recherche');
        } else {
          vueRecherche();
          window.scrollTo(0, 0);
        }
      } else if (routeCourante === 'recherche') {
        aller(retourRecherche);
      }
    }, 110);
  }
  champ.addEventListener('input', majRecherche);
  $('search-form').addEventListener('submit', (e) => {
    e.preventDefault();
    champ.blur();
  });
  $('q-clear').addEventListener('click', () => {
    champ.value = '';
    majRecherche();
    champ.focus();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName) && $('lightbox').hidden) {
      e.preventDefault();
      champ.focus();
      champ.select();
    }
  });

  // ---------- Clics délégués ----------
  document.addEventListener('click', (e) => {
    const lien = e.target.closest('a[href^="#"]');
    if (lien) {
      parClic = true;
      const rub = lien.dataset.rub;
      const id = lien.getAttribute('href').slice(1);
      if (rub !== undefined) cibleRubrique = { id, i: Number(rub) };
      if (routeDe() === id) {
        e.preventDefault();
        afficher();
      }
      return;
    }
    const zoom = e.target.closest('[data-zoom]');
    if (zoom) return ouvrirImage(zoom.dataset.zoom, zoom.dataset.legende, null);
    const page = e.target.closest('[data-page]');
    if (page) return ouvrirPage(Number(page.dataset.page));
    const copie = e.target.closest('[data-copy]');
    if (copie) return copier(copie.dataset.copy);
    const groupe = e.target.closest('[data-groupe]');
    if (groupe) {
      const bloc = vue.querySelector(`[data-bloc="${groupe.dataset.groupe}"]`);
      if (bloc) bloc.scrollIntoView({ block: 'start', behavior: 'smooth' });
      return;
    }
    if (e.target.closest('#btn-fav')) return basculerFavori();
    if (e.target.closest('#btn-tout')) return toutDeplier();
  });

  vue.addEventListener('toggle', (e) => {
    const d = e.target;
    if (!d.classList || !d.classList.contains('rub')) return;
    const p = parId.get(routeCourante);
    if (!p) return;
    const etat = ouvertes.get(p.id);
    if (d.open) etat.add(Number(d.dataset.i));
    else etat.delete(Number(d.dataset.i));
    majToutDeplier(p);
  }, true);

  function basculerFavori() {
    const p = parId.get(routeCourante);
    if (!p) return;
    const etait = favoris.includes(p.id);
    favoris = etait ? favoris.filter((id) => id !== p.id) : [...favoris, p.id];
    memoire.ecrire('nar-favoris', favoris);
    const b = $('btn-fav');
    b.setAttribute('aria-pressed', String(!etait));
    b.querySelector('span').textContent = etait ? 'Ajouter aux favoris' : 'Favori';
    toast(etait ? 'Retiré des favoris' : 'Ajouté aux favoris');
  }

  function toutDeplier() {
    const p = parId.get(routeCourante);
    if (!p) return;
    const ouvrir = !$('btn-tout').dataset.tout;
    vue.querySelectorAll('.rub').forEach((d) => { d.open = ouvrir; });
    ouvertes.set(p.id, new Set(ouvrir ? p.k.map((_, i) => i) : []));
    majToutDeplier(p);
  }

  function copier(texte) {
    const ok = () => toast(`Copié : ${texte}`);
    try {
      navigator.clipboard.writeText(texte).then(ok, () => toast(texte));
    } catch (e) {
      toast(texte);
    }
  }

  // ---------- Visionneuse (figures et pages du livret) ----------
  const lb = $('lightbox');
  const lbImg = $('lb-img');
  const lbScroll = $('lb-scroll');
  const ZOOMS = [0, 1, 1.6, 2.4, 3.4]; // 0 = image entière à l'écran
  let lbZoom = 1;
  let lbPage = null;
  let lbHistorique = false;
  let lbFocus = null;

  function reglerZoom(z) {
    lbZoom = Math.max(0, Math.min(ZOOMS.length - 1, z));
    lbScroll.classList.toggle('ajuste', lbZoom === 0);
    lbScroll.style.setProperty('--zoom', ZOOMS[lbZoom] || 1);
    $('lb-moins').disabled = lbZoom === 0;
    $('lb-plus').disabled = lbZoom === ZOOMS.length - 1;
  }

  function ouvrirImage(src, titre, page) {
    lbPage = page;
    lbImg.src = src;
    lbImg.alt = titre || '';
    $('lb-titre').textContent = titre || '';
    $('lb-prev').hidden = $('lb-next').hidden = page === null;
    if (page !== null) {
      $('lb-prev').disabled = page <= 1;
      $('lb-next').disabled = page >= D.meta.pagesLivret;
    }
    lbScroll.scrollTo(0, 0);
    if (lb.hidden) {
      lbFocus = document.activeElement;
      reglerZoom(window.innerWidth >= 760 ? 0 : 1);
      lb.hidden = false;
      document.body.classList.add('sans-defilement');
      try {
        history.pushState({ narVisionneuse: true }, '');
        lbHistorique = true;
      } catch (e) {
        lbHistorique = false;
      }
      $('lb-fermer').focus();
    }
  }
  const ouvrirPage = (n) => ouvrirImage(`pages/p-${String(n).padStart(3, '0')}.webp`, `Livret original — page ${n} / ${D.meta.pagesLivret}`, n);

  function masquer() {
    if (lb.hidden) return;
    lb.hidden = true;
    lbImg.removeAttribute('src');
    document.body.classList.remove('sans-defilement');
    if (lbFocus && lbFocus.focus) lbFocus.focus({ preventScroll: true });
  }
  function fermer() {
    if (lbHistorique) {
      lbHistorique = false;
      history.back(); // « popstate » masquera la visionneuse
    } else masquer();
  }
  window.addEventListener('popstate', () => {
    lbHistorique = false;
    masquer();
  });
  $('lb-fermer').addEventListener('click', fermer);
  $('lb-plus').addEventListener('click', () => reglerZoom(lbZoom + 1));
  $('lb-moins').addEventListener('click', () => reglerZoom(lbZoom - 1));
  $('lb-prev').addEventListener('click', () => lbPage > 1 && ouvrirPage(lbPage - 1));
  $('lb-next').addEventListener('click', () => lbPage < D.meta.pagesLivret && ouvrirPage(lbPage + 1));
  lbScroll.addEventListener('click', (e) => { if (e.target === lbScroll) fermer(); });
  document.addEventListener('keydown', (e) => {
    if (lb.hidden) return;
    if (e.key === 'Escape') fermer();
    else if (e.key === '+' || e.key === '=') reglerZoom(lbZoom + 1);
    else if (e.key === '-') reglerZoom(lbZoom - 1);
    else if (e.key === 'ArrowLeft' && lbPage > 1) ouvrirPage(lbPage - 1);
    else if (e.key === 'ArrowRight' && lbPage !== null && lbPage < D.meta.pagesLivret) ouvrirPage(lbPage + 1);
  });

  // ---------- Thème ----------
  const racine = document.documentElement;
  const estSombre = () => (racine.dataset.theme ? racine.dataset.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches);
  const majTheme = () => $('theme-ic').setAttribute('href', estSombre() ? '#i-sun' : '#i-moon');
  const themeChoisi = memoire.lire('nar-theme', null);
  if ((themeChoisi === 'dark' || themeChoisi === 'light') && !racine.dataset.theme) racine.dataset.theme = themeChoisi;
  $('theme').addEventListener('click', () => {
    const suivant = estSombre() ? 'light' : 'dark';
    racine.dataset.theme = suivant;
    memoire.ecrire('nar-theme', suivant);
    majTheme();
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', majTheme);
  new MutationObserver(majTheme).observe(racine, { attributes: true, attributeFilter: ['data-theme'] });
  majTheme();

  // ---------- Démarrage ----------
  $('pied-preambule').textContent = D.meta.preambule;
  $('pied-meta').textContent = `${D.meta.service} · ${D.meta.version} · application générée le ${D.meta.genere}`;
  afficher();

  // Hors-ligne : uniquement pour le site autonome (pas dans un cadre intégré).
  let autonome = false;
  try { autonome = window.top === window; } catch (e) { autonome = false; }
  if (autonome && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
})();

</script>
</body>
</html>
