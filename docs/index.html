 discuter en fonction du terrain et du degré d’urgence de la chirurgie."},{"t":"Patient coronarien","i":"file-text","h":"\u003cul>\n\u003cli>ECG ≤ 1 an (ou plus récent si modification clinique dans l’année) + ECG post-opératoire J1 – J2 – J3\u003c/li>\n\u003cli>Troponine ≤ 2 mois + post-opératoire J1 – J2 – J3 (à discuter au cas par cas)\u003c/li>\n\u003cli>NFS ≤ 2 mois\u003c/li>\n\u003c/ul>\n\u003cp>Voir \u003ca class=\"xref\" href=\"#anesth-coronarien\">Patient coronarien\u003c/a>.\u003c/p>\n","x":"ECG ≤ 1 an (ou plus récent si modification clinique dans l’année) + ECG post-opératoire J1 – J2 – J3 Troponine ≤ 2 mois + post-opératoire J1 – J2 – J3 (à discuter au cas par cas) NFS ≤ 2 mois Voir Patient coronarien ."},{"t":"Patient diabétique","i":"file-text","h":"\u003cul>\n\u003cli>Ionogramme sanguin, urée, créatinine\u003c/li>\n\u003cli>HbA1c\u003c/li>\n\u003cli>ECG\u003c/li>\n\u003c/ul>\n\u003cp>Voir \u003ca class=\"xref\" href=\"#anesth-diabete\">Diabète péri-opératoire\u003c/a>.\u003c/p>\n","x":"Ionogramme sanguin, urée, créatinine HbA1c ECG Voir Diabète péri-opératoire ."}]},{"id":"anesth-coronarien","s":"anesth","t":"Patient coronarien","c":"Patient coronarien","g":"Évaluation pré-opératoire","i":"heart","p":[72,73],"r":"Score de Lee, capacité à l’effort (MET), algorithme de prise en charge en chirurgie non cardiaque.","m":"coronarien, score de Lee, MET, Duke, capacité fonctionnelle, test d’ischémie, revascularisation, risque cardiaque","k":[{"t":"Références","i":"book-marked","h":"\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://sfar.org/prise-en-charge-du-coronarien-opere-en-chirurgie-non-cardiaque\" target=\"_blank\" rel=\"noopener noreferrer\">RFE SFAR 2011 : prise en charge du coronarien opéré en chirurgie non cardiaque\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://sfar.org/evaluation-preoperatoire-du-risque-cardiaque-en-chirurgie-non-cardiaque-six-regles-raisonnables-et-pragmatiques-en-2024\" target=\"_blank\" rel=\"noopener noreferrer\">SFAR 2024 : évaluation pré-opératoire du risque cardiaque en chirurgie non cardiaque, six règles raisonnables et pragmatiques\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"RFE SFAR 2011 : prise en charge du coronarien opéré en chirurgie non cardiaque SFAR 2024 : évaluation pré-opératoire du risque cardiaque en chirurgie non cardiaque, six règles raisonnables et pragmatiques"},{"t":"Score de risque cardiaque de Lee","i":"list-ordered","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Facteur de risque\u003c/th>\n\u003cth align=\"center\">Lee classique\u003c/th>\n\u003cth align=\"center\">Lee clinique\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003cstrong>Chirurgie à haut risque\u003c/strong> : chirurgie vasculaire supra-inguinale, intrathoracique ou intrapéritonéale\u003c/td>\n\u003ctd align=\"center\">1 point\u003c/td>\n\u003ctd align=\"center\">–\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Coronaropathie\u003c/strong> : antécédent d’infarctus du myocarde, angor clinique, utilisation de nitrés, onde Q sur l’ECG ou test non invasif de la circulation coronaire positif\u003c/td>\n\u003ctd align=\"center\">1 point\u003c/td>\n\u003ctd align=\"center\">1 point\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Insuffisance cardiaque\u003c/strong> : antécédent d’insuffisance cardiaque congestive, d’œdème pulmonaire, dyspnée nocturne paroxystique, crépitants bilatéraux ou galop B3, ou redistribution vasculaire radiologique\u003c/td>\n\u003ctd align=\"center\">1 point\u003c/td>\n\u003ctd align=\"center\">1 point\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Antécédent d’AVC ischémique\u003c/strong> ou d’accident ischémique transitoire\u003c/td>\n\u003ctd align=\"center\">1 point\u003c/td>\n\u003ctd align=\"center\">1 point\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Diabète avec insulinothérapie\u003c/strong>\u003c/td>\n\u003ctd align=\"center\">1 point\u003c/td>\n\u003ctd align=\"center\">1 point\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Insuffisance rénale chronique\u003c/strong> : créatinine &gt; 2,0 mg/dl (177 µmol/l)\u003c/td>\n\u003ctd align=\"center\">1 point\u003c/td>\n\u003ctd align=\"center\">1 point\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>Le score de risque \u003cstrong>clinique\u003c/strong> ne prend en compte que les facteurs liés au patient, à l’exclusion de la nature de la chirurgie.\u003c/p>\n","x":"Facteur de risque Lee classique Lee clinique Chirurgie à haut risque : chirurgie vasculaire supra-inguinale, intrathoracique ou intrapéritonéale 1 point – Coronaropathie : antécédent d’infarctus du myocarde, angor clinique, utilisation de nitrés, onde Q sur l’ECG ou test non invasif de la circulation coronaire positif 1 point 1 point Insuffisance cardiaque : antécédent d’insuffisance cardiaque congestive, d’œdème pulmonaire, dyspnée nocturne paroxystique, crépitants bilatéraux ou galop B3, ou redistribution vasculaire radiologique 1 point 1 point Antécédent d’AVC ischémique ou d’accident ischémique transitoire 1 point 1 point Diabète avec insulinothérapie 1 point 1 point Insuffisance rénale chronique : créatinine > 2,0 mg/dl (177 µmol/l) 1 point 1 point Le score de risque clinique ne prend en compte que les facteurs liés au patient, à l’exclusion de la nature de la chirurgie."},{"t":"Capacité à l’effort","i":"file-text","h":"\u003cp>Estimation de la capacité à l’effort (adaptée de l’échelle de Duke).\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Aptitude physique\u003c/th>\n\u003cth align=\"center\">MET\u003c/th>\n\u003cth align=\"center\">VO2 estimée (ml/kg/min)\u003c/th>\n\u003cth>Activité physique réalisable sans symptôme\u003c/th>\n\u003cth>Risque chirurgical estimé\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Excellente\u003c/td>\n\u003ctd align=\"center\">&gt; 10\u003c/td>\n\u003ctd align=\"center\">&gt; 35\u003c/td>\n\u003ctd>Natation, tennis de table, ski de fond, athlétisme, baseball\u003c/td>\n\u003ctd>Faible\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Très bonne à bonne\u003c/td>\n\u003ctd align=\"center\">7 – 10\u003c/td>\n\u003ctd align=\"center\">24,5 – 35,0\u003c/td>\n\u003ctd>Jouer au tennis en double, au football ; danser ; gros travaux d’entretien dans la maison ; courir sur une courte distance ; monter en haut d’une colline ; monter 2 étages ou plus ; marcher rapidement sur terrain plat\u003c/td>\n\u003ctd>Faible\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Modérée\u003c/td>\n\u003ctd align=\"center\">4 – 7\u003c/td>\n\u003ctd align=\"center\">14,0 – 24,5\u003c/td>\n\u003ctd>Monter 1 à 2 étages ; faire du ménage\u003c/td>\n\u003ctd>Faible\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Faible\u003c/td>\n\u003ctd align=\"center\">&lt; 4\u003c/td>\n\u003ctd align=\"center\">&lt; 14\u003c/td>\n\u003ctd>Marcher sur terrain plat à 3 – 5 km/h ; marcher à l’intérieur de son domicile ; faire sa toilette, s’habiller, manger\u003c/td>\n\u003ctd>Intermédiaire à élevé\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Non évaluable\u003c/td>\n\u003ctd align=\"center\">?\u003c/td>\n\u003ctd align=\"center\">?\u003c/td>\n\u003ctd>Aucune\u003c/td>\n\u003ctd>Intermédiaire à élevé\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n","x":"Estimation de la capacité à l’effort (adaptée de l’échelle de Duke). Aptitude physique MET VO2 estimée (ml/kg/min) Activité physique réalisable sans symptôme Risque chirurgical estimé Excellente > 10 > 35 Natation, tennis de table, ski de fond, athlétisme, baseball Faible Très bonne à bonne 7 – 10 24,5 – 35,0 Jouer au tennis en double, au football ; danser ; gros travaux d’entretien dans la maison ; courir sur une courte distance ; monter en haut d’une colline ; monter 2 étages ou plus ; marcher rapidement sur terrain plat Faible Modérée 4 – 7 14,0 – 24,5 Monter 1 à 2 étages ; faire du ménage Faible Faible \u003c 4 \u003c 14 Marcher sur terrain plat à 3 – 5 km/h ; marcher à l’intérieur de son domicile ; faire sa toilette, s’habiller, manger Intermédiaire à élevé Non évaluable ? ? Aucune Intermédiaire à élevé"},{"t":"Algorithme général","i":"workflow","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/coronarien-algo.webp\" data-legende=\"Figure 1 : Algorithme général de prise en charge du patient coronarien en chirurgie non cardiaque\">\u003cimg src=\"figures/coronarien-algo.webp\" alt=\"Figure 1 : Algorithme général de prise en charge du patient coronarien en chirurgie non cardiaque\" width=\"1302\" height=\"1379\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Figure 1 : Algorithme général de prise en charge du patient coronarien en chirurgie non cardiaque\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>\u003cstrong>Chirurgie urgente\u003c/strong> → chirurgie sans examen spécialisé, optimisation du traitement médical pré-opératoire\u003c/li>\n\u003cli>\u003cstrong>Chirurgie non urgente à bas risque\u003c/strong>, patient stable → chirurgie sans examen spécialisé\u003c/li>\n\u003cli>\u003cstrong>Patient instable\u003c/strong> → retarder la chirurgie, discussion collégiale, traitements spécifiques\u003c/li>\n\u003cli>\u003cstrong>Chirurgie à risque intermédiaire ou élevé, patient stable\u003c/strong> :\u003cul>\n\u003cli>score de Lee clinique 0 – 1 (chirurgie vasculaire) ou 0 – 2 (non vasculaire) → chirurgie sans examen spécialisé\u003c/li>\n\u003cli>score de Lee ≥ 2 (vasculaire) ou ≥ 3 (non vasculaire) → évaluer la \u003cstrong>capacité fonctionnelle (MET)\u003c/strong> : bonne → chirurgie ; mauvaise → \u003cstrong>test d’ischémie\u003c/strong>\u003c/li>\n\u003cli>test d’ischémie positif → discuter l’opportunité d’une éventuelle revascularisation, traitement médical optimisé, surveillance per- et post-opératoire rapprochée\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n","x":"Agrandir Chirurgie urgente → chirurgie sans examen spécialisé, optimisation du traitement médical pré-opératoire Chirurgie non urgente à bas risque , patient stable → chirurgie sans examen spécialisé Patient instable → retarder la chirurgie, discussion collégiale, traitements spécifiques Chirurgie à risque intermédiaire ou élevé, patient stable : score de Lee clinique 0 – 1 (chirurgie vasculaire) ou 0 – 2 (non vasculaire) → chirurgie sans examen spécialisé score de Lee ≥ 2 (vasculaire) ou ≥ 3 (non vasculaire) → évaluer la capacité fonctionnelle (MET) : bonne → chirurgie ; mauvaise → test d’ischémie test d’ischémie positif → discuter l’opportunité d’une éventuelle revascularisation, traitement médical optimisé, surveillance per- et post-opératoire rapprochée"},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1093/eurheartj/ehac270\" target=\"_blank\" rel=\"noopener noreferrer\">ESC 2022 : Guidelines on cardiovascular assessment and management of patients undergoing non-cardiac surgery (Eur Heart J)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1161/01.CIR.100.10.1043\" target=\"_blank\" rel=\"noopener noreferrer\">Lee TH et al. Derivation and prospective validation of a simple index for prediction of cardiac risk of major noncardiac surgery (Circulation 1999)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. ESC 2022 : Guidelines on cardiovascular assessment and management of patients undergoing non-cardiac surgery (Eur Heart J) Lee TH et al. Derivation and prospective validation of a simple index for prediction of cardiac risk of major noncardiac surgery (Circulation 1999)"}]},{"id":"anesth-asa","s":"anesth","t":"Classification ASA","c":"Score ASA","g":"Évaluation pré-opératoire","i":"list-ordered","p":[82],"r":"Définitions ASA I à VI avec exemples adultes, pédiatriques et obstétricaux.","m":"ASA, physical status, classification, score, risque anesthésique","k":[{"t":"Classification ASA Physical Status","i":"list-ordered","h":"\u003cp>Source : \u003ca class=\"ext\" href=\"https://www.asahq.org/standards-and-guidelines/asa-physical-status-classification-system\" target=\"_blank\" rel=\"noopener noreferrer\">ASA Physical Status Classification System (asahq.org)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>. Tableau en anglais dans le livret, conservé tel quel.\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable class=\"dense\">\n\u003cthead>\u003ctr>\u003cth>Classe\u003c/th>\u003cth>Definition\u003c/th>\u003cth>Adult examples, including but not limited to\u003c/th>\u003cth>Pediatric examples, including but not limited to\u003c/th>\u003cth>Obstetric examples, including but not limited to\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003cth>ASA I\u003c/th>\u003ctd>A normal healthy patient\u003c/td>\u003ctd>Healthy, non-smoking, no or minimal alcohol use.\u003c/td>\u003ctd>Healthy (no acute or chronic disease), normal BMI percentile for age.\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>ASA II\u003c/th>\u003ctd>A patient with mild systemic disease\u003c/td>\u003ctd>Mild diseases only without substantive functional limitations. Current smoker, social alcohol drinker, pregnancy, obesity (30 &lt; BMI &lt; 40), well-controlled DM/HTN, mild lung disease.\u003c/td>\u003ctd>Asymptomatic congenital cardiac disease, well controlled dysrhythmias, asthma without exacerbation, well controlled epilepsy, non-insulin dependent diabetes mellitus, abnormal BMI percentile for age, mild/moderate OSA, oncologic state in remission, autism with mild limitations.\u003c/td>\u003ctd>Normal pregnancy*, well controlled gestational HTN, controlled preeclampsia without severe features, diet-controlled gestational DM.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>ASA III\u003c/th>\u003ctd>A patient with severe systemic disease\u003c/td>\u003ctd>Substantive functional limitations; one or more moderate to severe diseases. Poorly controlled DM or HTN, COPD, morbid obesity (BMI ≥ 40), active hepatitis, alcohol dependence or abuse, implanted pacemaker, moderate reduction of ejection fraction, ESRD undergoing regularly scheduled dialysis, history (&gt; 3 months) of MI, CVA, TIA, or CAD/stents.\u003c/td>\u003ctd>Uncorrected stable congenital cardiac abnormality, asthma with exacerbation, poorly controlled epilepsy, insulin dependent diabetes mellitus, morbid obesity, malnutrition, severe OSA, oncologic state, renal failure, muscular dystrophy, cystic fibrosis, history of organ transplantation, brain/spinal cord malformation, symptomatic hydrocephalus, premature infant PCA &lt; 60 weeks, autism with severe limitations, metabolic disease, difficult airway, long term parenteral nutrition. Full term infants &lt; 6 weeks of age.\u003c/td>\u003ctd>Preeclampsia with severe features, gestational DM with complications or high insulin requirements, a thrombophilic disease requiring anticoagulation.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>ASA IV\u003c/th>\u003ctd>A patient with severe systemic disease that is a constant threat to life\u003c/td>\u003ctd>Recent (&lt; 3 months) MI, CVA, TIA or CAD/stents, ongoing cardiac ischemia or severe valve dysfunction, severe reduction of ejection fraction, shock, sepsis, DIC, ARD or ESRD not undergoing regularly scheduled dialysis.\u003c/td>\u003ctd>Symptomatic congenital cardiac abnormality, congestive heart failure, active sequelae of prematurity, acute hypoxic-ischemic encephalopathy, shock, sepsis, disseminated intravascular coagulation, automatic implantable cardioverter-defibrillator, ventilator dependence, endocrinopathy, severe trauma, severe respiratory distress, advanced oncologic state.\u003c/td>\u003ctd>Preeclampsia with severe features complicated by HELLP or other adverse event, peripartum cardiomyopathy with EF &lt; 40, uncorrected/decompensated heart disease, acquired or congenital.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>ASA V\u003c/th>\u003ctd>A moribund patient who is not expected to survive without the operation\u003c/td>\u003ctd>Ruptured abdominal/thoracic aneurysm, massive trauma, intracranial bleed with mass effect, ischemic bowel in the face of significant cardiac pathology or multiple organ/system dysfunction.\u003c/td>\u003ctd>Massive trauma, intracranial hemorrhage with mass effect, patient requiring ECMO, respiratory failure or arrest, malignant hypertension, decompensated congestive heart failure, hepatic encephalopathy, ischemic bowel or multiple organ/system dysfunction.\u003c/td>\u003ctd>Uterine rupture.\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>ASA VI\u003c/th>\u003ctd>A declared brain-dead patient whose organs are being removed for donor purposes\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\n\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> En consultation : relecture par le MAR sénior de tous les dossiers \u003cstrong>ASA ≥ 3\u003c/strong> — voir \u003ca class=\"xref\" href=\"#anesth-cpa\">Consultation pré-anesthésie\u003c/a>.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Source : ASA Physical Status Classification System (asahq.org) . Tableau en anglais dans le livret, conservé tel quel. Classe Definition Adult examples, including but not limited to Pediatric examples, including but not limited to Obstetric examples, including but not limited to ASA I A normal healthy patient Healthy, non-smoking, no or minimal alcohol use. Healthy (no acute or chronic disease), normal BMI percentile for age. ASA II A patient with mild systemic disease Mild diseases only without substantive functional limitations. Current smoker, social alcohol drinker, pregnancy, obesity (30 \u003c BMI \u003c 40), well-controlled DM/HTN, mild lung disease. Asymptomatic congenital cardiac disease, well controlled dysrhythmias, asthma without exacerbation, well controlled epilepsy, non-insulin dependent diabetes mellitus, abnormal BMI percentile for age, mild/moderate OSA, oncologic state in remission, autism with mild limitations. Normal pregnancy*, well controlled gestational HTN, controlled preeclampsia without severe features, diet-controlled gestational DM. ASA III A patient with severe systemic disease Substantive functional limitations; one or more moderate to severe diseases. Poorly controlled DM or HTN, COPD, morbid obesity (BMI ≥ 40), active hepatitis, alcohol dependence or abuse, implanted pacemaker, moderate reduction of ejection fraction, ESRD undergoing regularly scheduled dialysis, history (> 3 months) of MI, CVA, TIA, or CAD/stents. Uncorrected stable congenital cardiac abnormality, asthma with exacerbation, poorly controlled epilepsy, insulin dependent diabetes mellitus, morbid obesity, malnutrition, severe OSA, oncologic state, renal failure, muscular dystrophy, cystic fibrosis, history of organ transplantation, brain/spinal cord malformation, symptomatic hydrocephalus, premature infant PCA \u003c 60 weeks, autism with severe limitations, metabolic disease, difficult airway, long term parenteral nutrition. Full term infants \u003c 6 weeks of age. Preeclampsia with severe features, gestational DM with complications or high insulin requirements, a thrombophilic disease requiring anticoagulation. ASA IV A patient with severe systemic disease that is a constant threat to life Recent (\u003c 3 months) MI, CVA, TIA or CAD/stents, ongoing cardiac ischemia or severe valve dysfunction, severe reduction of ejection fraction, shock, sepsis, DIC, ARD or ESRD not undergoing regularly scheduled dialysis. Symptomatic congenital cardiac abnormality, congestive heart failure, active sequelae of prematurity, acute hypoxic-ischemic encephalopathy, shock, sepsis, disseminated intravascular coagulation, automatic implantable cardioverter-defibrillator, ventilator dependence, endocrinopathy, severe trauma, severe respiratory distress, advanced oncologic state. Preeclampsia with severe features complicated by HELLP or other adverse event, peripartum cardiomyopathy with EF \u003c 40, uncorrected/decompensated heart disease, acquired or congenital. ASA V A moribund patient who is not expected to survive without the operation Ruptured abdominal/thoracic aneurysm, massive trauma, intracranial bleed with mass effect, ischemic bowel in the face of significant cardiac pathology or multiple organ/system dysfunction. Massive trauma, intracranial hemorrhage with mass effect, patient requiring ECMO, respiratory failure or arrest, malignant hypertension, decompensated congestive heart failure, hepatic encephalopathy, ischemic bowel or multiple organ/system dysfunction. Uterine rupture. ASA VI A declared brain-dead patient whose organs are being removed for donor purposes Important En consultation : relecture par le MAR sénior de tous les dossiers ASA ≥ 3 — voir Consultation pré-anesthésie ."}]},{"id":"anesth-ttt-cardio","s":"anesth","t":"Traitements à visée cardiaque ou anti-hypertensive","c":"Traitements cardiologiques","g":"Gestion des traitements","i":"heart-pulse","p":[74],"r":"Maintien ou arrêt pré-opératoire des bêtabloquants, IEC/ARA II, diurétiques, anti-arythmiques.","m":"bêtabloquant, statine, IEC, ARA II, sartan, inhibiteur calcique, diurétique, anti-arythmique, flécaïne, sotalol, amiodarone, arrêt pré-opératoire","k":[{"t":"Maintien ou arrêt pré-opératoire","i":"shield-check","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Traitement\u003c/th>\u003cth>Maintien\u003c/th>\u003cth>Dernière prise\u003c/th>\u003cth>Reprise\u003c/th>\u003cth>Commentaires\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003cth>Bêtabloquants\u003c/th>\u003ctd class=\"yes\">Oui\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Statines – hypolipémiants\u003c/th>\u003ctd class=\"yes\">Oui\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>IEC – ARA II (visée insuffisance cardiaque)\u003c/th>\u003ctd class=\"yes\">Oui\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>IEC – ARA II (visée anti-HTA)\u003c/th>\u003ctd class=\"no\">Non\u003c/td>\u003ctd>H-24\u003c/td>\u003ctd>J0 soir\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Inhibiteurs calciques\u003c/th>\u003ctd class=\"yes\">Oui\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Diurétiques\u003c/th>\u003ctd class=\"no\">Non\u003c/td>\u003ctd>H-12\u003c/td>\u003ctd>J1\u003c/td>\u003ctd>Kaliémie à prescrire lors de la CPA\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Anti-arythmiques — classe 1 (Flécaïne®)\u003c/th>\u003ctd class=\"no\">Non\u003c/td>\u003ctd rowspan=\"4\">H-24\u003c/td>\u003ctd rowspan=\"4\">J1\u003c/td>\u003ctd rowspan=\"4\">\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Anti-arythmiques — classe 2 (bêtabloquants)\u003c/th>\u003ctd class=\"yes\">Oui\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Anti-arythmiques — sotalol\u003c/th>\u003ctd class=\"yes\">Oui\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Anti-arythmiques — classe 3 (amiodarone)\u003c/th>\u003ctd class=\"yes\">Oui\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Dans le livret, « H-24 / J1 » figure dans une cellule commune à l’ensemble des anti-arythmiques ; ils s’appliquent logiquement au traitement \u003cstrong>non maintenu\u003c/strong> (classe 1) — interprétation à confirmer sur la page originale.\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003cp>Voir aussi : \u003ca class=\"xref\" href=\"#anesth-antithrombotiques\">Antiagrégants et anticoagulants\u003c/a>, \u003ca class=\"xref\" href=\"#anesth-ttt-antidiabetiques\">Traitements antidiabétiques\u003c/a>.\u003c/p>\n","x":"Traitement Maintien Dernière prise Reprise Commentaires Bêtabloquants Oui Statines – hypolipémiants Oui IEC – ARA II (visée insuffisance cardiaque) Oui IEC – ARA II (visée anti-HTA) Non H-24 J0 soir Inhibiteurs calciques Oui Diurétiques Non H-12 J1 Kaliémie à prescrire lors de la CPA Anti-arythmiques — classe 1 (Flécaïne®) Non H-24 J1 Anti-arythmiques — classe 2 (bêtabloquants) Oui Anti-arythmiques — sotalol Oui Anti-arythmiques — classe 3 (amiodarone) Oui Note Dans le livret, « H-24 / J1 » figure dans une cellule commune à l’ensemble des anti-arythmiques ; ils s’appliquent logiquement au traitement non maintenu (classe 1) — interprétation à confirmer sur la page originale. Voir aussi : Antiagrégants et anticoagulants , Traitements antidiabétiques ."}]},{"id":"anesth-antithrombotiques","s":"anesth","t":"Antiagrégants et anticoagulants","c":"Antiagrégants et anticoagulants","g":"Gestion des traitements","i":"droplets","p":[75,76,77,78],"r":"Délais d’arrêt, relais des AVK, CHA2DS2-VASc, antagonisation en urgence (AAP, AVK, AOD, héparines).","m":"antiagrégant, anticoagulant, aspirine, Kardegic, clopidogrel, Plavix, ticagrelor, Brilique, prasugrel, AVK, INR, rivaroxaban, apixaban, dabigatran, héparine, HBPM, Lovenox, relais, vitamine K, CCP, Kanokad, FEIBA, idarucizumab, Praxbind, andexanet, protamine, antagonisation","k":[{"t":"Délais d’arrêt pré-opératoire","i":"clock","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Traitement\u003c/th>\u003cth>Maintien\u003c/th>\u003cth>Dernière prise\u003c/th>\u003cth>Reprise\u003c/th>\u003cth>Commentaires\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003cth colspan=\"5\" class=\"grp\">Antiagrégants plaquettaires\u003c/th>\u003c/tr>\n\u003ctr>\u003cth>Aspirine (Kardegic®, Resitune®)\u003c/th>\u003ctd rowspan=\"5\" class=\"no\">Non\u003c/td>\u003ctd>J-5\u003c/td>\u003ctd rowspan=\"5\">À distance\u003c/td>\u003ctd rowspan=\"5\">\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Clopidogrel (Plavix®)\u003c/th>\u003ctd>J-7\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Ticagrelor (Brilique®)\u003c/th>\u003ctd>J-7\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Prasugrel (Efient®)\u003c/th>\u003ctd>J-9\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Cangrelor (Kengrexal®)\u003c/th>\u003ctd>H-1\u003c/td>\u003c/tr>\n\u003ctr>\u003cth colspan=\"5\" class=\"grp\">Anticoagulants oraux\u003c/th>\u003c/tr>\n\u003ctr>\u003cth>AVK\u003c/th>\u003ctd class=\"no\">Non\u003c/td>\u003ctd>J-5\u003c/td>\u003ctd>À distance\u003c/td>\u003ctd>INR à l’admission ± relais (voir « Chirurgie programmée : AVK »)\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Rivaroxaban (Xarelto®)\u003c/th>\u003ctd rowspan=\"3\" class=\"no\">Non\u003c/td>\u003ctd rowspan=\"3\">J-5\u003c/td>\u003ctd rowspan=\"3\">À distance\u003c/td>\u003ctd rowspan=\"3\">Pas de relais\u003cbr>Pas de contrôle pré-opératoire\u003cbr>Si un bilan est prescrit en pré-opératoire : le faire le jour de l’admission\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Apixaban (Eliquis®)\u003c/th>\u003c/tr>\n\u003ctr>\u003cth>Dabigatran (Pradaxa®)\u003c/th>\u003c/tr>\n\u003ctr>\u003cth colspan=\"5\" class=\"grp\">Anticoagulants injectables\u003c/th>\u003c/tr>\n\u003ctr>\u003cth>Énoxaparine (Lovenox®) — doses préventives\u003c/th>\u003ctd rowspan=\"7\" class=\"no\">Non\u003c/td>\u003ctd>H-12\u003c/td>\u003ctd rowspan=\"7\">À distance\u003c/td>\u003ctd rowspan=\"6\">Si un bilan est prescrit en pré-opératoire : le faire le jour de l’admission\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Énoxaparine (Lovenox®) — doses curatives\u003c/th>\u003ctd>H-24\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Calciparine SC\u003c/th>\u003ctd>H-12\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Héparine IVSE\u003c/th>\u003ctd>H-6\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Tinzaparine (Innohep®)\u003c/th>\u003ctd>H-12\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Daltéparine (Fragmine®)\u003c/th>\u003ctd>H-12\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Danaparoïde (Orgaran®)\u003c/th>\u003ctd>H-48\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Fondaparinux (Arixtra®)\u003c/th>\u003ctd class=\"no\">Non\u003c/td>\u003ctd>H-48\u003c/td>\u003ctd>À distance\u003c/td>\u003ctd>H-96 si insuffisance rénale\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Tableau à cellules fusionnées dans le livret (page 75) : en cas de doute sur une ligne, ouvrir la page originale en bas de fiche.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Traitement Maintien Dernière prise Reprise Commentaires Antiagrégants plaquettaires Aspirine (Kardegic®, Resitune®) Non J-5 À distance Clopidogrel (Plavix®) J-7 Ticagrelor (Brilique®) J-7 Prasugrel (Efient®) J-9 Cangrelor (Kengrexal®) H-1 Anticoagulants oraux AVK Non J-5 À distance INR à l’admission ± relais (voir « Chirurgie programmée : AVK ») Rivaroxaban (Xarelto®) Non J-5 À distance Pas de relais Pas de contrôle pré-opératoire Si un bilan est prescrit en pré-opératoire : le faire le jour de l’admission Apixaban (Eliquis®) Dabigatran (Pradaxa®) Anticoagulants injectables Énoxaparine (Lovenox®) — doses préventives Non H-12 À distance Si un bilan est prescrit en pré-opératoire : le faire le jour de l’admission Énoxaparine (Lovenox®) — doses curatives H-24 Calciparine SC H-12 Héparine IVSE H-6 Tinzaparine (Innohep®) H-12 Daltéparine (Fragmine®) H-12 Danaparoïde (Orgaran®) H-48 Fondaparinux (Arixtra®) Non H-48 À distance H-96 si insuffisance rénale Note Tableau à cellules fusionnées dans le livret (page 75) : en cas de doute sur une ligne, ouvrir la page originale en bas de fiche."},{"t":"Radiologie interventionnelle","i":"file-text","h":"\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> \u003cstrong>Neuroradiologie interventionnelle\u003c/strong> : sauf demande du radiologue, \u003cstrong>toujours maintenir\u003c/strong> les traitements anticoagulants et antiagrégants.\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003ch3>Protocole Kardegic® – Brilique®\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>Ticagrelor (Brilique®)\u003c/strong> : 180 mg le matin, 2 h avant le geste, puis 90 mg × 2/j\u003c/li>\n\u003cli>\u003cstrong>Aspégic®\u003c/strong> en bolus per-opératoire, puis \u003cstrong>Kardegic®\u003c/strong> 75 ou 160 mg × 1/j\u003c/li>\n\u003c/ul>\n","x":"Important Neuroradiologie interventionnelle : sauf demande du radiologue, toujours maintenir les traitements anticoagulants et antiagrégants. Protocole Kardegic® – Brilique® Ticagrelor (Brilique®) : 180 mg le matin, 2 h avant le geste, puis 90 mg × 2/j Aspégic® en bolus per-opératoire, puis Kardegic® 75 ou 160 mg × 1/j"},{"t":"Chirurgie programmée : AVK","i":"scissors","h":"\u003cul>\n\u003cli>\u003cstrong>J-5\u003c/strong> : dernière prise\u003c/li>\n\u003cli>\u003cstrong>J-3\u003c/strong> : relais par héparine \u003cstrong>si et seulement si\u003c/strong> CHA₂DS₂-VASc ≥ 5 et/ou valve mécanique et/ou MTEV idiopathique, récidivante ou &lt; 3 mois et/ou thrombophilie sévère et/ou AVC/AIT &lt; 6 mois chez un patient en ACFA\u003c/li>\n\u003cli>\u003cstrong>J-1\u003c/strong> : arrêt de l’héparine (HBPM : H-24 ; Calciparine : H-12 ; héparine IVSE : H-6)\u003c/li>\n\u003cli>\u003cstrong>La veille au soir\u003c/strong> : contrôle de l’INR\u003cul>\n\u003cli>si &lt; 1,2 : OK pour la neurochirurgie\u003c/li>\n\u003cli>si &gt; 1,2 : 5 mg de vitamine K, avec contrôle le lendemain matin (J0)\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch3>Score CHA₂DS₂-VASc\u003c/h3>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth align=\"center\">\u003c/th>\n\u003cth>Item\u003c/th>\n\u003cth align=\"center\">Points\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>C\u003c/strong>\u003c/td>\n\u003ctd>Insuffisance cardiaque\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>H\u003c/strong>\u003c/td>\n\u003ctd>Hypertension artérielle\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>A\u003c/strong>\u003c/td>\n\u003ctd>Âge &gt; 75 ans\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>D\u003c/strong>\u003c/td>\n\u003ctd>Diabète\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>S2\u003c/strong>\u003c/td>\n\u003ctd>Antécédents d’AVC ou d’AIT\u003c/td>\n\u003ctd align=\"center\">2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>V\u003c/strong>\u003c/td>\n\u003ctd>Maladie vasculaire\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>A\u003c/strong>\u003c/td>\n\u003ctd>Âge 65 – 74 ans\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>Sc\u003c/strong>\u003c/td>\n\u003ctd>Sexe féminin &gt; 65 ans\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Points retranscrits tels qu’ils figurent dans le livret (âge &gt; 75 ans coté 1 point).\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"J-5 : dernière prise J-3 : relais par héparine si et seulement si CHA₂DS₂-VASc ≥ 5 et/ou valve mécanique et/ou MTEV idiopathique, récidivante ou \u003c 3 mois et/ou thrombophilie sévère et/ou AVC/AIT \u003c 6 mois chez un patient en ACFA J-1 : arrêt de l’héparine (HBPM : H-24 ; Calciparine : H-12 ; héparine IVSE : H-6) La veille au soir : contrôle de l’INR si \u003c 1,2 : OK pour la neurochirurgie si > 1,2 : 5 mg de vitamine K, avec contrôle le lendemain matin (J0) Score CHA₂DS₂-VASc Item Points C Insuffisance cardiaque 1 H Hypertension artérielle 1 A Âge > 75 ans 1 D Diabète 1 S2 Antécédents d’AVC ou d’AIT 2 V Maladie vasculaire 1 A Âge 65 – 74 ans 1 Sc Sexe féminin > 65 ans 1 Note Points retranscrits tels qu’ils figurent dans le livret (âge > 75 ans coté 1 point)."},{"t":"Urgence : antiagrégants plaquettaires","i":"droplets","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/aap-hemorragie-algo.webp\" data-legende=\"Figure 1 : Prise en charge des agents antiplaquettaires (AAP) en cas d’hémorragie\">\u003cimg src=\"figures/aap-hemorragie-algo.webp\" alt=\"Figure 1 : Prise en charge des agents antiplaquettaires (AAP) en cas d’hémorragie\" width=\"1484\" height=\"784\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Figure 1 : Prise en charge des agents antiplaquettaires (AAP) en cas d’hémorragie\u003c/figcaption>\u003c/figure>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>AAP\u003c/th>\n\u003cth>Moyens de neutralisation proposés\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Aspirine\u003c/td>\n\u003ctd>Transfusion plaquettaire à dose standard (0,5 à 0,7 × 10¹¹ pour 10 kg de poids)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Clopidogrel\u003c/td>\n\u003ctd>Transfusion plaquettaire : 2 × dose standard. \u003cem>Efficacité réduite si &lt; 6 h après la dernière prise d’AAP\u003c/em>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Prasugrel\u003c/td>\n\u003ctd>Transfusion plaquettaire : &gt; 2 × dose standard. \u003cem>Efficacité réduite si &lt; 6 h après la dernière prise d’AAP\u003c/em>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ticagrelor\u003c/td>\n\u003ctd>Dernière prise &lt; 24 h : pas de proposition — transfusion plaquettaire inefficace ; discuter le rFVIIa. Dernière prise &gt; 24 h : transfusion plaquettaire pour une neutralisation partielle\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Pas d’intérêt à se baser sur le résultat de l’Aspitest (aspirine) pour décider ou non d’une antagonisation : même si &gt; 400, une activité antiagrégante résiduelle est possible.\u003c/p>\n\u003cul>\n\u003cli>Soit urgence : antagonisation\u003c/li>\n\u003cli>Sinon, attendre le délai nécessaire\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/blockquote>\n","x":"Agrandir AAP Moyens de neutralisation proposés Aspirine Transfusion plaquettaire à dose standard (0,5 à 0,7 × 10¹¹ pour 10 kg de poids) Clopidogrel Transfusion plaquettaire : 2 × dose standard. Efficacité réduite si \u003c 6 h après la dernière prise d’AAP Prasugrel Transfusion plaquettaire : > 2 × dose standard. Efficacité réduite si \u003c 6 h après la dernière prise d’AAP Ticagrelor Dernière prise \u003c 24 h : pas de proposition — transfusion plaquettaire inefficace ; discuter le rFVIIa. Dernière prise > 24 h : transfusion plaquettaire pour une neutralisation partielle Note Pas d’intérêt à se baser sur le résultat de l’Aspitest (aspirine) pour décider ou non d’une antagonisation : même si > 400, une activité antiagrégante résiduelle est possible. Soit urgence : antagonisation Sinon, attendre le délai nécessaire"},{"t":"Urgence : AVK","i":"droplets","h":"\u003cdiv class=\"duo\">\n\u003cdiv>\n\n\u003ch3>Chirurgie intracrânienne urgente\u003c/h3>\n\u003col>\n\u003cli>Arrêt des AVK\u003c/li>\n\u003cli>Contrôle de l’INR\u003cul>\n\u003cli>≤ 1,2 → chirurgie\u003c/li>\n\u003cli>&gt; 1,2 → \u003cstrong>vitamine K 10 mg + CCP 25 UI/kg\u003c/strong> (= 1 ml/kg)\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Contrôle de l’INR à 30 min\u003cul>\n\u003cli>≤ 1,2 → chirurgie\u003c/li>\n\u003cli>&gt; 1,2 → \u003cstrong>CCP\u003c/strong> (doses selon le RCP)\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Contrôle de l’INR à 6 – 8 h\u003c/li>\n\u003c/ol>\n\u003c/div>\n\u003cdiv>\n\n\u003ch3>Chirurgie intracrânienne semi-urgente\u003c/h3>\n\u003cp>\u003cem>Compatible avec le délai d’antagonisation par la vitamine K seule : 6 – 24 h.\u003c/em>\u003c/p>\n\u003col>\n\u003cli>Arrêt des AVK\u003c/li>\n\u003cli>Contrôle de l’INR\u003cul>\n\u003cli>≤ 1,2 → chirurgie\u003c/li>\n\u003cli>&gt; 1,2 → \u003cstrong>vitamine K 10 mg\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Contrôle de l’INR toutes les 6 heures jusqu’à la chirurgie\u003c/li>\n\u003cli>Contrôle de l’INR à 6 – 8 h en post-opératoire\u003c/li>\n\u003c/ol>\n\u003c/div>\n\u003c/div>\n\n\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> \u003c/p>\n\u003cul>\n\u003cli>Objectif pour la neurochirurgie : \u003cstrong>INR ≤ 1,2\u003c/strong>\u003c/li>\n\u003cli>Vitamine K : voie entérale si possible, ou à défaut IV ; délai d’action de 4 à 6 h\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/blockquote>\n","x":"Chirurgie intracrânienne urgente Arrêt des AVK Contrôle de l’INR ≤ 1,2 → chirurgie > 1,2 → vitamine K 10 mg + CCP 25 UI/kg (= 1 ml/kg) Contrôle de l’INR à 30 min ≤ 1,2 → chirurgie > 1,2 → CCP (doses selon le RCP) Contrôle de l’INR à 6 – 8 h Chirurgie intracrânienne semi-urgente Compatible avec le délai d’antagonisation par la vitamine K seule : 6 – 24 h. Arrêt des AVK Contrôle de l’INR ≤ 1,2 → chirurgie > 1,2 → vitamine K 10 mg Contrôle de l’INR toutes les 6 heures jusqu’à la chirurgie Contrôle de l’INR à 6 – 8 h en post-opératoire Important Objectif pour la neurochirurgie : INR ≤ 1,2 Vitamine K : voie entérale si possible, ou à défaut IV ; délai d’action de 4 à 6 h"},{"t":"Urgence : anticoagulants oraux directs","i":"droplets","h":"\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/aod-antagonisation.webp\" data-legende=\"Figure 2 : Algorithme de prise en charge d’une hémorragie sous anticoagulants oraux directs et modalités d’antagonisation\">\u003cimg src=\"figures/aod-antagonisation.webp\" alt=\"Figure 2 : Algorithme de prise en charge d’une hémorragie sous anticoagulants oraux directs et modalités d’antagonisation\" width=\"1320\" height=\"689\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Figure 2 : Algorithme de prise en charge d’une hémorragie sous anticoagulants oraux directs et modalités d’antagonisation\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>\u003cstrong>[ACO] &lt; 30 ng/mL\u003c/strong> → pas de réversion\u003c/li>\n\u003cli>\u003cstrong>[ACO] &gt; 30 ng/mL\u003c/strong> :\u003cul>\n\u003cli>anti-IIa — \u003cstrong>dabigatran (Pradaxa®)\u003c/strong> → idarucizumab (Praxbind®) 2 × 2,5 g/50 ml IVL sur 10 min\u003c/li>\n\u003cli>anti-Xa — \u003cstrong>rivaroxaban (Xarelto®), apixaban (Eliquis®)\u003c/strong> → au choix : CCP (Kanokad®) 50 UI/kg ; CCP activé (Feiba®) 50 UI/kg ; andexanet (posologie à adapter à l’AOD et à l’heure de la dernière prise)\u003c/li>\n\u003cli>nouveau dosage de l’[ACO] entre H12 et H24\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> Après antagonisation d’un AOD, penser à faire un dosage à \u003cstrong>H24\u003c/strong> (risque de rebond) ± complément d’antagonisation.\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> La figure du livret indique « Idarucizumab PRAXBIND 2 × 2,5 mg/50 ml » ; la présentation de l’idarucizumab est de 2,5 \u003cstrong>g\u003c/strong>/50 ml (dose totale 5 g, cohérente avec la figure de l’\u003ca class=\"xref\" href=\"#rea-avc-hemorragique\">AVC hémorragique\u003c/a>).\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003ch3>Selon la gravité et la localisation de l’hémorragie\u003c/h3>\n\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/aod-hemorragie-gravite.webp\" data-legende=\"Figure 3 : Prise en charge d’une hémorragie liée aux AOD, en fonction de la gravité et de la localisation de l’hémorragie\">\u003cimg src=\"figures/aod-hemorragie-gravite.webp\" alt=\"Figure 3 : Prise en charge d’une hémorragie liée aux AOD, en fonction de la gravité et de la localisation de l’hémorragie\" width=\"1295\" height=\"804\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003c/span>\u003c/button>\u003cfigcaption>Figure 3 : Prise en charge d’une hémorragie liée aux AOD, en fonction de la gravité et de la localisation de l’hémorragie\u003c/figcaption>\u003c/figure>\n\u003cul>\n\u003cli>\u003cstrong>Toute hémorragie\u003c/strong> : obtenir l’heure de la dernière prise d’AOD, la dose et le nombre de prises, la clairance de la créatinine ; dosage spécifique de l’AOD\u003c/li>\n\u003cli>\u003cstrong>Hémorragie dans un organe critique\u003c/strong> (intracérébrale ; intraoculaire) : FEIBA 30 – 50 UI/kg ou CCP 50 UI/kg\u003c/li>\n\u003cli>\u003cstrong>Hémorragie grave\u003c/strong> selon la définition HAS 2008 (hors cas précédents) : [AOD] &lt; 30 ng/mL : pas d’antagonisation ; privilégier un geste hémostatique si réalisable ; si [AOD] &gt; 30 ng/mL et si le traitement conventionnel ne suffit pas, discuter une antagonisation : CCP 25 – 50 UI/kg ou FEIBA 30 – 50 UI/kg\u003c/li>\n\u003cli>\u003cstrong>Hémorragie non grave\u003c/strong> : traitement symptomatique ; pas d’antagonisation en 1ʳᵉ intention\u003c/li>\n\u003c/ul>\n","x":"Agrandir [ACO] \u003c 30 ng/mL → pas de réversion [ACO] > 30 ng/mL : anti-IIa — dabigatran (Pradaxa®) → idarucizumab (Praxbind®) 2 × 2,5 g/50 ml IVL sur 10 min anti-Xa — rivaroxaban (Xarelto®), apixaban (Eliquis®) → au choix : CCP (Kanokad®) 50 UI/kg ; CCP activé (Feiba®) 50 UI/kg ; andexanet (posologie à adapter à l’AOD et à l’heure de la dernière prise) nouveau dosage de l’[ACO] entre H12 et H24 Attention Après antagonisation d’un AOD, penser à faire un dosage à H24 (risque de rebond) ± complément d’antagonisation. Note La figure du livret indique « Idarucizumab PRAXBIND 2 × 2,5 mg/50 ml » ; la présentation de l’idarucizumab est de 2,5 g /50 ml (dose totale 5 g, cohérente avec la figure de l’ AVC hémorragique ). Selon la gravité et la localisation de l’hémorragie Agrandir Toute hémorragie : obtenir l’heure de la dernière prise d’AOD, la dose et le nombre de prises, la clairance de la créatinine ; dosage spécifique de l’AOD Hémorragie dans un organe critique (intracérébrale ; intraoculaire) : FEIBA 30 – 50 UI/kg ou CCP 50 UI/kg Hémorragie grave selon la définition HAS 2008 (hors cas précédents) : [AOD] \u003c 30 ng/mL : pas d’antagonisation ; privilégier un geste hémostatique si réalisable ; si [AOD] > 30 ng/mL et si le traitement conventionnel ne suffit pas, discuter une antagonisation : CCP 25 – 50 UI/kg ou FEIBA 30 – 50 UI/kg Hémorragie non grave : traitement symptomatique ; pas d’antagonisation en 1ʳᵉ intention"},{"t":"Urgence : héparines","i":"droplets","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Type\u003c/th>\u003cth>Délai / condition\u003c/th>\u003cth>Demi-vie (t½)\u003c/th>\u003cth>Antagonisation\u003c/th>\u003cth>Autres\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003cth rowspan=\"3\">Énoxaparine\u003c/th>\u003ctd>&lt; 8 h\u003c/td>\u003ctd rowspan=\"3\">4,5 h\u003c/td>\u003ctd>\u003cstrong>Protamine\u003c/strong> 1 mg pour 1 mg d’énoxaparine (max 50 mg)\u003c/td>\u003ctd rowspan=\"3\">\u003cstrong>Protamine contre-indiquée\u003c/strong> : rFVIIa 90 µg/kg\u003cbr>\u003cstrong>Persistance des saignements\u003c/strong> : protamine 0,5 mg / 100 UI anti-Xa\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>8 – 12 h\u003c/td>\u003ctd>\u003cstrong>Protamine\u003c/strong> 0,5 mg pour 1 mg d’énoxaparine (max 50 mg)\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>&gt; 12 h\u003c/td>\u003ctd>Peu utile (= 3 – 5 t½)\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Autres HBPM\u003c/th>\u003ctd>≤ 3 – 5 t½\u003c/td>\u003ctd>Variable\u003c/td>\u003ctd>\u003cstrong>Protamine\u003c/strong> 1 mg pour 100 UI anti-Xa de HBPM (max 50 mg)\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Calciparine, HNF IVSE\u003c/th>\u003ctd>Si TCA allongé\u003c/td>\u003ctd>60 – 90 min\u003c/td>\u003ctd>\u003cstrong>Protamine\u003c/strong> 1 mg pour 100 U administrées dans les 3 h précédentes (max 50 mg)\u003c/td>\u003ctd>\u003cstrong>Persistance d’un allongement du TCA\u003c/strong> : protamine 0,5 mg / 100 UI d’HNF\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Fondaparinux\u003c/th>\u003ctd>Anti-Xa\u003c/td>\u003ctd>17 – 21 h\u003c/td>\u003ctd>\u003cstrong>CCP activé (FEIBA)\u003c/strong> 20 UI/kg ou \u003cstrong>rFVIIa\u003c/strong> 90 µg/kg\u003c/td>\u003ctd>\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\n\u003ch3>Surveillance\u003c/h3>\n\u003cul>\n\u003cli>\u003cstrong>L’anti-Xa héparine peut être faussé par la prise d’AOD\u003c/strong> : intérêt, sur le premier dosage, d’y associer un TCA si les traitements du patient ne sont pas connus (une discordance TCA / anti-Xa permet de suspecter une prise d’AOD)\u003c/li>\n\u003cli>\u003cstrong>HBPM\u003c/strong> : dosage pour éliminer un surdosage dans des cas particuliers (obèse, DFG &lt; 50 ml/min) → faire un résiduel (prélever juste avant l’injection, à l’équilibre = après 3 à 4 injections au moins). Si anti-Xa [HBPM] ≤ 0,6 : pas de surdosage. Pas d’intérêt à doser l’efficacité. Attention : le sulfate de protamine ne permet qu’une antagonisation \u003cstrong>partielle\u003c/strong> des HBPM\u003c/li>\n\u003cli>\u003cstrong>Calciparine\u003c/strong> : dosage toujours à mi-dose, que ce soit en schéma préventif ou curatif, à l’équilibre = après 3 à 4 injections\u003c/li>\n\u003cli>\u003cstrong>Orgaran®\u003c/strong> : idem\u003c/li>\n\u003c/ul>\n","x":"Type Délai / condition Demi-vie (t½) Antagonisation Autres Énoxaparine \u003c 8 h 4,5 h Protamine 1 mg pour 1 mg d’énoxaparine (max 50 mg) Protamine contre-indiquée : rFVIIa 90 µg/kg Persistance des saignements : protamine 0,5 mg / 100 UI anti-Xa 8 – 12 h Protamine 0,5 mg pour 1 mg d’énoxaparine (max 50 mg) > 12 h Peu utile (= 3 – 5 t½) Autres HBPM ≤ 3 – 5 t½ Variable Protamine 1 mg pour 100 UI anti-Xa de HBPM (max 50 mg) Calciparine, HNF IVSE Si TCA allongé 60 – 90 min Protamine 1 mg pour 100 U administrées dans les 3 h précédentes (max 50 mg) Persistance d’un allongement du TCA : protamine 0,5 mg / 100 UI d’HNF Fondaparinux Anti-Xa 17 – 21 h CCP activé (FEIBA) 20 UI/kg ou rFVIIa 90 µg/kg Surveillance L’anti-Xa héparine peut être faussé par la prise d’AOD : intérêt, sur le premier dosage, d’y associer un TCA si les traitements du patient ne sont pas connus (une discordance TCA / anti-Xa permet de suspecter une prise d’AOD) HBPM : dosage pour éliminer un surdosage dans des cas particuliers (obèse, DFG \u003c 50 ml/min) → faire un résiduel (prélever juste avant l’injection, à l’équilibre = après 3 à 4 injections au moins). Si anti-Xa [HBPM] ≤ 0,6 : pas de surdosage. Pas d’intérêt à doser l’efficacité. Attention : le sulfate de protamine ne permet qu’une antagonisation partielle des HBPM Calciparine : dosage toujours à mi-dose, que ce soit en schéma préventif ou curatif, à l’équilibre = après 3 à 4 injections Orgaran® : idem"},{"t":"Pour aller plus loin","i":"book-marked","h":"\u003cp class=\"added-note\">Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret.\u003c/p>\u003cul>\n\u003cli>\u003ca class=\"ext\" href=\"https://doi.org/10.1016/j.acvd.2017.12.004\" target=\"_blank\" rel=\"noopener noreferrer\">GIHP – GFHT 2018 : gestion des agents antiplaquettaires en cas de procédure invasive non programmée ou d’hémorragie\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://sfmu.org/upload/consensus/RFE2024_Anticoagulation_contexte_urgence.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">RFE SFMU – SFAR – GIHP – SFTH 2024 : gestion de l’anticoagulation dans un contexte d’urgence (PDF)\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003cli>\u003ca class=\"ext\" href=\"https://www.has-sante.fr/jcms/c_682188/fr/prise-en-charge-des-surdosages-en-antivitamines-k-des-situations-a-risque-hemorragique-et-des-accidents-hemorragiques-chez-les-patients-traites-par-antivitamines-k-en-ville-et-en-milieu-hospitalier\" target=\"_blank\" rel=\"noopener noreferrer\">HAS 2008 : surdosages, situations à risque hémorragique et accidents hémorragiques sous AVK\u003csvg class=\"ic ext-ic\" aria-hidden=\"true\">\u003cuse href=\"#i-arrow-up-right\"/>\u003c/svg>\u003c/a>\u003c/li>\n\u003c/ul>\n","x":"Liens ajoutés lors de la mise en forme de l’application : ils ne font pas partie du livret. GIHP – GFHT 2018 : gestion des agents antiplaquettaires en cas de procédure invasive non programmée ou d’hémorragie RFE SFMU – SFAR – GIHP – SFTH 2024 : gestion de l’anticoagulation dans un contexte d’urgence (PDF) HAS 2008 : surdosages, situations à risque hémorragique et accidents hémorragiques sous AVK"}]},{"id":"anesth-ttt-antidiabetiques","s":"anesth","t":"Traitements antidiabétiques","c":"Traitements antidiabétiques","g":"Gestion des traitements","i":"pill-bottle","p":[79],"r":"Délais d’arrêt des antidiabétiques oraux, conduite pour les insulines et la pompe à insuline.","m":"metformine, sulfamide, glinide, gliptine, DPP-4, GLP-1, insuline lente, insuline rapide, pompe à insuline, G10%, antidiabétiques oraux","k":[{"t":"Antidiabétiques non insuliniques","i":"syringe","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth>Traitement\u003c/th>\u003cth>Maintien\u003c/th>\u003cth>Dernière prise\u003c/th>\u003cth>Reprise\u003c/th>\u003cth>Commentaires\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003cth>Biguanides : metformine\u003cbr>\u003csmall>Glucophage®, Stagid®\u003c/small>\u003c/th>\u003ctd rowspan=\"6\" class=\"no\">Non\u003c/td>\u003ctd>H-24\u003c/td>\u003ctd rowspan=\"6\">Le soir\u003c/td>\u003ctd rowspan=\"6\">Protocole insuline SC\u003c/td>\u003c/tr>\n\u003ctr>\u003cth>Sulfamides, glinides\u003cbr>\u003csmall>Amarel®, Diamicron®, Daonil®, Novonorm®\u003c/small>\u003c/th>\u003ctd>H-12\u003c/td>\u003c/tr>\n\u003ctr>\u003cth 003c/tbody>\u003c/table>\u003c/div>\n","x":"Agent Dose PO Dose IV Autre Morphine 30 mg 10 mg Péridurale = 1 mg ; intrathécale = 0,1 mg Oxycodone 20 mg 10 mg Méthadone 2 mg 2 mg"},{"t":"Table d’équianalgésie","i":"file-text","h":"\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>DCI\u003c/th>\n\u003cth align=\"center\">Ratio\u003c/th>\n\u003cth>Équivalence morphine PO\u003c/th>\n\u003cth align=\"center\">Équivalence morphine IV\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Morphine PO\u003c/td>\n\u003ctd align=\"center\">1\u003c/td>\n\u003ctd>3 mg = 3 mg de morphine PO\u003c/td>\n\u003ctd align=\"center\">1 mg\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Morphine SC\u003c/td>\n\u003ctd align=\"center\">2\u003c/td>\n\u003ctd>3 mg = 6 mg de morphine PO\u003c/td>\n\u003ctd align=\"center\">2 mg\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Morphine IV\u003c/td>\n\u003ctd align=\"center\">3\u003c/td>\n\u003ctd>3 mg = 9 mg de morphine PO\u003c/td>\n\u003ctd align=\"center\">3 mg\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Codéine\u003c/td>\n\u003ctd align=\"center\">1/6\u003c/td>\n\u003ctd>60 mg = 10 mg de morphine PO\u003c/td>\n\u003ctd align=\"center\">3 mg\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Dihydrocodéine\u003c/td>\n\u003ctd align=\"center\">1/3\u003c/td>\n\u003ctd>60 mg = 20 mg de morphine PO\u003c/td>\n\u003ctd align=\"center\">6 mg\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tramadol\u003c/td>\n\u003ctd align=\"center\">1/5\u003c/td>\n\u003ctd>50 mg = 10 mg de morphine PO\u003c/td>\n\u003ctd align=\"center\">3 mg\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Oxycodone PO\u003c/td>\n\u003ctd align=\"center\">2\u003c/td>\n\u003ctd>5 mg = 10 mg de morphine PO\u003c/td>\n\u003ctd align=\"center\">3 mg\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Buprénorphine SL\u003c/td>\n\u003ctd align=\"center\">30\u003c/td>\n\u003ctd>0,2 mg = 6 mg de morphine PO\u003c/td>\n\u003ctd align=\"center\">2 mg\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nalbuphine SC\u003c/td>\n\u003ctd align=\"center\">2\u003c/td>\n\u003ctd>5 mg = 10 mg de morphine PO\u003c/td>\n\u003ctd align=\"center\">3 mg\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>La dernière colonne donne l’équivalent en morphine IV de la dose indiquée dans la colonne « équivalence morphine PO ».\u003c/p>\n","x":"DCI Ratio Équivalence morphine PO Équivalence morphine IV Morphine PO 1 3 mg = 3 mg de morphine PO 1 mg Morphine SC 2 3 mg = 6 mg de morphine PO 2 mg Morphine IV 3 3 mg = 9 mg de morphine PO 3 mg Codéine 1/6 60 mg = 10 mg de morphine PO 3 mg Dihydrocodéine 1/3 60 mg = 20 mg de morphine PO 6 mg Tramadol 1/5 50 mg = 10 mg de morphine PO 3 mg Oxycodone PO 2 5 mg = 10 mg de morphine PO 3 mg Buprénorphine SL 30 0,2 mg = 6 mg de morphine PO 2 mg Nalbuphine SC 2 5 mg = 10 mg de morphine PO 3 mg La dernière colonne donne l’équivalent en morphine IV de la dose indiquée dans la colonne « équivalence morphine PO »."}]},{"id":"anesth-ttt-neuro","s":"anesth","t":"Antiparkinsoniens et antiépileptiques","c":"Antiparkinsoniens, antiépileptiques","g":"Gestion des traitements","i":"brain","p":[81],"r":"À maintenir, aux horaires habituels.","m":"antiparkinsonien, Parkinson, L-dopa, antiépileptique, épilepsie, SNG, blocage","k":[{"t":"À maintenir !","i":"target","h":"\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> Antiparkinsoniens et antiépileptiques sont \u003cstrong>à maintenir\u003c/strong>.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Important Antiparkinsoniens et antiépileptiques sont à maintenir ."},{"t":"Antiparkinsoniens","i":"file-text","h":"\u003cul>\n\u003cli>À donner \u003cstrong>aux horaires habituels\u003c/strong>\u003c/li>\n\u003cli>Pose d’une SNG pour poursuivre l’administration et éviter les blocages, notamment en phase de réveil !\u003c/li>\n\u003cli>Le patient doit partir au bloc opératoire \u003cstrong>avec ses traitements\u003c/strong>\u003c/li>\n\u003c/ul>\n","x":"À donner aux horaires habituels Pose d’une SNG pour poursuivre l’administration et éviter les blocages, notamment en phase de réveil ! Le patient doit partir au bloc opératoire avec ses traitements"},{"t":"Antiépileptiques","i":"file-text","h":"\u003cul>\n\u003cli>À donner \u003cstrong>aux horaires habituels\u003c/strong>\u003c/li>\n\u003cli>Penser à anticiper la prise du matin si le patient est en première position à 7 h 30\u003c/li>\n\u003c/ul>\n\u003cp>Cas particulier de la chirurgie éveillée (clonazépam) : voir \u003ca class=\"xref\" href=\"#anesth-eveillee\">Chirurgie éveillée\u003c/a>.\u003c/p>\n","x":"À donner aux horaires habituels Penser à anticiper la prise du matin si le patient est en première position à 7 h 30 Cas particulier de la chirurgie éveillée (clonazépam) : voir Chirurgie éveillée ."}]},{"id":"anesth-eveillee","s":"anesth","t":"Chirurgie éveillée","c":"Chirurgie éveillée","g":"Chirurgies spécifiques","i":"message-circle","p":[83,84],"r":"Conduite anesthésique en trois séquences (AG – réveil – AG), infiltration, cartographie.","m":"chirurgie éveillée, awake, gliome, AIVOC, propofol, rémifentanil, i-gel, Airtraq, infiltration, ropivacaïne, Naropeine, xylocaïne, cartographie, neuropsychologue","k":[{"t":"Objectifs et indications","i":"info","h":"\u003cp>\u003cstrong>Objectifs\u003c/strong> : exérèse totale ou partielle de tumeurs gliales avec évaluation neurologique per-opératoire, le but étant la résection tumorale maximale en limitant le risque de séquelles post-opératoires.\u003c/p>\n\u003cp>\u003cstrong>Indications\u003c/strong> : chirurgie des lésions tumorales ou chirurgie de l’épilepsie en zones cérébrales fonctionnelles.\u003c/p>\n","x":"Objectifs : exérèse totale ou partielle de tumeurs gliales avec évaluation neurologique per-opératoire, le but étant la résection tumorale maximale en limitant le risque de séquelles post-opératoires. Indications : chirurgie des lésions tumorales ou chirurgie de l’épilepsie en zones cérébrales fonctionnelles."},{"t":"Consultation et visite pré-opératoire","i":"shield-check","h":"\u003cul>\n\u003cli>\u003cstrong>Consultation d’anesthésie\u003c/strong> : se réalise par, ou en présence d’, un médecin sénior. Information spécifique quant aux différentes phases de la chirurgie.\u003c/li>\n\u003cli>\u003cstrong>Visite pré-opératoire\u003c/strong> : pas d’arrêt des anticomitiaux, \u003cstrong>sauf le clonazépam\u003c/strong> la veille au soir et le jour de l’intervention.\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> \u003cstrong>Pas de prémédication.\u003c/strong>\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Consultation d’anesthésie : se réalise par, ou en présence d’, un médecin sénior. Information spécifique quant aux différentes phases de la chirurgie. Visite pré-opératoire : pas d’arrêt des anticomitiaux, sauf le clonazépam la veille au soir et le jour de l’intervention. Important Pas de prémédication."},{"t":"Principes","i":"info","h":"\u003cul>\n\u003cli>Anesthésie + réveil dans des conditions de sécurité (\u003cstrong>AG + réveil + AG\u003c/strong>)\u003c/li>\n\u003cli>Pas de prémédication sur table, \u003cstrong>pas de curares\u003c/strong>, prévoir le matériel d’intubation difficile en salle\u003c/li>\n\u003c/ul>\n","x":"Anesthésie + réveil dans des conditions de sécurité ( AG + réveil + AG ) Pas de prémédication sur table, pas de curares , prévoir le matériel d’intubation difficile en salle"},{"t":"Première séquence : installation et AG","i":"clipboard-list","h":"\u003col>\n\u003cli>Monter la température de la salle\u003c/li>\n\u003cli>Installation en DD pour le monitorage\u003c/li>\n\u003cli>Pose d’une VVP\u003c/li>\n\u003cli>Perfalgan® 1 g + ondansétron 4 mg + corticoïdes IV (1 mg/kg) + antibioprophylaxie\u003c/li>\n\u003cli>Sondage chez la femme en DD\u003c/li>\n\u003cli>Installation en DL (\u003cem>park bench\u003c/em>) pour la dénitrogénation, puis induction \u003cstrong>en face\u003c/strong> du patient\u003c/li>\n\u003cli>Réchauffement actif +++\u003c/li>\n\u003cli>AIVOC propofol – rémifentanil\u003c/li>\n\u003cli>Induction en DL, ventilation sur circuit interne en PC, prévisualisation de la glotte avec l’Airtraq®, puis pose d’un i-gel®, fixation\u003c/li>\n\u003cli>Pose d’une 2ᵉ VVP, sondage chez l’homme, protection oculaire ; cathéter artériel non systématique\u003c/li>\n\u003cli>\u003cstrong>Pose du cadre\u003c/strong> : infiltration à la Xylocaïne® 1 % adrénalinée + Naropeine® 0,75 %\u003c/li>\n\u003cli>Installation de la tête par le neurochirurgien : surveiller le respect de l’axe tête – cou – tronc pour ne pas déplacer l’i-gel® (surveillance par le CO2, le Vt, les fuites) et garder la configuration qui a permis la visualisation de la glotte\u003c/li>\n\u003c/ol>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> \u003cstrong>Doses maximales d’anesthésiques locaux\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Xylocaïne® adrénalinée : \u003cstrong>200 mg, soit 20 ml\u003c/strong>\u003c/li>\n\u003cli>Naropeine® 0,75 % : \u003cstrong>225 mg, soit 30 ml\u003c/strong>\u003c/li>\n\u003c/ul>\n\u003cp>Définir avec le chirurgien la dose et le type en fonction du site de l’infiltration. \u003cstrong>Diminuer les doses si mélange.\u003c/strong>\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Monter la température de la salle Installation en DD pour le monitorage Pose d’une VVP Perfalgan® 1 g + ondansétron 4 mg + corticoïdes IV (1 mg/kg) + antibioprophylaxie Sondage chez la femme en DD Installation en DL ( park bench ) pour la dénitrogénation, puis induction en face du patient Réchauffement actif +++ AIVOC propofol – rémifentanil Induction en DL, ventilation sur circuit interne en PC, prévisualisation de la glotte avec l’Airtraq®, puis pose d’un i-gel®, fixation Pose d’une 2ᵉ VVP, sondage chez l’homme, protection oculaire ; cathéter artériel non systématique Pose du cadre : infiltration à la Xylocaïne® 1 % adrénalinée + Naropeine® 0,75 % Installation de la tête par le neurochirurgien : surveiller le respect de l’axe tête – cou – tronc pour ne pas déplacer l’i-gel® (surveillance par le CO2, le Vt, les fuites) et garder la configuration qui a permis la visualisation de la glotte Attention Doses maximales d’anesthésiques locaux Xylocaïne® adrénalinée : 200 mg, soit 20 ml Naropeine® 0,75 % : 225 mg, soit 30 ml Définir avec le chirurgien la dose et le type en fonction du site de l’infiltration. Diminuer les doses si mélange."},{"t":"Deuxième séquence : réveil et temps chirurgicaux","i":"clipboard-list","h":"\u003ch3>Le réveil\u003c/h3>\n\u003cul>\n\u003cli>Prévoir l’aspiration près de la tête du patient\u003c/li>\n\u003cli>Arrêt simultané du propofol et du rémifentanil à la demande du chirurgien (possibilité d’anticiper la diminution du propofol)\u003c/li>\n\u003cli>Enlever la protection des yeux et installer les lunettes à O2 + capnographie (montage à l’aide d’un raccord de rampe 3 voies)\u003c/li>\n\u003cli>Ablation de l’i-gel® dès le réveil et la coopération du patient\u003c/li>\n\u003c/ul>\n\u003ch3>Stimulation corticale (cartographie de la tumeur)\u003c/h3>\n\u003cp>Risque de \u003cstrong>myoclonies\u003c/strong> pendant cette phase : traitement par \u003cstrong>sérum glacé in situ\u003c/strong> ; ne pas utiliser le clonazépam en première intention.\u003c/p>\n\u003ch3>Exérèse (durée 1 h – 1 h 30)\u003c/h3>\n\u003cul>\n\u003cli>Tests réalisés par la neuropsychologue (seuls le chirurgien et la neuropsychologue parlent au patient pendant cette phase) ; attention aux bruits parasites\u003c/li>\n\u003cli>Surveillance anesthésique standard : Loxen® si besoin, maintien de l’O2 aux lunettes, normothermie\u003c/li>\n\u003cli>Évaluation du degré de somnolence, de la labilité émotionnelle, des douleurs, de l’agitation, des frissons\u003c/li>\n\u003c/ul>\n","x":"Le réveil Prévoir l’aspiration près de la tête du patient Arrêt simultané du propofol et du rémifentanil à la demande du chirurgien (possibilité d’anticiper la diminution du propofol) Enlever la protection des yeux et installer les lunettes à O2 + capnographie (montage à l’aide d’un raccord de rampe 3 voies) Ablation de l’i-gel® dès le réveil et la coopération du patient Stimulation corticale (cartographie de la tumeur) Risque de myoclonies pendant cette phase : traitement par sérum glacé in situ ; ne pas utiliser le clonazépam en première intention. Exérèse (durée 1 h – 1 h 30) Tests réalisés par la neuropsychologue (seuls le chirurgien et la neuropsychologue parlent au patient pendant cette phase) ; attention aux bruits parasites Surveillance anesthésique standard : Loxen® si besoin, maintien de l’O2 aux lunettes, normothermie Évaluation du degré de somnolence, de la labilité émotionnelle, des douleurs, de l’agitation, des frissons"},{"t":"Troisième séquence : seconde AG","i":"clipboard-list","h":"\u003cul>\n\u003cli>Procéder à la deuxième AG : matériel d’intubation et de ventilation à proximité\u003c/li>\n\u003cli>Préoxygénation face au patient, induction en double AIVOC, \u003cstrong>curarisation conseillée\u003c/strong> pour éviter la toux à l’intubation (tête fixée dans le cadre !), intubation à l’Airtraq® ; si échec, pose d’un i-gel® ; fixation rigoureuse\u003c/li>\n\u003cli>Infiltration possible de la dure-mère en fin d’intervention (Naropeine®), en respectant les doses max\u003c/li>\n\u003cli>Fermeture de la dure-mère et du scalp\u003c/li>\n\u003cli>Remise en DD en fin d’intervention. Transport et réveil aux soins intensifs\u003c/li>\n\u003c/ul>\n","x":"Procéder à la deuxième AG : matériel d’intubation et de ventilation à proximité Préoxygénation face au patient, induction en double AIVOC, curarisation conseillée pour éviter la toux à l’intubation (tête fixée dans le cadre !), intubation à l’Airtraq® ; si échec, pose d’un i-gel® ; fixation rigoureuse Infiltration possible de la dure-mère en fin d’intervention (Naropeine®), en respectant les doses max Fermeture de la dure-mère et du scalp Remise en DD en fin d’intervention. Transport et réveil aux soins intensifs"}]},{"id":"anesth-hypophyse","s":"anesth","t":"Chirurgie d’adénome hypophysaire","c":"Adénome hypophysaire","g":"Chirurgies spécifiques","i":"eye","p":[85],"r":"Surveillance du diabète insipide, hydrocortisone péri-opératoire selon le statut corticotrope, cas du Cushing.","m":"hypophyse, adénome, diabète insipide, Minirinmelt, desmopressine, hydrocortisone, HSHC, insuffisance corticotrope, cortisolémie, Cushing, synacthène","k":[{"t":"Pour tous les patients","i":"file-text","h":"\u003cul>\n\u003cli>Surveillance de la \u003cstrong>diurèse horaire\u003c/strong> et du bilan entrées – sorties, pour la recherche d’un diabète insipide\u003c/li>\n\u003cli>Ionogramme sanguin à J1\u003c/li>\n\u003cli>\u003cstrong>Minirinmelt® 60 µg PO\u003c/strong> si le BES des 6 heures est négatif de plus de 500 ml \u003cstrong>et\u003c/strong> si la natrémie est supérieure à 145 mmol/l\u003c/li>\n\u003c/ul>\n\u003cp>Voir aussi : \u003ca class=\"xref\" href=\"#rea-dysnatremies\">Dysnatrémies\u003c/a>.\u003c/p>\n","x":"Surveillance de la diurèse horaire et du bilan entrées – sorties, pour la recherche d’un diabète insipide Ionogramme sanguin à J1 Minirinmelt® 60 µg PO si le BES des 6 heures est négatif de plus de 500 ml et si la natrémie est supérieure à 145 mmol/l Voir aussi : Dysnatrémies ."},{"t":"Patient insuffisant corticotrope","i":"pill","h":"\u003cp>Patient supplémenté en hydrocortisone en pré-opératoire. Prescription d’hémisuccinate d’hydrocortisone (HSHC) en péri-opératoire :\u003c/p>\n\u003cdiv class=\"table-wrap\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth align=\"center\">Jour\u003c/th>\n\u003cth>Hydrocortisone\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>J0\u003c/strong> (jour de la chirurgie)\u003c/td>\n\u003ctd>À débuter au bloc opératoire entre 30 et 60 minutes avant la chirurgie, après la pose d’une VVP : \u003cstrong>HSHC 50 mg IV × 3 par 24 h\u003c/strong> ou en IV continu (soit 150 mg/j)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>J1\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>25 mg IV × 4 par 24 h\u003c/strong> ou en IV continu (soit 100 mg/j)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>J2\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>20 mg PO le matin + 20 mg à midi\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">\u003cstrong>J3\u003c/strong>\u003c/td>\n\u003ctd>\u003cstrong>15 mg/jour PO\u003c/strong> le matin en une prise si &lt; 75 kg, \u003cstrong>ou 20 mg/jour\u003c/strong> en deux prises si ≥ 75 kg\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd align=\"center\">Après J3\u003c/td>\n\u003ctd>Maintenir les mêmes doses, et faire faire une réévaluation par l’endocrinologue\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Pas de dosage de la cortisolémie à 8 h à J1 : résultat non interprétable.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Patient supplémenté en hydrocortisone en pré-opératoire. Prescription d’hémisuccinate d’hydrocortisone (HSHC) en péri-opératoire : Jour Hydrocortisone J0 (jour de la chirurgie) À débuter au bloc opératoire entre 30 et 60 minutes avant la chirurgie, après la pose d’une VVP : HSHC 50 mg IV × 3 par 24 h ou en IV continu (soit 150 mg/j) J1 25 mg IV × 4 par 24 h ou en IV continu (soit 100 mg/j) J2 20 mg PO le matin + 20 mg à midi J3 15 mg/jour PO le matin en une prise si \u003c 75 kg, ou 20 mg/jour en deux prises si ≥ 75 kg Après J3 Maintenir les mêmes doses, et faire faire une réévaluation par l’endocrinologue Note Pas de dosage de la cortisolémie à 8 h à J1 : résultat non interprétable."},{"t":"Patient sans insuffisance corticotrope","i":"pill","h":"\u003cblockquote class=\"callout callout-note\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-info\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Note\u003c/span> Le livret décrit cette situation par : « cortisolémie basse + ACTH non augmenté et absence d’augmentation du cortisol au test au synacthène », formulation qui correspond aux critères de l’insuffisance corticotrope ; vérifier sur la page originale et auprès de l’endocrinologue.\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003cblockquote class=\"callout callout-warning\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-triangle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Attention\u003c/span> \u003cstrong>Pas\u003c/strong> de supplémentation en HSHC en péri-opératoire, \u003cstrong>pas de dexaméthasone\u003c/strong> à visée anti-émétique au bloc opératoire, \u003cstrong>pas\u003c/strong> de corticothérapie post-opératoire — pour éviter de fausser les dosages de cortisolémie de J1.\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003cp>\u003cstrong>Dosage de la cortisolémie à 8 h à J1 :\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>&gt; 350 nmol/l\u003c/strong> et en l’absence de complication (infectieuse, embolie pulmonaire, etc.) : il n’y a pas lieu de prescrire de l’hydrocortisone avant la réévaluation par les endocrinologues à 1 mois post-opératoire\u003c/li>\n\u003cli>\u003cstrong>&lt; 350 nmol/l\u003c/strong> : devant la suspicion d’insuffisance corticotrope, on peut proposer 15 mg/jour PO le matin en une prise si &lt; 75 kg, ou 20 mg/jour en deux prises si ≥ 75 kg, avant la réévaluation par l’endocrinologue\u003c/li>\n\u003c/ul>\n","x":"Note Le livret décrit cette situation par : « cortisolémie basse + ACTH non augmenté et absence d’augmentation du cortisol au test au synacthène », formulation qui correspond aux critères de l’insuffisance corticotrope ; vérifier sur la page originale et auprès de l’endocrinologue. Attention Pas de supplémentation en HSHC en péri-opératoire, pas de dexaméthasone à visée anti-émétique au bloc opératoire, pas de corticothérapie post-opératoire — pour éviter de fausser les dosages de cortisolémie de J1. Dosage de la cortisolémie à 8 h à J1 : > 350 nmol/l et en l’absence de complication (infectieuse, embolie pulmonaire, etc.) : il n’y a pas lieu de prescrire de l’hydrocortisone avant la réévaluation par les endocrinologues à 1 mois post-opératoire \u003c 350 nmol/l : devant la suspicion d’insuffisance corticotrope, on peut proposer 15 mg/jour PO le matin en une prise si \u003c 75 kg, ou 20 mg/jour en deux prises si ≥ 75 kg, avant la réévaluation par l’endocrinologue"},{"t":"Maladie de Cushing","i":"pill","h":"\u003cp>L’insuffisance corticotrope aiguë est le \u003cstrong>résultat attendu\u003c/strong> de la chirurgie. En pratique :\u003c/p>\n\u003cul>\n\u003cli>Pas de corticothérapie (HSHC, dexaméthasone, etc.) en péri-opératoire\u003c/li>\n\u003cli>Dosage de la cortisolémie à 8 h à J1 post-opératoire\u003c/li>\n\u003cli>Mise en place d’une supplémentation avant les résultats si signes évidents d’insuffisance surrénalienne mal tolérée (hypotension, tachycardie). Il s’agit d’une insuffisance corticotrope centrale, mieux tolérée qu’une insuffisance surrénalienne aiguë primaire\u003c/li>\n\u003c/ul>\n","x":"L’insuffisance corticotrope aiguë est le résultat attendu de la chirurgie. En pratique : Pas de corticothérapie (HSHC, dexaméthasone, etc.) en péri-opératoire Dosage de la cortisolémie à 8 h à J1 post-opératoire Mise en place d’une supplémentation avant les résultats si signes évidents d’insuffisance surrénalienne mal tolérée (hypotension, tachycardie). Il s’agit d’une insuffisance corticotrope centrale, mieux tolérée qu’une insuffisance surrénalienne aiguë primaire"}]},{"id":"anesth-alif","s":"anesth","t":"Arthrodèse lombaire par voie antérieure","c":"ALIF","g":"Chirurgies spécifiques","i":"bone","p":[86],"r":"Risque hémorragique « tout ou rien », ischémie du membre inférieur gauche, curarisation prolongée.","m":"ALIF, arthrodèse, rachis, voie antérieure, plaie vasculaire, veine iliaque, Cell-Saver, ischémie, SpO2 pied gauche, curarisation","k":[{"t":"Indications","i":"circle-check","h":"\u003cp>Discopathies dégénératives, spondylolisthésis dégénératif ou par lyse isthmique, scolioses lombaires dégénératives.\u003c/p>\n","x":"Discopathies dégénératives, spondylolisthésis dégénératif ou par lyse isthmique, scolioses lombaires dégénératives."},{"t":"Étapes de la chirurgie","i":"clipboard-list","h":"\u003col>\n\u003cli>Incision cutanée abdominale\u003c/li>\n\u003cli>Accès au disque lombaire en réclinant les gros vaisseaux abdominaux (veine iliaque, artère iliaque, aorte et veine cave principalement)\u003c/li>\n\u003cli>Le disque est complètement vidé\u003c/li>\n\u003cli>La cage intersomatique est posée sous contrôle radiographique et fixée à l’aide d’ancres\u003c/li>\n\u003c/ol>\n","x":"Incision cutanée abdominale Accès au disque lombaire en réclinant les gros vaisseaux abdominaux (veine iliaque, artère iliaque, aorte et veine cave principalement) Le disque est complètement vidé La cage intersomatique est posée sous contrôle radiographique et fixée à l’aide d’ancres"},{"t":"Risque hémorragique « tout ou rien »","i":"triangle-alert","h":"\u003cp>Possible saignement important en cas de \u003cstrong>plaie vasculaire\u003c/strong>. Cela implique :\u003c/p>\n\u003cul>\n\u003cli>Groupe ABO 2 déterminations + RAI + NFS + coagulation\u003c/li>\n\u003cli>Mise en réserve à discuter\u003c/li>\n\u003cli>Conditionnement : \u003cstrong>2 VVP ; cathéter artériel\u003c/strong>\u003c/li>\n\u003cli>Cell-Saver® : au moins le bocal d’aspiration\u003c/li>\n\u003c/ul>\n\u003cblockquote class=\"callout callout-tip\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-lightbulb\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Astuce\u003c/span> La baisse transitoire des pressions de ventilation (et en particulier de la PEEP) peut faciliter le contrôle d’une plaie veineuse par le chirurgien.\u003c/p>\n\u003c/div>\u003c/blockquote>\n","x":"Possible saignement important en cas de plaie vasculaire . Cela implique : Groupe ABO 2 déterminations + RAI + NFS + coagulation Mise en réserve à discuter Conditionnement : 2 VVP ; cathéter artériel Cell-Saver® : au moins le bocal d’aspiration Astuce La baisse transitoire des pressions de ventilation (et en particulier de la PEEP) peut faciliter le contrôle d’une plaie veineuse par le chirurgien."},{"t":"Ischémie du membre inférieur gauche","i":"triangle-alert","h":"\u003cp>La manipulation des gros vaisseaux par les écarteurs peut provoquer une ischémie aiguë du membre inférieur gauche.\u003c/p>\n\u003cblockquote class=\"callout callout-important\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-circle-alert\"/>\u003c/svg>\u003cdiv>\u003cp>\u003cspan class=\"callout-label\">Important\u003c/span> \u003cstrong>La SpO2 est mise au pied gauche en cas d’ALIF L4-L5.\u003c/strong>\u003c/p>\n\u003c/div>\u003c/blockquote>\n\u003cfigure class=\"fig\">\u003cbutton type=\"button\" class=\"fig-btn\" data-zoom=\"figures/alif-ecarteurs.webp\" data-legende=\"Position des écarteurs selon le niveau de la chirurgie : L5-S1 (A) ou L4-L5 (B)\">\u003cimg src=\"figures/alif-ecarteurs.webp\" alt=\"Position des écarteurs selon le niveau de la chirurgie : L5-S1 (A) ou L4-L5 (B)\" width=\"869\" height=\"408\" loading=\"lazy\" decoding=\"async\">\u003cspan class=\"fig-zoom\">\u003csvg class=\"ic \" aria-hidden=\"true\">\u003cuse href=\"#i-zoom-in\"/>\u003c/svg> Agrandir\u003
